            right: 0;

            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;

{ id: 6, text: `Biện pháp tránh thai nào ngăn ngừa được cả thai nghén và bệnh lây truyền qua đường tình dục?`, answers: ['Vòng tránh thai', 'Bao cao su', 'Thuốc tránh thai', 'Triệt sản'], correct: "B", topic: "bai1" },

{ id: 10, text: `Xét nghiệm nào dùng để phát hiện sớm các tế bào bất thường tại cổ tử cung?`, answers: ['Siêu âm', 'Pap smear', 'Chụp X-quang', 'Xét nghiệm máu'], correct: "B", topic: "bai1" },
{ id: 11, text: `Thời điểm rụng trứng ở phụ nữ có chu kỳ 28 ngày thường là ngày thứ mấy?`, answers: ['Ngày 7', 'Ngày 14', 'Ngày 21', 'Ngày 28'], correct: "B", topic: "bai1" },

{ id: 13, text: `Phụ nữ tự khám vú tại nhà nên thực hiện vào thời điểm nào mỗi tháng?`, answers: ['Khi đang hành kinh', '3-5 ngày sau khi sạch kinh', 'Trước khi hành kinh', 'Ngày rụng trứng'], correct: "B", topic: "bai1" },
{ id: 14, text: `Triệu chứng thường gặp nhất của ung thư nội mạc tử cung ở phụ nữ mãn kinh là gì?`, answers: ['Ra máu âm đạo bất thường', 'Sụt cân nhanh', 'Đau bụng dưới', 'Sốt'], correct: "A", topic: "bai1" },

{ id: 28, text: `Đặc tính của ra máu âm đạo trong rau tiền đạo là:`, answers: ['Ra máu tươi kèm với đau bụng.', 'Ra máu đột ngột, không nguyên nhân báo trước, không kèm đau bụng.', 'Ra máu tươi đột ngột kèm đau bụng.', 'Ra máu tươi, có triệu chứng báo trước, kèm đau bụng.'], correct: "B", topic: "bai1" },
{ id: 29, text: `Chỉ số tim thai bình thường ở thai nhi khỏe mạnh nằm trong khoảng:`, answers: ['80 - 100 lần/phút', '120 - 160 lần/phút', '160 - 200 lần/phút', '60 - 80 lần/phút'], correct: "B", topic: "bai1" },

{ id: 129, text: `Theo dõi một thai phụ bị đa ối, bạn cần cảnh báo sản phụ về dấu hiệu nào cần vào viện ngay?`, answers: ['Đau bụng dữ dội, ra nước âm đạo đột ngột (vỡ ối) hoặc ra máu', 'Cảm thấy thai nhi đạp nhiều vào ban đêm', 'Bị tê các đầu ngón tay', 'Bị táo bón nhẹ'], correct: "A", topic: "bai1" },
{ id: 130, text: `Chăm sóc một thai phụ mang song thai, điều dưỡng cần tư vấn gì để phòng ngừa đẻ non?`, answers: ['Hạn chế làm việc nặng, đi khám thai thường xuyên hơn và nhận biết dấu hiệu cơn co tử cung sớm', 'Ăn gấp đôi lượng thức ăn của người bình thường', 'Chỉ nên nằm nghiêng bên phải khi ngủ', 'Không nên vận động dù là nhẹ nhàng'], correct: "A", topic: "bai1" },
{ id: 131, text: `Một phụ nữ thai 8 tuần bị nghén nặng, nôn tất cả mọi thứ sau khi ăn, sụt 3kg trong 1 tuần. Kế hoạch chăm sóc là:`, answers: ['Nhập viện truyền dịch bồi phụ điện giải, chia nhỏ bữa ăn và ăn các thức ăn khô, dễ tiêu', 'Khuyên bệnh nhân cố gắng ăn thật nhiều trong một bữa', 'Cho uống thuốc cầm nôn liều cao và về nhà theo dõi', 'Khuyên bệnh nhân nên đình chỉ thai nghén vì cơ thể không chịu đựng được'], correct: "A", topic: "bai1" },
{ id: 132, text: `Tại sao trong nhiều tình huống cấp cứu sản khoa, điều dưỡng thường cho thai phụ nằm nghiêng trái?`, answers: ['Để làm thai phụ ngủ sâu hơn.', 'Để giảm chèn ép tĩnh mạch chủ dưới, cải thiện tuần hoàn mẹ và tưới máu thai.', 'Để làm giảm hoàn toàn cơn co tử cung.', 'Để thai phụ không cần theo dõi tim thai.'], correct: "B", topic: "bai1" },
{ id: 133, text: `Khi thai phụ đang được điều trị bằng Magnesium sulfate, vì sao điều dưỡng phải theo dõi nhịp thở, phản xạ gân xương và lượng nước tiểu?`, answers: ['Để đánh giá tình trạng ăn uống của thai phụ.', 'Để phát hiện sớm dấu hiệu ngộ độc Magnesium sulfate.', 'Để xác định giới tính thai nhi.', 'Để làm giảm nhu cầu dùng thuốc hạ áp.'], correct: "B", topic: "bai1" },
{ id: 134, text: `Tại sao cần hạn chế thăm âm đạo nhiều lần ở thai phụ vỡ ối sớm?`, answers: ['Vì có thể làm tăng nguy cơ nhiễm khuẩn ngược dòng.', 'Vì sẽ làm thai phụ tăng cân nhanh.', 'Vì làm giảm hoàn toàn cơn co tử cung.', 'Vì khiến thai nhi ngủ nhiều hơn.'], correct: "A", topic: "bai1" },
{ id: 135, text: `Thai phụ thiếu máu thiếu sắt được kê viên sắt. Nội dung tư vấn nào phù hợp nhất?`, answers: ['Uống thuốc theo y lệnh, có thể dùng cùng nước giàu vitamin C và tránh uống cùng trà/cà phê.', 'Tự ngừng sắt khi phân sẫm màu.', 'Uống sắt cùng trà đặc để dễ hấp thu.', 'Chỉ ăn cháo trắng để giảm buồn nôn.'], correct: "A", topic: "bai1" },
{ id: 136, text: `Vì sao không được tự ý thăm âm đạo khi nghi ngờ rau tiền đạo có ra máu?`, answers: ['Vì có thể làm rau bong thêm và gây chảy máu nặng.', 'Vì sẽ làm thai phụ tăng huyết áp tức thì.', 'Vì làm mất tác dụng của thuốc giảm đau.', 'Vì không ảnh hưởng gì đến kết quả khám.'], correct: "A", topic: "bai1" },
{ id: 137, text: `Mục tiêu chính của tư vấn chia nhỏ bữa ăn và hạn chế đường đơn cho thai phụ đái tháo đường thai kỳ là gì?`, answers: ['Giữ đường huyết ổn định và giảm nguy cơ thai to.', 'Làm thai phụ không tăng cân trong suốt thai kỳ.', 'Thay thế hoàn toàn việc theo dõi đường huyết.', 'Làm nước ối tăng nhanh.'], correct: "A", topic: "bai1" },
{ id: 138, text: `Thai phụ có nguy cơ sinh non cần được hướng dẫn nhận biết dấu hiệu nào để đi khám ngay?`, answers: ['Cơn co tử cung đều, đau bụng từng cơn, ra dịch âm đạo hoặc ra máu.', 'Thèm ăn nhiều hơn vào buổi tối.', 'Móng tay dài nhanh.', 'Da bụng căng nhẹ nhưng không đau.'], correct: "A", topic: "bai1" },
{ id: 139, text: `Ý nghĩa của theo dõi protein niệu ở thai phụ tiền sản giật là gì?`, answers: ['Đánh giá mức độ tổn thương thận và diễn biến nặng của bệnh.', 'Đánh giá khả năng tiết sữa sau sinh.', 'Xác định nhóm máu của thai phụ.', 'Chẩn đoán chắc chắn ngôi thai.'], correct: "A", topic: "bai1" },
{ id: 140, text: `Ở thai phụ nghén nặng, dấu hiệu nào gợi ý mất nước cần được báo bác sĩ?`, answers: ['Tiểu ít, khô môi, mệt lả hoặc sụt cân nhanh.', 'Ăn ngon miệng hơn.', 'Ngủ đủ giấc.', 'Tăng cân đều mỗi tuần.'], correct: "A", topic: "bai1" },
{ id: 141, text: `Hiện tượng "lên sữa" thường xảy ra vào ngày thứ mấy sau khi sản phụ sinh con?`, answers: ['Ngay lập tức sau khi sinh.', 'Ngày thứ 2 đến ngày thứ 4 sau sinh.', 'Sau khi sinh được 1 tuần.', 'Sau khi sinh được 1 tháng.'], correct: "B", topic: "bai1" },
{ id: 142, text: `Xử trí tích cực giai đoạn 3 (giai đoạn sổ nhau) có mục đích quan trọng nhất là giảm nguy cơ:`, answers: ['Nhiễm trùng hậu sản.', 'Băng huyết sau sinh.', 'Tắc tia sữa ở mẹ.', 'Trầm cảm sau sinh.'], correct: "B", topic: "bai1" },
{ id: 143, text: `Trong quy trình chăm sóc hậu sản, việc đánh giá độ co hồi tử cung được đo bằng:`, answers: ['Tổng chiều cao bụng của sản phụ.', 'Khoảng cách từ bờ trên xương vệ đến đáy tử cung.', 'Số đo vòng bụng của sản phụ tại vị trí rốn.', 'Tổng cân nặng của sản phụ sau khi sinh.'], correct: "B", topic: "bai1" },
{ id: 144, text: `Sau khi sinh, trung bình mỗi ngày tử cung của sản phụ co hồi nhỏ đi khoảng:`, answers: ['0.5 cm.', '1 cm.', '2 cm.', '3 cm.'], correct: "B", topic: "bai1" },
{ id: 145, text: `Sản dịch có đặc điểm màu đỏ thẫm (máu ròng) thường chỉ kéo dài trong bao lâu?`, answers: ['2 - 3 ngày đầu sau sinh.', 'Kéo dài suốt 1 tuần đầu.', 'Kéo dài suốt 2 tuần đầu.', 'Kéo dài suốt 6 tuần hậu sản.'], correct: "A", topic: "bai1" },
{ id: 146, text: `Hiện tượng "rét run sinh lý" xuất hiện ngay sau đẻ thường có nguyên nhân do:`, answers: ['Sản phụ bị nhiễm trùng huyết cấp tính.', 'Mất nhiệt đột ngột từ buồng tử cung và sự thay đổi nội tiết tố.', 'Sản phụ bị mất quá nhiều máu trong quá trình đẻ.', 'Do sản phụ bị sợ hãi tâm lý quá mức.'], correct: "B", topic: "bai1" },
{ id: 147, text: `Đối với sản phụ mổ lấy thai, thời điểm bắt đầu cho trẻ bú mẹ sớm nhất là khi nào?`, answers: ['Sau 24 giờ kể từ khi mẹ tỉnh hẳn sau gây mê.', 'Càng sớm càng tốt ngay khi người mẹ có thể bế được con.', 'Đợi cho đến khi vết mổ thành bụng đã được cắt chỉ.', 'Sau 3 ngày khi tuyến vú đã bắt đầu tiết sữa già.'], correct: "B", topic: "bai1" },
{ id: 148, text: `Trong chăm sóc sản phụ sau mổ ngày đầu, việc vận động sớm mang lại lợi ích gì?`, answers: ['Có thể gây liệt ruột cơ năng.', 'Chỉ nhằm mục đích làm vết mổ nhanh lành.', 'Kích thích nhu động ruột hoạt động sớm, tránh dính ruột.', 'Giúp giảm đau hoàn toàn sau phẫu thuật.'], correct: "C", topic: "bai1" },
{ id: 149, text: `Nhận định tình trạng sản dịch bình thường vào ngày thứ 3 sau đẻ là:`, answers: ['Sản dịch màu đỏ thẫm, lượng giảm dần, không có mùi hôi.', 'Sản dịch có mủ màu xanh và mùi hôi thối.', 'Sản dịch đỏ tươi như máu ròng với số lượng rất nhiều.', 'Hoàn toàn không còn sản dịch tiết ra ngoài âm đạo.'], correct: "A", topic: "bai1" },
{ id: 150, text: `Trong kỹ thuật cho bú, dấu hiệu nào chứng tỏ trẻ đã ngậm bắt vú đúng cách?`, answers: ['Miệng mở rộng, môi dưới hướng ra ngoài, miệng ngậm phần lớn quầng vú.', 'Trẻ chỉ ngậm chặt phần núm vú của mẹ.', 'Nghe thấy tiếng mút "chùn chụt" rất rõ rệt khi trẻ bú.', 'Má của trẻ bị lõm sâu vào trong khi đang mút sữa.'], correct: "A", topic: "bai1" },
{ id: 151, text: `Một sản phụ có HIV (+) muốn nuôi con, tư vấn tốt nhất theo khuyến cáo hiện nay là:`, answers: ['Nuôi con bằng sữa thay thế hoàn toàn nếu điều kiện kinh tế và vệ sinh cho phép.', 'Cho bú mẹ kết hợp xen kẽ với sữa ngoài.', 'Cho bú mẹ hoàn toàn trong 6 tháng đầu rồi cai sữa thật nhanh.', 'Chỉ cho bú sữa mẹ sau khi đã đun sôi sữa để diệt virus.'], correct: "A", topic: "bai1" },
{ id: 152, text: `Nguyên nhân phổ biến nhất dẫn đến viêm vú sau sinh là:`, answers: ['Tắc tia sữa kéo dài không được xử trí dẫn đến nhiễm khuẩn.', 'Do cơ địa người mẹ tiết ra quá ít sữa.', 'Do chế độ ăn uống của người mẹ chứa quá nhiều chất béo.', 'Do trẻ lười bú làm sữa bị ứ đọng nhẹ.'], correct: "A", topic: "bai1" },
{ id: 153, text: `Theo dõi sản phụ sau đẻ trong giờ đầu tiên, nội dung quan trọng nhất cần kiểm tra là:`, answers: ['Tình trạng ăn uống và cảm giác ngon miệng.', 'Khả năng bài tiết sữa của hai bầu vú.', 'Sự co hồi của tử cung và tình trạng chảy máu âm đạo.', 'Tình trạng đại tiện và tiểu tiện của sản phụ.'], correct: "C", topic: "bai1" },
{ id: 154, text: `Thời điểm "vàng" để thực hiện xét nghiệm sàng lọc sơ sinh (lấy máu gót chân) là:`, answers: ['Ngay sau khi sinh được 1 giờ.', 'Từ 48 đến 72 giờ sau khi sinh.', 'Sau khi trẻ đã tròn 1 tháng tuổi.', 'Khi trẻ bắt đầu giai đoạn ăn dặm.'], correct: "B", topic: "bai1" },
{ id: 155, text: `Một trẻ sơ sinh bị hạ đường huyết thường có các biểu hiện lâm sàng nào?`, answers: ['Run rẩy, quấy khóc, li bì hoặc biểu hiện bú kém.', 'Da dẻ đỏ hồng, căng bóng.', 'Ngủ rất sâu và không hề quấy khóc.', 'Đi tiểu rất nhiều lần trong ngày.'], correct: "A", topic: "bai1" },
{ id: 156, text: `Cách xử trí đúng khi sản phụ bị tắc tia sữa mức độ nhẹ tại nhà là:`, answers: ['Ngừng ngay việc cho con bú bên bầu vú bị tắc.', 'Chườm ấm, massage vú và tiếp tục cho con bú hoặc tích cực hút sữa.', 'Chườm đá thật lạnh lên vùng vú bị đau.', 'Tự mua và uống thuốc kháng sinh ngay lập tức.'], correct: "B", topic: "bai1" },
{ id: 157, text: `Chăm sóc sản phụ sau sinh bị bí tiểu, bước đầu tiên điều dưỡng nên thực hiện là:`, answers: ['Khuyến khích sản phụ ngồi dậy vận động và thử đi tiểu tự nhiên.', 'Tiến hành đặt ống thông tiểu ngay lập tức.', 'Hạn chế cho sản phụ uống nước để giảm áp lực bàng quang.', 'Tiêm các loại thuốc lợi tiểu mạnh.'], correct: "A", topic: "bai1" },
{ id: 158, text: `Thời gian bảo quản sữa mẹ tối đa ở nhiệt độ phòng (khoảng 25°C) là:`, answers: ['1 giờ.', '4 - 6 giờ.', '24 giờ.', '2 ngày.'], correct: "B", topic: "bai1" },
{ id: 159, text: `Kỹ thuật lấy máu gót chân ở trẻ sơ sinh nhằm mục đích tầm soát các bệnh lý:`, answers: ['Suy giáp bẩm sinh, thiếu men G6PD, tăng sản tuyến thượng thận bẩm sinh.', 'Viêm phổi cấp tính.', 'Cận thị bẩm sinh.', 'Tình trạng suy dinh dưỡng bào thai.'], correct: "A", topic: "bai1" },
{ id: 160, text: `Tại sao không nên cho trẻ sơ sinh dưới 6 tháng tuổi uống thêm nước lọc?`, answers: ['Sữa mẹ đã đủ nước và uống nước lọc làm tăng nguy cơ nhiễm khuẩn.', 'Nước lọc làm cho trẻ sớm bị đau răng.', 'Nước lọc là dung dịch quá đắt tiền đối với trẻ sơ sinh.', 'Trẻ sẽ dễ bị nghiện nước lọc và bỏ bú mẹ.'], correct: "A", topic: "bai1" },
{ id: 161, text: `Bệnh nhân nữ 22 tuổi, đến tư vấn vì quên uống 2 viên thuốc tránh thai phối hợp liên tiếp ở tuần thứ 2. Hành động chăm sóc/tư vấn nào là ưu tiên?`, answers: ['Hướng dẫn uống bù ngay 2 viên khi nhớ ra, uống viên tiếp theo đúng giờ và dùng bao cao su hỗ trợ trong 7 ngày', 'Khuyên bệnh nhân dừng vỉ thuốc cũ và chờ đến khi có kinh mới bắt đầu lại', 'Yêu cầu bệnh nhân đi thử thai ngay lập tức bằng xét nghiệm máu', 'Tư vấn bệnh nhân chuyển sang phương pháp triệt sản vì hay quên'], correct: "A", topic: "bai1" },
{ id: 162, text: `Sau khi đặt dụng cụ tử cung (vòng tránh thai), bệnh nhân phàn nàn về việc đau bụng dưới nhẹ và ra máu thấm giọt. Điều dưỡng nên xử trí thế nào?`, answers: ['Yêu cầu bệnh nhân đi tháo vòng ngay vì có dấu hiệu đẩy vỉ', 'Giải thích đây là phản ứng bình thường của tử cung, hướng dẫn bệnh nhân nghỉ ngơi và theo dõi thêm', 'Cho bệnh nhân uống kháng sinh liều cao để phòng nhiễm trùng vùng chậu', 'Khuyên bệnh nhân vận động mạnh để vòng sớm ổn định vị trí'], correct: "B", topic: "bai1" },
{ id: 163, text: `Chăm sóc một nữ sinh 19 tuổi bị thống kinh nguyên phát mức độ nặng, lời khuyên về lối sống nào là phù hợp nhất để giảm triệu chứng lâu dài?`, answers: ['Chỉ nằm nghỉ tuyệt đối trên giường trong suốt những ngày hành kinh', 'Chườm ấm vùng bụng dưới, tập thể dục nhẹ nhàng và hạn chế thức ăn quá mặn/cay', 'Uống thuốc giảm đau liều cao ngay khi bắt đầu chu kỳ mà không cần ăn lót dạ', 'Nhịn ăn để tránh tình trạng buồn nôn khi tử cung co bóp'], correct: "B", topic: "bai1" },
{ id: 164, text: `Một phụ nữ 45 tuổi có khối u xơ tử cung lớn gây rong kinh kéo dài. Trong kế hoạch chăm sóc trước mổ, nội dung nào là quan trọng nhất để đảm bảo an toàn cho cuộc phẫu thuật?`, answers: ['Hướng dẫn bệnh nhân cách tự thụt tháo âm đạo tại nhà', 'Theo dõi sát chỉ số huyết sắc tố (Hb) và tình trạng thiếu máu để phối hợp truyền máu nếu cần', 'Yêu cầu bệnh nhân nhịn ăn hoàn toàn trước 2 ngày phẫu thuật', 'Tư vấn về việc nuôi con bằng sữa mẹ sau khi cắt tử cung'], correct: "B", topic: "bai1" },
{ id: 165, text: `Tiếp nhận bệnh nhân viêm âm đạo do nấm Candida có triệu chứng ngứa rát dữ dội. Khi hướng dẫn sử dụng thuốc đặt âm đạo, điều dưỡng cần lưu ý điều gì?`, answers: ['Nên đặt thuốc vào buổi sáng trước khi đi làm để thuốc ngấm tốt hơn', 'Vệ sinh tay sạch sẽ, đặt thuốc vào buổi tối trước khi ngủ và tránh quan hệ tình dục trong thời gian điều trị', 'Nếu thấy đỡ ngứa thì có thể ngừng thuốc ngay sau 2 ngày để tránh nhờn thuốc', 'Đặt thuốc càng sâu càng tốt, kể cả khi đang có kinh nguyệt nhiều'], correct: "B", topic: "bai1" },
{ id: 166, text: `Một phụ nữ 52 tuổi ra máu âm đạo bất thường sau mãn kinh. Trong khi chờ kết quả sinh thiết nội mạc tử cung, thái độ chăm sóc tâm lý nào là phù hợp?`, answers: ['Khẳng định chắc chắn với bệnh nhân rằng đây chỉ là rối loạn nội tiết thông thường', 'Lắng nghe lo lắng của bệnh nhân, giải thích mục đích của xét nghiệm và tránh đưa ra kết luận sớm', 'Khuyên bệnh nhân chuẩn bị sẵn tâm lý vì 100% các ca này là ung thư ác tính', 'Hạn chế tiếp xúc để bệnh nhân tự suy ngẫm về tình trạng sức khỏe'], correct: "B", topic: "bai1" },
{ id: 167, text: `Bệnh nhân sau phẫu thuật đoạn nhũ do ung thư vú. Để phòng ngừa phù tay bên phẫu thuật, điều dưỡng cần hướng dẫn bệnh nhân:`, answers: ['Luôn để xuôi tay bên phẫu thuật theo dọc thân mình khi ngủ', 'Tránh đo huyết áp, tiêm truyền hoặc xách vật nặng bằng tay bên phía phẫu thuật', 'Băng ép thật chặt toàn bộ cánh tay từ vai xuống cổ tay', 'Tuyệt đối không được cử động các ngón tay bên phía phẫu thuật'], correct: "B", topic: "bai1" },
{ id: 168, text: `Tư vấn cho một phụ nữ muốn sử dụng phương pháp "Vô kinh cho bú" (LAM) để tránh thai. Điều kiện nào dưới đây là bắt buộc để phương pháp có hiệu quả?`, answers: ['Chỉ cần cho bú mẹ là đủ, không quan trọng tần suất', 'Con dưới 6 tháng tuổi, chưa có kinh trở lại và cho trẻ bú mẹ hoàn toàn', 'Trẻ đã bắt đầu ăn dặm nhưng vẫn bú mẹ vào ban đêm', 'Phải dùng kèm thêm thuốc tránh thai phối hợp để tăng hiệu quả'], correct: "B", topic: "bai1" },
{ id: 169, text: `Một bệnh nhân bị viêm vùng chậu (PID) đang điều trị nội trú. Dấu hiệu nào sau đây cần báo bác sĩ ngay lập tức vì nghi ngờ biến chứng áp xe phần phụ bị vỡ?`, answers: ['Bệnh nhân thấy ra ít khí hư màu trắng trong', 'Đau bụng đột ngột, dữ dội khắp bụng, dấu hiệu cảm ứng phúc mạc dương tính và sốt cao', 'Bệnh nhân cảm thấy hơi mệt mỏi sau khi tiêm kháng sinh', 'Kinh nguyệt xuất hiện sớm hơn dự kiến 2 ngày'], correct: "B", topic: "bai1" },
{ id: 170, text: `Chăm sóc bệnh nhân có u xơ tử cung dưới niêm mạc đang bị xuất huyết âm đạo cấp tính. Tư thế nằm nào là ưu tiên để cải thiện tưới máu não?`, answers: ['Nằm đầu thấp, gác chân cao (tư thế Trendelenburg nếu có cho phép)', 'Nằm ngửa, đầu cao 45 độ (tư thế Fowler)', 'Nằm sấp để ép vào tử cung hạn chế chảy máu', 'Nằm nghiêng sang bên phải hoàn toàn'], correct: "A", topic: "bai1" },
{ id: 171, text: `Khi thực hiện tư vấn cho cộng đồng về tầm soát ung thư cổ tử cung, điều dưỡng cần nhấn mạnh đối tượng nào cần thực hiện xét nghiệm Pap smear thường xuyên nhất?`, answers: ['Chỉ những phụ nữ trên 50 tuổi mới cần làm', 'Phụ nữ trong độ tuổi sinh đẻ đã có quan hệ tình dục', 'Những người có tiền sử gia đình bị ung thư phổi', 'Tất cả trẻ em gái ngay sau khi tiêm đủ vaccine HPV'], correct: "B", topic: "bai1" },
{ id: 172, text: `Bệnh nhân nữ 28 tuổi, sau khi cấy que tránh thai (Implanon) phàn nàn về tình trạng rong huyết nhẹ kéo dài. Cách xử trí điều dưỡng nào là đúng?`, answers: ['Khuyên bệnh nhân đi tháo que ngay vì cơ thể không dung nạp', 'Giải thích đây là tác dụng phụ thường gặp trong vài tháng đầu, tư vấn bệnh nhân theo dõi và dùng thuốc theo chỉ định', 'Yêu cầu bệnh nhân nằm bất động tại giường trong 1 tuần', 'Tư vấn bệnh nhân uống thật nhiều nước rau má để cầm máu'], correct: "B", topic: "bai1" },
{ id: 173, text: `Hướng dẫn bệnh nhân tự khám vú tại nhà, điều dưỡng nên dạy bệnh nhân quan sát các dấu hiệu bất thường nào trước gương?`, answers: ['Chỉ cần xem kích thước hai vú có bằng nhau tuyệt đối hay không', 'Sự thay đổi màu sắc da vú, tình trạng co kéo núm vú hoặc da cam, và dịch tiết từ núm vú', 'Xem vú có bị căng đau nhẹ trước kỳ kinh hay không', 'Tìm kiếm các nốt mụn trứng cá nhỏ trên quầng vú'], correct: "B", topic: "bai1" },
{ id: 174, text: `Một phụ nữ sau phá thai bằng thuốc thành công quay lại tái khám. Nội dung giáo dục sức khỏe nào là quan trọng nhất lúc này để tránh hệ lụy tương lai?`, answers: ['Tư vấn và lựa chọn ngay một biện pháp tránh thai phù hợp để tránh mang thai ngoài ý muốn tái diễn', 'Hướng dẫn bệnh nhân nhịn ăn chất béo trong vòng 1 tháng', 'Khuyên bệnh nhân không nên đi làm hay vận động trong vòng 3 tháng tới', 'Yêu cầu bệnh nhân uống kháng sinh dự phòng liên tục trong nửa năm'], correct: "A", topic: "bai1" },
{ id: 175, text: `Trong quy trình lấy bệnh phẩm làm xét nghiệm Pap smear, điều dưỡng cần hướng dẫn bệnh nhân điều gì để kết quả chính xác nhất?`, answers: ['Nên thụt rửa âm đạo thật sạch bằng dung dịch sát khuẩn trước khi khám', 'Không quan hệ tình dục, không thụt rửa âm đạo và không dùng thuốc đặt trong vòng 24-48 giờ trước đó', 'Đi khám vào đúng những ngày đang có kinh nguyệt nhiều nhất', 'Phải nhịn ăn sáng trước khi thực hiện lấy mẫu'], correct: "B", topic: "bai1" },
{ id: 176, text: `Chăm sóc bệnh nhân sau phẫu thuật cắt tử cung toàn phần. Để phòng ngừa biến chứng huyết khối tĩnh mạch sâu, điều dưỡng nên:`, answers: ['Cho bệnh nhân nằm yên một chỗ trong 3 ngày đầu', 'Khuyến khích bệnh nhân vận động sớm tại giường và tập đi lại nhẹ nhàng khi ổn định', 'Massage mạnh vùng bắp chân hàng giờ', 'Hạn chế cho bệnh nhân uống nước để giảm đi tiểu'], correct: "B", topic: "bai1" },
{ id: 177, text: `Bệnh nhân nam đưa vợ đi khám vì sùi mào gà. Khi tư vấn về chăm sóc và phòng bệnh, điều dưỡng cần lưu ý gì về phía người chồng?`, answers: ['Chỉ cần điều trị cho người vợ vì người chồng không có biểu hiện gì', 'Cần kiểm tra và điều trị cho cả người chồng vì đây là bệnh lây truyền qua đường tình dục', 'Khuyên người chồng uống vitamin C để tự khỏi bệnh', 'Cách ly hoàn toàn đồ dùng cá nhân và không được chung sống cùng nhà'], correct: "B", topic: "bai1" },
{ id: 178, text: `Một phụ nữ bị buồng trứng đa nang (PCOS) đang được điều trị để hỗ trợ sinh sản. Vai trò của điều dưỡng trong việc tư vấn thay đổi lối sống là:`, answers: ['Hướng dẫn chế độ ăn giảm tinh bột đường và tăng cường vận động để kiểm soát cân nặng, giúp cải thiện sự rụng trứng', 'Khuyên bệnh nhân ăn thật nhiều thực phẩm chứa mỡ động vật để tăng hormone', 'Tư vấn bệnh nhân nên nghỉ làm để tránh căng thẳng tuyệt đối', 'Hướng dẫn bệnh nhân sử dụng các loại lá cây dân gian để làm sạch nang'], correct: "A", topic: "bai1" },
{ id: 179, text: `Khi thực hiện kỹ thuật thụt tháo cho bệnh nhân chuẩn bị phẫu thuật phụ khoa, nếu bệnh nhân kêu đau bụng dữ dội và có dấu hiệu vã mồ hôi, điều dưỡng nên:`, answers: ['Tiếp tục thực hiện nhanh hơn để kết thúc sớm', 'Ngừng ngay thủ thuật, kiểm tra mạch, huyết áp và báo cáo bác sĩ kịp thời', 'Yêu cầu bệnh nhân cố gắng chịu đựng vì đây là phản ứng bình thường', 'Đổ thêm nước nóng vào bình thụt để làm dịu cơn đau'], correct: "B", topic: "bai1" },
{ id: 180, text: `Sau khi hướng dẫn bệnh nhân cách theo dõi chu kỳ kinh nguyệt bằng biểu đồ nhiệt độ, tiêu chuẩn nào cho thấy bệnh nhân có khả năng đã rụng trứng?`, answers: ['Nhiệt độ cơ thể giảm liên tục trong suốt chu kỳ', 'Nhiệt độ cơ thể tăng nhẹ (khoảng 0.3 - 0.5 độ C) và duy trì ở mức cao trong nửa sau chu kỳ', 'Nhiệt độ đột ngột giảm mạnh vào ngày cuối cùng của kỳ kinh', 'Nhiệt độ biến thiên thất thường, không có quy luật nào'], correct: "B", topic: "bai1" },
{ id: 181, text: `Tiếp nhận sản phụ thai 32 tuần vào viện vì đau bụng từng cơn, ra chút dịch hồng âm đạo. Hành động chăm sóc nào là ưu tiên số 1?`, answers: ['Hướng dẫn sản phụ đi lại để mau đẻ', 'Cho sản phụ nằm nghỉ tuyệt đối tại giường, theo dõi tim thai và cơn co tử cung', 'Chuẩn bị dụng cụ để đỡ đẻ ngay', 'Cho sản phụ ăn một bữa thật no để lấy sức'], correct: "B", topic: "bai1" },
{ id: 182, text: `Đang theo dõi chuyển dạ cho sản phụ thai 39 tuần, đột ngột nước ối vỡ xanh bẩn, tim thai giảm xuống còn 90 lần/phút. Điều dưỡng cần làm gì ngay lập tức?`, answers: ['Tiếp tục theo dõi thêm 30 phút nữa', 'Cho sản phụ nằm nghiêng trái, thở oxy qua mask và báo gấp bác sĩ mổ lấy thai cấp cứu', 'Khuyên sản phụ bình tĩnh hít thở sâu', 'Đi lấy phiếu xét nghiệm máu bổ sung'], correct: "B", topic: "bai1" },
{ id: 183, text: `Sản phụ sau sổ rau 15 phút, đột ngột máu âm đạo chảy ra ồ ạt đỏ tươi, khám thấy tử cung mềm nhão, không có khối cầu an toàn. Hành động xử trí tích cực nào đúng nhất?`, answers: ['Xoa hồi sức tử cung qua thành bụng và dùng thuốc tăng co (Oxytocin) theo y lệnh', 'Đi tìm dụng cụ khâu tầng sinh môn', 'Cho sản phụ uống nước muối ấm', 'Nhấc chân sản phụ lên cao và đợi máu tự cầm'], correct: "A", topic: "bai1" },
{ id: 184, text: `Đang chăm sóc sản phụ tiền sản giật nặng đang truyền MgSO4, bạn phát hiện nhịp thở sản phụ còn 12 lần/phút, phản xạ đầu gối mất. Bạn nên xử trí như thế nào?`, answers: ['Tăng tốc độ truyền MgSO4 lên', 'Ngừng truyền MgSO4 ngay lập tức và chuẩn bị thuốc đối kháng là Canxi Gluconat', 'Kê gối cao cho sản phụ dễ thở', 'Cho sản phụ uống thêm nước'], correct: "B", topic: "bai1" },
{ id: 185, text: `Sản phụ thai 38 tuần vào viện vì đau bụng dữ dội, tử cung co cứng như gỗ, tim thai không nghe thấy, huyết áp hạ. Bạn nghi ngờ bệnh lý gì và cần chuẩn bị gì?`, answers: ['Rau bong non thể nặng; cần lập 2 đường truyền tĩnh mạch lớn và chuẩn bị mổ cấp cứu', 'Chuyển dạ đẻ thường; chuẩn bị bộ đồ đỡ đẻ', 'Thai lưu; hướng dẫn sản phụ về nhà theo dõi', 'Viêm ruột thừa; chuyển sang khoa ngoại'], correct: "A", topic: "bai1" },
{ id: 186, text: `Hướng dẫn một sản phụ sau sinh cách vệ sinh vùng kín để phòng nhiễm khuẩn hậu sản, nội dung nào là đúng nhất?`, answers: ['Thụt rửa sâu trong âm đạo bằng thuốc sát khuẩn hàng ngày', 'Rửa vùng kín bằng nước sạch/dung dịch vệ sinh từ trước ra sau sau mỗi lần đi tiêu tiểu, giữ khô', 'Ngâm mình trong bồn nước ấm để vết khâu mau lành', 'Dùng bông gòn nút kín âm đạo để sản dịch không chảy ra ngoài'], correct: "B", topic: "bai1" },
{ id: 187, text: `Phát hiện một sản phụ sau sinh ngày thứ 3 bị sốt 38.5 độ, sản dịch hôi, tử cung co hồi chậm và đau khi ấn vào. Bạn cần thực hiện chăm sóc gì?`, answers: ['Cách ly sản phụ, lấy bệnh phẩm dịch âm đạo làm kháng sinh đồ và thực hiện y lệnh kháng sinh', 'Chỉ cần chườm mát và cho sản phụ uống nhiều nước', 'Hướng dẫn sản phụ vận động mạnh để đẩy sản dịch ra', 'Cho con ngừng bú hoàn toàn vì sữa có thể bị nhiễm khuẩn'], correct: "A", topic: "bai1" },
{ id: 188, text: `Theo dõi một thai phụ bị Đái tháo đường thai kỳ, nội dung giáo dục sức khỏe nào quan trọng nhất để tránh thai to và hạ đường huyết cho con?`, answers: ['Kiểm soát chế độ ăn (giảm đường, tinh bột) và theo dõi đường huyết mao mạch thường xuyên', 'Khuyên thai phụ nằm nghỉ tuyệt đối tại giường', 'Uống thật nhiều nước ngọt khi cảm thấy mệt', 'Chỉ ăn rau xanh và bỏ hoàn toàn cơm'], correct: "A", topic: "bai1" },
{ id: 189, text: `TÌNH HUỐNG: Thai phụ 36 tuần có huyết áp 170/110 mmHg, đau đầu nhiều, hoa mắt và phù mặt. Hành động chăm sóc ưu tiên của điều dưỡng là gì?`, answers: ['Cho thai phụ nằm nghỉ, hạn chế kích thích, theo dõi huyết áp - tim thai và báo bác sĩ ngay.', 'Cho thai phụ đi bộ để hạ huyết áp.', 'Khuyên thai phụ về nhà theo dõi thêm.', 'Cho uống nước đường để giảm đau đầu.'], correct: "A", topic: "bai1" },
{ id: 190, text: `TÌNH HUỐNG: Thai phụ 34 tuần vỡ ối đã 18 giờ, sốt 38.5°C, nước ối có mùi hôi. Nhận định và xử trí điều dưỡng phù hợp nhất là gì?`, answers: ['Nghi nhiễm khuẩn ối, báo bác sĩ, theo dõi dấu hiệu sinh tồn và tình trạng thai.', 'Đây là hiện tượng bình thường, tiếp tục cho về nhà.', 'Khuyên thai phụ tự thụt rửa âm đạo.', 'Cho thai phụ ăn no và vận động mạnh.'], correct: "A", topic: "bai1" },
{ id: 191, text: `TÌNH HUỐNG: Thai phụ đã được chẩn đoán rau tiền đạo, vào viện vì ra máu đỏ tươi không đau bụng. Điều dưỡng cần ưu tiên làm gì?`, answers: ['Không thăm âm đạo, theo dõi mạch - huyết áp - lượng máu mất, lập đường truyền và báo bác sĩ.', 'Thăm âm đạo nhiều lần để xác định cổ tử cung mở.', 'Cho thai phụ tự đi vệ sinh một mình.', 'Khuyên thai phụ chờ máu tự cầm tại nhà.'], correct: "A", topic: "bai1" },
{ id: 192, text: `TÌNH HUỐNG: Thai phụ 32 tuần sau té ngã, đau bụng liên tục, tử cung căng cứng và ra ít máu sẫm. Điều dưỡng cần nghĩ đến bệnh lý nào và xử trí ra sao?`, answers: ['Nghi rau bong non, theo dõi dấu hiệu choáng - tim thai và chuẩn bị cấp cứu theo y lệnh.', 'Nghi nghén sinh lý, cho uống nước ấm.', 'Nghi viêm âm đạo, hướng dẫn đặt thuốc tại nhà.', 'Nghi táo bón, khuyên ăn nhiều rau.'], correct: "A", topic: "bai1" },
{ id: 193, text: `TÌNH HUỐNG: Thai phụ đái tháo đường thai kỳ chuẩn bị sinh. Nội dung phối hợp chăm sóc nào quan trọng để giảm nguy cơ hạ đường huyết sơ sinh?`, answers: ['Kiểm soát đường huyết mẹ, chuẩn bị theo dõi đường huyết trẻ sau sinh và phối hợp với bác sĩ/nhi khoa.', 'Cho mẹ ăn thật nhiều bánh kẹo trước sinh.', 'Không cần theo dõi trẻ nếu trẻ khóc to.', 'Ngừng mọi theo dõi đường huyết khi vào viện.'], correct: "A", topic: "bai1" },

     let currentTopic = null;
    let shuffleQuestions = true;
    let shuffleAnswers = true;
    let currentQuestions = [];
    let userSelections = {};
    let answersMapping = new Map();
    
    const questionsContainer = document.getElementById("questionsContainer");
    const scoreContainer = document.getElementById("scoreContainer");
    const shuffleQuestionsToggle = document.getElementById("shuffleQuestionsToggle");
    const shuffleAnswersToggle = document.getElementById("shuffleAnswersToggle");
    const liveScoreSpan = document.getElementById("liveScore");
    
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
    
    function getFilteredQuestions() {
        if (!currentTopic) return [];
        let filtered = QUESTION_SET.filter(q => currentTopic === "all" || q.topic === currentTopic);
        let result = [...filtered];
        if (shuffleQuestions) result = shuffleArray(result);
        return result;
    }
    
    function buildAnswerMapping(question) {
        const originalAnswers = question.answers;
        const correctIndex = question.correct.charCodeAt(0) - 65;
        const correctText = originalAnswers[correctIndex];
        
        if (!shuffleAnswers) {
            return {
                displayList: [
                    { letter: "A", text: originalAnswers[0] },
                    { letter: "B", text: originalAnswers[1] },
                    { letter: "C", text: originalAnswers[2] },
                    { letter: "D", text: originalAnswers[3] }
                ],
                correctLetterDisplay: question.correct
            };
        } else {
            let items = originalAnswers.map((text, idx) => ({ text }));
            items = shuffleArray([...items]);
            const displayList = items.map((item, newIdx) => ({ letter: String.fromCharCode(65+newIdx), text: item.text }));
            const found = displayList.find(item => item.text === correctText);
            return {
                displayList,
                correctLetterDisplay: found ? found.letter : "A"
            };
        }
    }
    
    function updateAllUI() {
        if (!currentQuestions.length) {
            liveScoreSpan.innerText = `0 / 0`;
            return;
        }
        let correctCount = 0;
        
        for (let q of currentQuestions) {
            const mapping = answersMapping.get(q.id);
            if (!mapping) continue;
            const selectedLetter = userSelections[q.id];
            const isCorrect = (selectedLetter && selectedLetter === mapping.correctLetterDisplay);
            if (isCorrect) correctCount++;
            
            const cardDiv = document.querySelector(`.question-card[data-qid='${q.id}']`);
            if (!cardDiv) continue;
            
            const iconSpan = cardDiv.querySelector('.status-icon');
            if (iconSpan) {
                if (!selectedLetter) {
                    iconSpan.innerHTML = "⚪ Chưa làm";
                    iconSpan.className = "status-icon status-none";
                } else if (isCorrect) {
                    iconSpan.innerHTML = "✓ Đúng";
                    iconSpan.className = "status-icon status-correct";
                } else {
                    iconSpan.innerHTML = "✗ Sai";
                    iconSpan.className = "status-icon status-wrong";
                }
            }
            
            const answerDivs = cardDiv.querySelectorAll('.answer-option');
            for (let ansDiv of answerDivs) {
                const letter = ansDiv.dataset.letter;
                const isSelected = (selectedLetter === letter);
                
                ansDiv.classList.remove('correct-highlight', 'wrong-highlight');
                
                if (isSelected) {
                    if (isCorrect) {
                        ansDiv.classList.add('correct-highlight');
                    } else {
                        ansDiv.classList.add('wrong-highlight');
                    }
                }
                
                let statusSpan = ansDiv.querySelector('.answer-status');
                if (!statusSpan) {
                    statusSpan = document.createElement('span');
                    statusSpan.className = 'answer-status';
                    ansDiv.appendChild(statusSpan);
                }
                
                if (isSelected && isCorrect) {
                    statusSpan.innerHTML = '✓';
                    statusSpan.className = 'answer-status check-mark';
                } else if (isSelected && !isCorrect) {
                    statusSpan.innerHTML = '✗';
                    statusSpan.className = 'answer-status cross-mark';
                } else {
                    statusSpan.innerHTML = '';
                }
            }
        }
        liveScoreSpan.innerText = `${correctCount} / ${currentQuestions.length}`;
    }
    
    function onAnswerClick(questionId, selectedLetter) {
        userSelections[questionId] = selectedLetter;
        
        const questionCard = document.querySelector(`.question-card[data-qid='${questionId}']`);
        if (questionCard) {
            const allOptions = questionCard.querySelectorAll('.answer-option');
            allOptions.forEach(opt => {
                const letter = opt.dataset.letter;
                if (letter === selectedLetter) {
                    opt.classList.add('selected');
                } else {
                    opt.classList.remove('selected');
                }
            });
        }
        updateAllUI();
    }
    
    // Hàm cuộn xuống câu hỏi đầu tiên
    function scrollToFirstQuestion() {
        setTimeout(() => {
            const firstQuestion = document.querySelector('.question-card');
            if (firstQuestion) {
                firstQuestion.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }, 100);
    }
    
    function renderFullQuiz() {
        if (!currentTopic) {
            scoreContainer.style.display = "none";
            questionsContainer.innerHTML = `
                <div class="welcome-message">
                    👋 Chào bạn!<br>
                    Hãy chọn một chủ đề bên trên để bắt đầu làm bài trắc nghiệm.
                </div>
            `;
            return;
        }
        
        currentQuestions = getFilteredQuestions();
        answersMapping.clear();
        for (let q of currentQuestions) {
            answersMapping.set(q.id, buildAnswerMapping(q));
        }
        userSelections = {};
        
        if (currentQuestions.length === 0) {
            scoreContainer.style.display = "block";
            questionsContainer.innerHTML = `<div class="card" style="text-align:center">⚠️ Không có câu hỏi cho chủ đề này.</div>`;
            liveScoreSpan.innerText = `0 / 0`;
            return;
        }
        
        let html = '';
        currentQuestions.forEach((q, idx) => {
            const mapping = answersMapping.get(q.id);
            if (!mapping) return;
            const { displayList } = mapping;
            let answersHtml = '';
            for (let ans of displayList) {
                answersHtml += `
                    <div class="answer-option" data-qid="${q.id}" data-letter="${ans.letter}">
                        <span class="answer-letter">${ans.letter}</span>
                        <span class="answer-text">${escapeHtml(ans.text)}</span>
                        <span class="answer-status"></span>
                    </div>
                `;
            }
            html += `
                <div class="question-card" data-qid="${q.id}">
                    <div class="question-text">
                        <span><strong>${idx+1}.</strong> ${escapeHtml(q.text)}</span>
                        <span class="status-icon status-none">⚪ Chưa làm</span>
                    </div>
                    <div class="answers">
                        ${answersHtml}
                    </div>
                </div>
            `;
        });
        
        questionsContainer.innerHTML = html;
        scoreContainer.style.display = "flex";
        
        document.querySelectorAll('.answer-option').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const qid = parseInt(el.dataset.qid);
                const letter = el.dataset.letter;
                if (!isNaN(qid) && letter) {
                    onAnswerClick(qid, letter);
                }
            });
        });
        
        updateAllUI();
        
        // Tự động cuộn xuống câu hỏi đầu tiên
        scrollToFirstQuestion();
    }
    
function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>"']/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}
    
    function refreshQuiz() {
        renderFullQuiz();
    }
    
    function initEventListeners() {
        const topicBtns = document.querySelectorAll('.topic-btn');
        topicBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const topic = btn.dataset.topic;
                if (!topic) return;
                currentTopic = topic;
                topicBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                refreshQuiz();
            });
        });
        
        shuffleQuestionsToggle.addEventListener('change', (e) => {
            shuffleQuestions = e.target.checked;
            if (currentTopic) refreshQuiz();
        });
        
        shuffleAnswersToggle.addEventListener('change', (e) => {
            shuffleAnswers = e.target.checked;
            if (currentTopic) refreshQuiz();
        });
    }
    
    function init() {
        shuffleQuestions = shuffleQuestionsToggle.checked;
        shuffleAnswers = shuffleAnswersToggle.checked;
        initEventListeners();
        currentTopic = null;
        renderFullQuiz();
    }
    
    init();
</script>
</body>
