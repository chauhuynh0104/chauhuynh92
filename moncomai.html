    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;

            margin: 0 auto;

        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        #quiz-container {
            margin-top: 20px;
        }

        .question-card {
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            padding: 12px 15px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background-color: #e2e6ea;
            border-color: #dae0e5;
        }

        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: #c3e6cb !important;
            color: #155724 !important;
            font-weight: bold;
        }

        .option-btn.wrong {
            background-color: #f8d7da !important;
            border-color: #f5c6cb !important;
            color: #721c24 !important;
        }

        .feedback {
            margin-top: 10px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .score-board {
        
            top: 10px;
            background-color: #007bff;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 1000;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reset-btn {
            background-color: #ffc107;
            color: #212529;
            border: none;
            padding: 8px 16px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .reset-btn:hover {
            background-color: #e0a800;
        }
    </style>
</head>

        // Lưu trữ trạng thái kết quả của từng câu
        let userAnswers = {};

        // Hàm xáo trộn mảng
        function shuffleArray(array) {
            let shuffled = JSON.parse(JSON.stringify(array));
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Khởi tạo giao diện
        function initQuiz() {
            userAnswers = {};
            updateScoreBoard();

            const quizContainer = document.getElementById('quiz-container');
            quizContainer.innerHTML = '';

            // Random câu hỏi
            const shuffledQuestions = shuffleArray(rawQuestions);

            shuffledQuestions.forEach((item, qIndex) => {
                const card = document.createElement('div');
                card.className = 'question-card';

                // Tiêu đề câu hỏi
                const qTitle = document.createElement('div');
                qTitle.className = 'question-text';
                qTitle.innerText = `${qIndex + 1}. ${item.q.replace(/^Câu \d+\.\s*/, '')}`;
                card.appendChild(qTitle);

                // Danh sách đáp án
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options-container';

                // Random đáp án
                const shuffledOptions = shuffleArray(item.options);
                const labels = ['A', 'B', 'C', 'D'];

                shuffledOptions.forEach((opt, oIndex) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    const cleanText = opt.text.replace(/^[A-D]\.\s*/, '');
                    btn.innerText = `${labels[oIndex]}. ${cleanText}`;
                    
                    // Xử lý khi nhấn chọn đáp án (có thể chọn lại)
                    btn.onclick = () => selectOption(qIndex, btn, opt.isCorrect, optionsDiv, card);
                    optionsDiv.appendChild(btn);
                });

                card.appendChild(optionsDiv);

                // Khung thông báo đúng/sai
                const feedbackDiv = document.createElement('div');
                feedbackDiv.className = 'feedback';
                card.appendChild(feedbackDiv);

                quizContainer.appendChild(card);
            });
        }

        // Xử lý khi chọn/đổi đáp án
        function selectOption(qIndex, selectedBtn, isCorrect, optionsContainer, card) {
            const buttons = optionsContainer.querySelectorAll('.option-btn');
            
            // Xóa màu cũ trên tất cả các đáp án của câu này
            buttons.forEach(btn => {
                btn.classList.remove('correct', 'wrong');
            });

            const feedbackDiv = card.querySelector('.feedback');

            // Cập nhật giao diện theo lựa chọn mới
            if (isCorrect) {
                selectedBtn.classList.add('correct');
                feedbackDiv.innerText = "✓ Chính xác!";
                feedbackDiv.style.color = "#155724";
                userAnswers[qIndex] = true; // Lưu trạng thái: Đúng
            } else {
                selectedBtn.classList.add('wrong');
                feedbackDiv.innerText = "✗ Chưa đúng! Bạn có thể chọn lại đáp án khác.";
                feedbackDiv.style.color = "#721c24";
                userAnswers[qIndex] = false; // Lưu trạng thái: Sai
            }

            // Cập nhật lại điểm số tổng
            updateScoreBoard();
        }

        // Cập nhật thanh điểm số
        function updateScoreBoard() {
            const answeredCount = Object.keys(userAnswers).length;
            const correctCount = Object.values(userAnswers).filter(val => val === true).length;

            document.getElementById('score').innerText = correctCount;
            document.getElementById('total-answered').innerText = answeredCount;
        }

        // Chạy khi mở trang
        window.onload = initQuiz;
    </script>
