<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Trắc nghiệm Chăm sóc người lớn có bệnh ngoại khoa nâng cao - Chauhuynh0104</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #f0f4f8;
            font-family: system-ui, 'Segoe UI', 'Roboto', 'Noto Sans', sans-serif;
            padding: 16px 12px 80px;
            color: #0f172a;
        }

        .app-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            padding: 20px 18px;
            margin-bottom: 20px;
        }

        .quiz-header {
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quiz-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1e3c72, #2b4c7c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .badge {
            background: #eef2ff;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #1e3c72;
        }

        .topic-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .topic-btn {
            background: #eef2ff;
            border: none;
            padding: 10px 20px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            color: #1e293b;
            flex: 1 0 auto;
            text-align: center;
        }

        .topic-btn.active {
            background: #1e3c72;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 60px;
            margin-bottom: 20px;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: 0.3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #2d6a4f;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .question-card {
            background: white;
            border-radius: 24px;
            margin-bottom: 20px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            scroll-margin-top: 20px;
        }

        .question-text {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 16px;
            line-height: 1.4;
            background: #fefce8;
            padding: 12px;
            border-radius: 20px;
            border-left: 5px solid #eab308;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .status-icon {
            font-size: 0.85rem;
            font-weight: bold;
            background: white;
            border-radius: 40px;
            padding: 4px 12px;
            min-width: 95px;
            text-align: center;
        }

        .status-correct {
            color: #15803d;
            background: #dcfce7;
            border: 1px solid #86efac;
        }

        .status-wrong {
            color: #b91c1c;
            background: #fee2e2;
            border: 1px solid #fca5a5;
        }

        .status-none {
            color: #64748b;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: #f9f9ff;
            border-radius: 60px;
            border: 2px solid #e2edff;
            cursor: pointer;
            transition: 0.15s;
        }

        .answer-option:hover {
            background: #eef2ff;
        }

        .answer-option.correct-highlight {
            border: 3px solid #15803d;
            background: #e8f5e9;
        }

        .answer-option.wrong-highlight {
            border: 3px solid #dc2626;
            background: #fee2e2;
        }

        .answer-option.selected {
            background: #e0f2fe;
            border-color: #0284c7;
        }

        .answer-letter {
            font-weight: 800;
            background: #e2e8f0;
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 60px;
            font-size: 0.9rem;
        }

        .answer-text {
            flex: 1;
            font-size: 0.92rem;
        }

        .answer-status {
            font-size: 1.2rem;
            font-weight: bold;
            min-width: 44px;
            text-align: center;
        }

        .check-mark {
            color: #15803d;
        }

        .cross-mark {
            color: #dc2626;
        }

        .score-bar {
            background: #e6f7ed;
            padding: 14px 18px;
            border-radius: 60px;
            text-align: center;
            font-weight: bold;
            margin: 8px 0 16px;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .progress-text {
            background: #1e3c72;
            color: white;
            border-radius: 30px;
            padding: 4px 16px;
        }

        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            background: #fef9e3;
            border-radius: 28px;
            color: #b45309;
            font-weight: 500;
        }

        footer {
            text-align: center;
            margin-top: 32px;
            padding: 20px 10px;
            font-size: 0.75rem;
            color: #475569;
            border-top: 1px solid #cbd5e1;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="card">
        <div class="quiz-header">
            <h2>📚 Trắc nghiệm Chăm sóc người lớn có bệnh ngoại khoa nâng cao</h2>
      
        </div>


        <div class="topic-buttons" id="topicButtons">
            <button data-topic="all" class="topic-btn">📖 Bắt đầu</button>
				  

        </div>

      <div class="toggle-row">
            <div class="toggle-item">
                <span>🔄 Xáo trộn câu hỏi</span>
                <label class="switch">
                    <input type="checkbox" id="shuffleQuestionsToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="toggle-item">
                <span>🎲 Xáo trộn đáp án</span>
                <label class="switch">
                    <input type="checkbox" id="shuffleAnswersToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <div id="scoreContainer" class="score-bar" style="display: none;">
        <span>🏆 Kết quả hiện tại</span>
        <span id="liveScore" class="progress-text">0 / 0</span>
    </div>

    <div id="questionsContainer">
        <div class="welcome-message">
            👋 Chào bạn!<br>
            Hãy chọn một chủ đề bên trên để bắt đầu làm bài trắc nghiệm.
        </div>
    </div>
    
    <footer>© 2014-2026 Dr.Châu</footer>
</div>

<script>
    // ---------- DỮ LIỆU CÂU HỎI ----------
    const QUESTION_SET = [
{ id: 1, text: "Khó thở trong chấn thương ngực thường có đặc điểm sinh lý bệnh nào sau đây", answers: ['Khó thở giảm dần theo thời gian', 'Khó thở tiến triển tăng dần', 'Khó thở chủ yếu vào buổi sáng', 'Khó thở xuất hiện về ban đêm'], correct: "B", topic: "1" },
{ id: 2, text: "Triệu chứng ho ra máu trong chấn thương ngực có ý nghĩa lâm sàng là", answers: ['Rất hay gặp và báo hiệu có tổn thương nhu mô phổi/phế quản.', 'Thỉnh thoảng xuất hiện nhưng không có giá trị chẩn đoán.', 'Hiếm gặp nhưng có giá trị chẩn đoán xác định rất cao.', 'Là triệu chứng hoàn toàn không liên quan đến chấn thương ngực.'], correct: "A", topic: "1" },
{ id: 3, text: "Dấu hiệu gợi ý tình trạng tràn máu màng phổi khi điều dưỡng thực hiện kỹ thuật gõ ngực là:", answers: ['Gõ vang vùng tổn thương.', 'Gõ đục vùng thấp bên tổn thương.', 'Gõ kêu như tiếng thùng rỗng.', 'Không có thay đổi âm gõ rõ rệt.'], correct: "B", topic: "1" },
{ id: 4, text: "Biến chứng sớm nguy hiểm nhất có nguy cơ đe dọa tính mạng người bệnh ngay trong chấn thương ngực là:", answers: ['Dày dính màng phổi hạn chế hô hấp.', 'Nhiễm trùng mủ màng phổi muộn.', 'Sốc chấn thương và suy hô hấp cấp tính.', 'Ho kéo dài gây suy kiệt cơ thể.'], correct: "C", topic: "1" },
{ id: 5, text: "Nguyên tắc xử trí và điều trị ưu tiên đầu tiên đối với người bệnh chấn thương ngực là:", answers: ['Chỉ định kháng sinh phổ rộng liều cao.', 'Thực hiện các biện pháp giảm đau tại chỗ.', 'Cấp cứu chống sốc và chống suy hô hấp cấp.', 'Hướng dẫn tập vận động phục hồi chức năng.'], correct: "C", topic: "1" },
{ id: 6, text: "Nguyên nhân chính gây nên tình trạng suy hô hấp cấp trong chấn thương ngực kín là:", answers: ['Tình trạng nhiễm trùng nhu mô phổi tiến triển.', 'Rối loạn thông khí do đau, tràn dịch/khí màng phổi hoặc mảng sườn di động.', 'Tình trạng tăng huyết áp kịch phát do stress.', 'Thiếu máu mức độ nhẹ từ các mạch máu nhỏ.'], correct: "B", topic: "1" },
{ id: 7, text: "Dấu hiệu lâm sàng đặc trưng nhất của mảng sườn di động là:", answers: ['Người bệnh có cảm giác khó thở nhẹ.', 'Hiện tượng hô hấp đảo chiều tại vùng tổn thương.', 'Không biểu hiện dấu hiệu nào đặc trưng trên thành ngực.', 'Người bệnh chỉ thở nhanh và nông đơn thuần.'], correct: "B", topic: "1" },
{ id: 8, text: "Dấu hiệu lâm sàng điển hình gợi ý hội chứng chèn ép tim cấp là:", answers: ['Chỉ số huyết áp động mạch tăng cao đột ngột.', 'Tam chứng Beck: Tĩnh mạch cổ nổi, huyết áp kẹt/tụt, tiếng tim mờ xa xăm.', 'Nhịp tim chậm dần dưới 50 lần/phút.', 'Da và niêm mạc môi tím tái đơn thuần.'], correct: "B", topic: "1" },
{ id: 9, text: "Biện pháp giảm đau hiệu quả và an toàn nhất cho người bệnh gãy nhiều xương sườn nặng trên lâm sàng là:", answers: ['Chỉ dùng Paracetamol đường uống đơn thuần để giảm đau.', 'Phong bế thần kinh liên sườn bằng thuốc tê phù hợp.', 'Hướng dẫn người bệnh nằm nghỉ ngơi hoàn toàn tại giường.', 'Không can thiệp điều dưỡng hay điều trị gì đặc hiệu.'], correct: "B", topic: "1" },
{ id: 10, text: "Trong quy trình chăm sóc hậu phẫu sau mổ ngực, người bệnh cần được:", answers: ['Hạn chế ho hoàn toàn để chống bục rách vết mổ thành ngực.', 'Khuyến khích tập thở sâu, ho có hỗ trợ để tống đờm dãi, tránh xẹp phổi.', 'Nằm bất động tuyệt đối tại giường trong nhiều ngày liên tục.', 'Tất cả các phương án trên đều đúng.'], correct: "B", topic: "1" },
{ id: 11, text: "Người bệnh chấn thương ngực vào viện có mạch nhanh nhỏ, huyết áp tụt, tĩnh mạch cổ nổi to, tiếng tim nghe mờ xa xăm. Điều dưỡng cần nhận định ngay người bệnh có nguy cơ cao bị:", answers: ['Tràn khí màng phổi kín đơn thuần.', 'Hội chứng chèn ép tim cấp do tràn máu màng tim.', 'Gãy xương đòn phối hợp đơn thuần.', 'Viêm phế quản cấp tính hậu phẫu.'], correct: "B", topic: "1" },
{ id: 12, text: "Triệu chứng cơ năng và thực thể nào dưới đây điển hình của chấn thương sọ não mức độ nhẹ?", answers: ['Người bệnh rơi vào trạng thái hôn mê sâu.', 'Có hiện tượng dãn đồng tử một bên cố định.', 'Người bệnh tỉnh, đau đầu nhiều, buồn nôn hoặc nôn ói.', 'Xuất hiện dấu hiệu yếu hoặc liệt tứ chi progresive.'], correct: "C", topic: "1" },
{ id: 13, text: "Trong thang điểm mê Glasgow (GCS), tổng mức điểm từ 13 đến 15 điểm được phân loại lâm sàng là:", answers: ['Chấn thương sọ não mức độ nhẹ.', 'Chấn thương sọ não mức độ trung bình.', 'Chấn thương sọ não mức độ nặng.', 'Người bệnh rơi vào hôn mê sâu.'], correct: "A", topic: "1" },
{ id: 14, text: "Thuốc lợi tiểu thẩm thấu qua đường tĩnh mạch (như Mannitol 20%) có tác dụng chính gì trong điều trị nội khoa chấn thương sọ não?", answers: ['Tăng chỉ số huyết áp động mạch trung bình cho người bệnh.', 'Làm giảm áp lực nội sọ bằng cách kéo dịch từ mô não vào lòng mạch.', 'Chống tình trạng nhiễm trùng hệ thống thần kinh trung ương.', 'Làm giảm triệu chứng đau đầu dai dẳng cho người bệnh.'], correct: "B", topic: "1" },
{ id: 15, text: "Dấu hiệu lâm sàng sớm nhất cảnh báo nguy cơ hình thành loét tì đè ở người bệnh hôn mê nằm lâu là:", answers: ['Vết mổ sọ não thấm dịch huyết thanh.', 'Xuất hiện vùng da đỏ, nề tại vị trí các ụ xương tì đè.', 'Nổi ban đỏ trên da và mất đi khi ấn ngón tay vào.', 'Nổi ban hoại tử không mất đi khi ấn ngón tay vào.'], correct: "B", topic: "1" },
{ id: 16, text: "Tư thế nằm phù hợp cho người bệnh sau phẫu thuật lấy khối máu tụ ngoài màng cứng thường được chỉ định là:", answers: ['Nằm ngửa, đầu cao từ $15^{\circ}$ đến $30^{\circ}$ (hoặc nghiêng bên lành) để tăng hồi lưu tĩnh mạch.', 'Nằm sấp hoàn toàn, đầu nghiêng sang một bên.', 'Nằm ngửa bằng phẳng và không kê gối dưới đầu.', 'Nằm nghiêng hoàn toàn sang phía bên có vết mổ sọ não.'], correct: "A", topic: "1" },
{ id: 17, text: "Khi đánh giá điểm vận động theo thang điểm Glasgow, người bệnh có biểu hiện ``duỗi cứng mất não`` khi kích thích đau sẽ nhận được mức điểm là:", answers: ['1 điểm.', '2 điểm.', '3 điểm.', '4 điểm.'], correct: "B", topic: "1" },
{ id: 18, text: "Nguyên tắc điều trị quan trọng hàng đầu trong cấp cứu chấn thương sọ não nặng là tập trung đảm bảo:", answers: ['Công tác vệ sinh vô khuẩn phòng chống nhiễm trùng toàn thân.', 'Duy trì thông khí tốt (Oxy) và áp lực tưới máu não ổn định.', 'Hướng dẫn tập vận động sớm đề phòng biến chứng teo cơ, cứng khớp.', 'Chế độ ăn giàu vitamin, đạm để đảm bảo cung cấp đủ dinh dưỡng.'], correct: "B", topic: "1" },
{ id: 19, text: "Nguyên tắc xử trí và điều trị chính áp dụng cho người bệnh chấn thương sọ não mức độ nhẹ là:", answers: ['Tiến hành phẫu thuật mở sọ giải áp ngay lập tức.', 'Chỉ định truyền thuốc lợi tiểu thẩm thấu liều mạnh.', 'Nghỉ ngơi tại giường, dùng thuốc triệu chứng và theo dõi sát tri giác tại nhà/viện.', 'Thực hiện truyền liên tục các dung dịch nhược trương hoặc ưu trương.'], correct: "C", topic: "1" },
{ id: 20, text: "Theo dõi và đánh giá thang điểm Glasgow trong giai đoạn cấp cứu chấn thương sọ não chưa ổn định cần thực hiện với tần suất:", answers: ['Chỉ cần đánh giá 1 lần duy nhất trong mỗi ngày trực.', 'Theo dõi sát 15 phút một lần cho đến khi tình trạng huyết động và tri giác ổn định.', 'Đánh giá định kỳ 1 tuần một lần tại phòng bệnh.', 'Đây là chấn thương cố định, không cần thiết phải theo dõi liên tục.'], correct: "B", topic: "1" },
{ id: 21, text: "Khi phát hiện người bệnh chấn thương sọ não xuất hiện cơn co giật, hành động xử trí ưu tiên đầu tiên của điều dưỡng là:", answers: ['Cho người bệnh uống hoặc bơm thức ăn ngay để tránh hạ đường huyết.', 'Dùng dây trói chặt chân tay người bệnh để hạn chế biên độ co giật.', 'Đi lấy thuốc và thực hiện ngay y lệnh thuốc chống động kinh khẩn cấp.', 'Đặt người bệnh nằm nơi an toàn, kê gối mềm dưới đầu, ngáng miệng tránh cắn lưỡi và bảo vệ tránh chấn thương thứ phát.'], correct: "D", topic: "1" },
{ id: 22, text: "Thời điểm nào người bệnh chấn thương sọ não thường được chỉ định chụp cộng hưởng từ (MRI) thay vì chụp cắt lớp vi tính (CT Scan)?", answers: ['Ngay khi mới nhập viện cấp cứu trong tình trạng nguy kịch.', 'Khi cần chẩn đoán nhanh tình trạng lún xương sọ cấp tính.', 'Khi tình trạng lâm sàng đã ổn định nhưng triệu chứng thần kinh không cải thiện hoặc nghi tổn thương sợi trục.', 'Khi người bệnh có vết thương sọ não xuyên thấu cấp tính cần mổ ngay.'], correct: "C", topic: "1" },
{ id: 23, text: "Nguyên nhân nào sau đây được phân loại là cơ chế gián tiếp gây nên tình trạng chấn thương cột sống?", answers: ['Cây đổ hoặc thanh gỗ lớn đè trực tiếp vào vùng lưng người bệnh.', 'Tai nạn ngã cao ngồi dốc mông xuống đất gây lún sập các đốt sống.', 'Cơn co cứng cơ mạnh, liên tục trong bệnh lý uốn ván ác tính.', 'Bức tường sập đè trực tiếp vào vùng cột sống thắt lưng.'], correct: "B", topic: "1" },
{ id: 24, text: "Trong gãy cột sống đơn thuần không có liệt tủy kèm theo, dấu hiệu biến dạng nào thường được quan sát thấy trên lâm sàng?", answers: ['Khoảng cách giải phẫu giữa hai mấu gai sống bị thu hẹp lại rõ rệt.', 'Mấu gai sống vùng tổn thương gồ hẳn ra phía sau gây tình trạng gù lưng.', 'Trục cột sống bị vẹo hẳn sang một bên một cách rõ rệt.', 'Không xuất hiện bất kỳ biến dạng hình thái nào có thể quan sát bằng mắt thường.'], correct: "B", topic: "1" },
{ id: 25, text: "Tình trạng rối loạn hô hấp nặng, đe dọa ngừng thở thường xảy ra trong chấn thương cột sống cổ tổn thương đoạn tủy nào?", answers: ['Từ đoạn tủy cổ C1 đến C5 (tổn thương trung tâm hô hấp và dây hoành).', 'Từ đoạn tủy cổ thấp C6 đến C7.', 'Tại các đoạn tủy sống vùng lưng từ D1 đến D5.', 'Tại đoạn tủy sống vùng thắt lưng từ L1 đến L5.'], correct: "A", topic: "1" },
{ id: 26, text: "Dấu hiệu lâm sàng đặc trưng nào ở người bệnh nam giới gợi ý tình trạng đứt tủy sống cổ/ngực cấp tính trong giai đoạn sốc tủy?", answers: ['Mất hoàn toàn khả năng cương cứng của cơ quan sinh dục.', 'Dương vật luôn trong tình trạng cương cứng kéo dài do mất ức chế thần kinh.', 'Xuất hiện tình trạng tiểu tiện không tự chủ ngay lập tức.', 'Tăng nhạy cảm và cảm giác đau vùng tầng sinh môn.'], correct: "B", topic: "1" },
{ id: 27, text: "Kỹ thuật chẩn đoán hình ảnh nào được xem là tiêu chuẩn tốt nhất để khảo sát chi tiết các tổn thương cấu trúc bên trong nhu mô tủy sống?", answers: ['Chụp X-quang cột sống quy ước hai tư thế thẳng và nghiêng.', 'Chụp cắt lớp vi tính kỹ thuật số (CT Scanner) cửa sổ xương.', 'Chụp cộng hưởng từ (MRI) cột sống - tủy sống.', 'Chụp phim X-quang sọ mặt tư thế Blondeau.'], correct: "C", topic: "1" },
{ id: 28, text: "Khi tiến hành sơ cứu và vận chuyển người bệnh nghi ngờ gãy cột sống, tư thế vận chuyển nào sau đây là SAI nguyên tắc?", answers: ['Đặt người bệnh nằm ngửa cố định trên ván cán cứng.', 'Đặt người bệnh nằm sấp trên ván cán mềm.', 'Cho người bệnh ngồi dậy tựa lưng vào ghế để giúp dễ thở hơn.', 'Nằm thẳng trục cơ thể và cố định cột sống cổ bằng nẹp cứng cổ.'], correct: "C", topic: "1" },
{ id: 29, text: "Bệnh nhân chấn thương cột sống ngực cao (từ đoạn D6 trở lên) thường xuất hiện biến đổi mạch và huyết áp do sốc thần kinh như thế nào?", answers: ['Mạch quay nhanh nhỏ và huyết áp động mạch tăng cao.', 'Mạch thường chậm (50–60 lần/phút) kèm theo huyết áp tụt.', 'Chỉ số mạch và huyết áp hoàn toàn không thay đổi so với bình thường.', 'Mạch nhanh nhỏ nhưng huyết áp hạ tụt kẹt.'], correct: "B", topic: "1" },
{ id: 30, text: "Tại sao điều dưỡng cần đặt ống thông dạ dày giải áp liên tục cho bệnh nhân chấn thương cột sống trong 48 - 72 giờ đầu?", answers: ['Để bắt đầu quy trình nuôi dưỡng bệnh nhân sớm qua đường tiêu hóa.', 'Do tình trạng liệt ruột cơ năng do mất phân bố thần kinh gây chướng bụng, hạn chế thở.', 'Để kiểm tra tầm soát xem bệnh nhân có bị xuất huyết dạ dày do stress hay không.', 'Để chuẩn bị làm sạch đường tiêu hóa cho phẫu thuật cột sống cổ.'], correct: "B", topic: "1" },
{ id: 31, text: "Trong thực hiện quy trình chăm sóc bệnh nhân chấn thương cột sống, tần suất đánh giá lại chức năng vận động và cảm giác ngoại vi được khuyến cáo là:", answers: ['Tối thiểu mỗi 2 giờ một lần ở giai đoạn cấp hoặc tùy theo chỉ định sát sao của bác sĩ.', 'Tối thiểu mỗi 4 giờ một lần định kỳ cho mọi giai đoạn.', 'Mỗi ngày chỉ cần lượng giá 1 lần duy nhất vào ca sáng.', 'Chỉ tiến hành đánh giá khi bệnh nhân kêu đau hoặc có yêu cầu trực tiếp.'], correct: "A", topic: "1" },
{ id: 32, text: "Biện pháp hỗ trợ nào hiệu quả nhất giúp bệnh nhân liệt tủy cao có thể tống xuất dịch tiết, đờm dãi đường hô hấp ra ngoài?", answers: ['Cho bệnh nhân uống nhiều thuốc làm loãng đờm.', 'Luôn đặt bệnh nhân nằm ngửa hoàn toàn, bằng phẳng tại giường.', 'Yêu cầu tự lực ho mạnh mà không cần bất kỳ sự hỗ trợ nào từ bên ngoài.', 'Điều dưỡng đặt tay lên vùng thượng vị/thành ngực đẩy mạnh hướng lên trên nhịp nhàng khi bệnh nhân ho.'], correct: "D", topic: "1" },
{ id: 33, text: "Bệnh nhân chấn thương cột sống cổ cao có nguy cơ bị biến nhiệt (sốt cao hoặc hạ thân nhiệt) theo nhiệt độ môi trường do cơ chế:", answers: ['Mất khả năng điều nhiệt và mất phản xạ vã mồ hôi bên dưới mức tổn tủy.', 'Do tình trạng nhiễm trùng đường tiết niệu cấp tính gây sốt.', 'Do bệnh nhân không được cung cấp đủ lượng nước uống hàng ngày.', 'Do tình trạng loét da vùng tì đè làm thoát nhiệt lượng cơ thể.'], correct: "A", topic: "1" },
{ id: 34, text: "Trong chăm sóc người bệnh chấn thương tủy sống giai đoạn cấp, mục đích chính của việc điều dưỡng theo dõi và nghe đánh giá âm ruột (nhu động ruột) định kỳ là:", answers: ['Phát hiện sớm tình trạng xuất huyết tiêu hóa do loét stress (loét Cushing).', 'Đánh giá sự hồi phục của nhu động ruột để xác định thời điểm bắt đầu cho người bệnh ăn qua đường miệng.', 'Kiểm tra xem ống thông dạ dày có bị tắc nghẽn hoặc lệch vị trí giải phẫu hay không.', 'Đánh giá mức độ dung nạp của cơ thể đối với các thuốc vận mạch nâng huyết áp.'], correct: "B", topic: "1" },
{ id: 35, text: "Hành động nào mang tính nhân văn và quan trọng nhất giúp bệnh nhân liệt tứ chi do chấn thương tủy vượt qua mặc cảm, tự ti để phục hồi tâm lý?", answers: ['Nói dối hoặc hứa hẹn rằng họ sẽ sớm đi lại được bình thường như trước.', 'Cách ly bệnh nhân ở phòng riêng biệt để họ tránh tiếp xúc với xã hội bên ngoài.', 'Khuyến khích, hỗ trợ và kiên nhẫn để bệnh nhân tự thực hiện các hoạt động chăm sóc cá nhân trong khả năng.', 'Nhân viên y tế và người nhà làm thay hoàn toàn mọi việc để bệnh nhân không phải vận động.'], correct: "C", topic: "1" },
{ id: 36, text: "Mở khí quản cấp cứu được chỉ định trong các trường hợp sau đây, NGOẠI TRỪ:", answers: ['Tắc nghẽn đường hô hấp trên hoàn toàn do dị vật đường thở.', 'Chấn thương hàm mặt gây dập nát, phù nề nặng ở cổ và thanh quản.', 'Tình trạng khó thở do bệnh lý viêm phổi thùy mức độ vừa.', 'Bỏng sâu đường hô hấp có nguy cơ co thắt, phù nề thanh môn.'], correct: "C", topic: "1" },
{ id: 37, text: "Biến chứng muộn xảy ra sau khi người bệnh đã được mở khí quản một thời gian thường gặp bao gồm các tổn thương sau, NGOẠI TRỪ:", answers: ['Hẹp lòng khí quản tại vị trí đặt ống.', 'Tắc nghẽn ống đột ngột do cục máu đông lớn ngay sau mổ.', 'Nhiễm trùng da và mô mềm xung quanh vị trí đặt canule.', 'Hình thành đường dò khí quản – thực quan.'], correct: "B", topic: "1" },
{ id: 38, text: "Để đảm bảo tưới máu niêm mạc khí quản tốt, áp lực trong bóng chèn (cuff) của canule mở khí quản không được vượt quá mốc:", answers: ['10 cmH2O.', '20 cmH2O.', '30 cmH2O (hoặc duy trì khoảng 20-25 mmHg).', '40 cmH2O.'], correct: "C", topic: "1" },
{ id: 39, text: "Khi xảy ra tai biến sút/tuột ống canule mở khí quản đột ngột tại phòng bệnh, hành động xử trí khẩn cấp ưu tiên đầu tiên của điều dưỡng là:", answers: ['Tiếp tục đứng ngoài theo dõi sát tình trạng nhịp thở của người bệnh.', 'Mang găng, lau rửa sạch vết thương rồi cố gắng ấn mạnh đặt lại canule mở khí quản cũ.', 'Dùng kìm banh rộng (bộ mở khí quản) giữ mở rộng lỗ thở, cho người bệnh thở oxy qua lỗ mở và lập tức gọi hỗ trợ.', 'Đi tìm và báo cho Bác sĩ điều trị đến phòng bệnh xử trí.'], correct: "C", topic: "1" },
{ id: 40, text: "Vị trí giải phẫu thông thường được lựa chọn để thực hiện kỹ thuật mở khí quản là ở vị trí các vòng sụn khí quản số:", answers: ['Vòng sụn số 1 và số 2.', 'Vòng sụn số 2, số 3 và số 4.', 'Vòng sụn số 5, số 6 và số 7.', 'Vòng sụn số 7 và số 8.'], correct: "B", topic: "1" },
{ id: 41, text: "Một trong những lợi ích quan trọng của thủ thuật mở khí quản đối với hệ hô hấp là:", answers: ['Làm gia tăng khoảng chết giải phẫu của đường hô hấp.', 'Giúp người bệnh có thể phát âm và nói chuyện dễ dàng ngay sau khi mở ống.', 'Giúp dễ dàng hút sạch đờm nhớt ứ đọng trong lòng phế quản.', 'Ngăn ngừa hoàn toàn nguy cơ nhiễm trùng đường hô hấp dưới.'], correct: "C", topic: "1" },
{ id: 42, text: "Loại canule mở khí quản hiện nay thường được ưu tiên lựa chọn sử dụng rộng rãi trên lâm sàng là:", answers: ['Ống chất liệu kim loại không cấu tạo bóng chèn (như ống Silver).', 'Ống chất liệu nhựa y tế mềm có tráng silicon và thiết kế bóng chèn (cuff).', 'Ống thông chất liệu cao su Foley hai nhánh.', 'Ống Nelaton loại mềm không bóng.'], correct: "B", topic: "1" },
{ id: 43, text: "Khi thực hiện kỹ thuật cố định dây mở khí quản cho người bệnh, điều dưỡng cần tuân thủ các nguyên tắc sau đây, NGOẠI TRỪ:", answers: ['Buộc dây thật căng, sát cổ để không thể luồn được ngón tay qua dưới dây buộc.', 'Đặt vị trí nút thắt buộc lệch hẳn về một bên cổ của người bệnh.', 'Sử dụng loại dây vải bản dẹt, sạch sẽ, mềm mại và không có độ co giãn.', 'Tiến hành kiểm tra lại độ căng của dây sau khi người bệnh có cơn ho mạnh hoặc thay đổi tư thế nằm.'], correct: "A", topic: "1" },
{ id: 44, text: "Chỉ định mở khí quản nào sau đây thuộc nhóm giải quyết tình trạng bít tắc đường hô hấp cơ học?", answers: ['Viêm phù nề thanh quản cấp tính không đáp ứng với điều trị nội khoa.', 'Người bệnh hôn mê sâu cần duy trì thở máy dài ngày trên 7–10 ngày.', 'Cơn hen phế quản ác tính giai đoạn co thắt.', 'Phù phổi cấp do suy tim trái toàn bộ.'], correct: "A", topic: "1" },
{ id: 45, text: "Mục đích sinh lý bệnh quan trọng nhất của việc mở khí quản trong hỗ trợ thông khí nhân tạo là:", answers: ['Làm tăng áp lực dương của đường dẫn khí vào phổi.', 'Ngăn ngừa một cách tuyệt đối nguy cơ nhiễm khuẩn bệnh viện đường hô hấp.', 'Tăng áp lực lọc tại mao mạch phổi.', 'Giảm khoảng chết sinh lý của đường thở và giảm sức cản đường hô hấp.'], correct: "D", topic: "1" },
{ id: 46, text: "Trong thực hành lâm sàng hiện nay, loại canule mở khí quản thường được sử dụng cho bệnh nhân hồi sức cấp cứu thở máy lâu ngày là loại:", answers: ['Nhựa có tráng chất liệu silicon vô khuẩn có bóng chèn.', 'Chất liệu thủy tinh hữu cơ.', 'Chất liệu kim loại cứng Silver hai nòng.', 'Chất liệu cao su dẻo thông thường.'], correct: "A", topic: "1" },
{ id: 47, text: "Một tổn thương ở vùng bụng được định nghĩa chính xác là "vết thương thấu bụng" khi:", answers: ['Vết thương làm rách sâu lớp da bụng và tổ chức dưới da.', 'Vết thương gây chảy máu nhiều từ các mạch máu nông ở thành bụng.', 'Vết thương có tổn thương xuyên thủng lớp phúc mạc thành vào bên trong ổ bụng.', 'Vết thương gây đụng dập và bầm tím các khối cơ thành bụng.'], correct: "C", topic: "1" },
{ id: 48, text: "Kỹ thuật cận lâm sàng nào có giá trị cao, thực hiện nhanh chóng và an toàn nhất để tầm soát dịch tự do/tổn thương tạng đặc ngay tại phòng cấp cứu?", answers: ['Siêu âm bụng cấp cứu theo quy trình FAST (Focused Assessment with Sonography for Trauma).', 'Chụp X-quang bụng đứng không chuẩn bị tìm liềm hơi.', 'Tiến hành chọc hút dịch ổ bụng (DPL) hoặc chọc dò túi cùng Douglas.', 'Chụp cắt lớp vi tính (CT Scanner) bụng có cản quang toàn bộ.'], correct: "A", topic: "1" },
{ id: 49, text: "Xử trí điều dưỡng ban đầu đối với một vết thương thấu bụng có phủ tạng (ruột, mạc nối) lòi ra ngoài miệng vết thương là:", answers: ['Nhanh chóng dùng tay đẩy toàn bộ phần ruột lộ ra vào lại bên trong ổ bụng rồi băng ép chặt.', 'Dùng dung dịch cồn $70^{\circ}$ hoặc cồn I-ốt đổ trực tiếp lên phần ruột lòi ra để sát khuẩn.', 'Dùng gạc vô khuẩn thấm nước muối sinh lý ấm đắp bảo vệ ruột, đặt bát úp lên trên và băng cố định.', 'Để hở hoàn toàn khối ruột lòi ra ngoài cho thông thoáng và chuyển đi mổ.'], correct: "C", topic: "1" },
{ id: 50, text: "Những can thiệp điều dưỡng nào sau đây nằm trong kế hoạch chống sốc cho bệnh nhân có vết thương thấu bụng, NGOẠI TRỪ:", answers: ['Ủ ấm cơ thể và cho bệnh nhân nằm yên tĩnh, đầu thấp nếu có tụt huyết áp.', 'Thực hiện khẩn cấp y lệnh truyền dịch đặt đường truyền lớn, truyền máu.', 'Cho bệnh nhân uống nước đường ấm hoặc sữa ấm để tăng cường năng lượng nội sinh.', 'Thực hiện tiêm thuốc trợ tim, thuốc vận mạch nâng huyết áp theo đúng y lệnh.'], correct: "C", topic: "1" },
{ id: 51, text: "Sau phẫu thuật điều trị chấn thương bụng, việc chăm sóc hệ thống ống dẫn lưu ổ bụng cần đảm bảo nguyên tắc:", answers: ['Tiến hành rút ống dẫn lưu hệ thống ngay sau 24 giờ đầu sau mổ cho mọi trường hợp.', 'Theo dõi và ghi nhận chính xác màu sắc, tính chất và số lượng dịch dẫn lưu định kỳ hàng ngày.', 'Luôn treo đặt túi chứa dịch cao hơn vị trí chân ống dẫn lưu của người bệnh từ 10-20 cm.', 'Kẹp ống dẫn lưu thường xuyên liên tục và chỉ mở khóa khi cần lấy mẫu dịch làm xét nghiệm.'], correct: "B", topic: "1" },
{ id: 52, text: "Sau phẫu thuật mở bụng, mục đích chính của việc đặt ống thông (sonde) dạ dày và duy trì hút dẫn lưu áp lực âm thấp là:", answers: ['Để bơm thức ăn lỏng sớm, phòng tránh nguy cơ suy dinh dưỡng cho người bệnh.', 'Giảm áp lực trong lòng ống tiêu hóa, hạn chế chướng bụng, bảo vệ đường khâu miệng nối.', 'Để lấy mẫu dịch vị dạ dày làm xét nghiệm sinh hóa định kỳ.', 'Dùng làm đường bơm thuốc điều trị dạ dày sau mổ.'], correct: "B", topic: "1" },
{ id: 53, text: "Sau phẫu thuật ổ bụng, dấu hiệu lâm sàng chính và khách quan nào khẳng định hệ thống tiêu hóa của người bệnh bắt đầu hồi phục nhu động?", answers: ['Người bệnh bắt đầu có cảm giác khát nước và thèm ăn.', 'Vết mổ thành bụng khô ráo, không có dịch huyết thanh chảy ra.', 'Người bệnh có hiện tượng trung tiện (đánh rắm) hoặc đại tiện trở lại.', 'Thân nhiệt của người bệnh trở về mức bình thường, hết sốt.'], correct: "C", topic: "1" },
{ id: 54, text: "Để phòng ngừa biến chứng nhiễm trùng hậu phẫu hiệu quả cho bệnh nhân chấn thương bụng, điều dưỡng cần thực hiện:", answers: ['Thực hiện y lệnh kháng sinh điều trị đúng giờ, đúng liều lượng.', 'Thay băng vết mổ và chân ống dẫn lưu định kỳ đảm bảo nguyên tắc vô khuẩn tuyệt đối.', 'Hướng dẫn bệnh nhân vệ sinh răng miệng đúng cách và khuyến khích vận động sớm tại giường.', 'Tất cả các can thiệp nêu trên.'], correct: "D", topic: "1" },
{ id: 55, text: "Biến chứng viêm phúc mạc do hoại tử và thủng ruột muộn sau chấn thương bụng kín thường có cơ chế liên quan đến:", answers: ['Việc người bệnh được cho ăn bằng đường miệng quá sớm sau phẫu thuật.', 'Tổn thương rách/tắc mạch máu mạc treo gây thiếu máu nuôi dưỡng hoại tử đoạn ruột tương ứng.', 'Do lạm dụng thuốc giảm đau nhóm Opioid quá liều lượng quy định.', 'Do rách bán phần khối cơ thẳng bụng thành bụng trước.'], correct: "B", topic: "1" },
{ id: 56, text: "Dấu hiệu Kehr (người bệnh có cảm giác đau chói lan lên vùng vai bên trái) trong chấn thương bụng kín thường gợi ý tổn thương cấu trúc tạng nào?", answers: ['Tổn thương nhu mô gan.', 'Tổn thương vỡ nhu mô lách gây chảy máu nội ổ bụng.', 'Tổn thương thủng vách dạ dày.', 'Tổn thương đụng dập nhu mô tụy.'], correct: "B", topic: "1" },
{ id: 57, text: "Bỏng được định nghĩa là những tổn thương bề mặt và cấu trúc sâu của cơ thể gây nên bởi:", answers: ['Chỉ do tác động của nguồn sức nhiệt (nóng hoặc lạnh).', 'Chỉ do tác động của các loại hóa chất ăn mòn (axit hoặc kiềm).', 'Tác động của sức nhiệt, hóa chất độc hại, dòng điện năng và các loại bức xạ.', 'Chỉ do tác động từ tia xạ của các nguồn năng lượng hạt nhân.'], correct: "C", topic: "1" },
{ id: 58, text: "Tổn thương bỏng gây ra do các tác nhân như xăng, dầu, củi gỗ đang cháy được phân loại vào nhóm:", answers: ['Bỏng gây ra do tác nhân sức nóng ướt.', 'Bỏng gây ra do tác nhân sức nóng khô.', 'Bỏng gây ra do tác nhân hóa chất hữu cơ.', 'Bỏng gây ra do tác nhân nhiệt độ lạnh sâu.'], correct: "B", topic: "1" },
{ id: 59, text: "Cấu trúc da của cơ thể người bình thường chỉ có khả năng chịu đựng được giới hạn nhiệt độ tối đa khoảng:", answers: ['$30^{\circ}\text{C}$.', '$37^{\circ}\text{C}$.', '$43^{\circ}\text{C}$', '$60^{\circ}\text{C}$.'], correct: "C", topic: "1" },
{ id: 60, text: "Dịch chứa bên trong các nốt phỏng (vết bỏng nông) được hình thành chủ yếu do cơ chế sinh lý bệnh nào?", answers: ['Tình trạng tăng sinh quá mức của các mô hạt vùng tổn thương.', 'Hiện tượng tăng tính thấm thành mạch làm thoát dịch huyết tương ra khoảng gian bào.', 'Tình trạng tăng cường tiết bã nhờn của các tuyến dưới da.', 'Quá trình hoại tử các tế bào sợi của tổ chức cơ sâu.'], correct: "B", topic: "1" },
{ id: 61, text: "Tổn thương bỏng được phân loại ở mức độ II (bỏng nông) có đặc điểm hình thái tổn thương là:", answers: ['Tổn thương lớp biểu bì và một phần lớp đáy, tự hoại tử và khỏi không để lại sẹo.', 'Tổn thương toàn bộ các lớp của cấu trúc da bao gồm cả lớp mỡ dưới da.', 'Chỉ có hiện tượng viêm đỏ, sung huyết bề mặt da đơn thuần (như bỏng nắng).', 'Tổn thương sâu xuống cấu trúc xương và các màng gân sâu.'], correct: "A", topic: "1" },
{ id: 62, text: "Theo quy luật số 9 của Wallace dùng để ước tính diện tích bỏng, diện tích bề mặt của hai chi dưới ở người trưởng thành chiếm tỷ lệ:", answers: ['18% tổng diện tích cơ thể.', '27% tổng diện tích cơ thể.', '36% tổng diện tích cơ thể (mỗi chi dưới chiếm 18%).', '45% tổng diện tích cơ thể.'], correct: "C", topic: "1" },
{ id: 63, text: "Tình trạng sốc bỏng (sốc giảm thể tích do thoát huyết tương) thường xuất hiện nguy cơ cao nhất trong khoảng thời gian nào?", answers: ['Trong vòng 6 giờ đầu tiên sau tai nạn bỏng.', 'Trong vòng 12 giờ đầu tiên sau tai nạn bỏng.', 'Trong vòng 24 đến 48 giờ đầu tiên sau khi bị bỏng.', 'Chỉ xuất hiện sau 48 giờ khi có nhiễm trùng vết bỏng.'], correct: "C", topic: "1" },
{ id: 64, text: "Cơ quan nội tạng dễ bị ảnh hưởng tổn thương sớm và nặng nề nhất do tình trạng giảm tưới máu trong sốc bỏng là:", answers: ['Hệ thống cơ tim.', 'Nhu mô gan.', 'Hệ thống nhu mô phổi.', 'Hệ thống thận (nguy cơ gây suy thận cấp do thiếu máu nuôi dưỡng và bít tắc ống thận).'], correct: "D", topic: "1" },
{ id: 65, text: "Giai đoạn nhiễm độc cấp tính (nhiễm độc độc tố từ mô hoại tử bỏng) trong bệnh lý bỏng thường bắt đầu xuất hiện từ thời điểm nào?", answers: ['Từ ngày thứ 3 đến ngày thứ 15 sau tai nạn bỏng.', 'Thường xuất hiện muộn sau ngày thứ 5.', 'Chỉ bắt đầu xuất hiện sau 1 tuần điều trị.', 'Xuất hiện rất muộn sau 1 tháng tiến triển.'], correct: "A", topic: "1" },
{ id: 66, text: "Chủng vi khuẩn sinh mủ thường gặp nhất gây biến chứng nhiễm trùng tại các tổn thương vết bỏng trên lâm sàng là:", answers: ['Tụ cầu vàng (Staphylococcus aureus) và trực khuẩn mủ xanh.', 'Vi khuẩn não mô cầu (Neisseria meningitidis).', 'Vi khuẩn phế cầu (Streptococcus pneumoniae).', 'Phẩy khuẩn tả (Vibrio cholerae).'], correct: "A", topic: "1" },
{ id: 67, text: "Nguyên nhân hàng đầu dẫn đến tỷ lệ tử vong cao nhất cho người bệnh bỏng trong giai đoạn thứ ba (giai đoạn nhiễm trùng vết bỏng) là:", answers: ['Tình trạng tăng huyết áp ác tính không kiểm soát được.', 'Biến chứng mất ngủ kéo dài gây suy nhược thần kinh.', 'Biến chứng nhiễm khuẩn huyết và sốc nhiễm khuẩn từ vết bỏng.', 'Biến chứng gãy xương do các tổn thương cơ học phối hợp đi kèm.'], correct: "C", topic: "1" },
{ id: 68, text: "Để tạo phẫu trường rộng rãi và an toàn trong mổ nội soi ổ bụng, áp lực bơm hơi khí CO2 tiêu chuẩn thường được duy trì ở mức:", answers: ['2 – 4 mmHg.', '5 – 7 mmHg.', '12 – 14 mmHg', '25 – 30 mmHg.'], correct: "C", topic: "1" },
{ id: 69, text: "Ống Trocar đầu tiên (thường dùng để đặt camera quan sát ổ bụng) trong phẫu thuật nội soi ổ bụng thông thường có kích thước đường kính là:", answers: ['3 mm.', '5 mm.', '8 mm.', '10 mm (hoặc 12 mm tùy loại camera).'], correct: "D", topic: "1" },
{ id: 70, text: "Phương pháp vô cảm tiêu chuẩn và bắt buộc phải áp dụng cho hầu hết các ca phẫu thuật nội soi ổ bụng có bơm hơi là:", answers: ['Thực hiện gây tê tại chỗ vùng chọc Trocar.', 'Thực hiện gây tê tủy sống vùng thắt lưng.', 'Gây mê toàn thân nội khí quản có giãn cơ.', 'Tiền mê kết hợp giảm đau đơn thuần.'], correct: "C", topic: "1" },
{ id: 71, text: "Một biến chứng hệ hô hấp đặc thù có thể gặp hậu phẫu sau mổ nội soi ổ bụng do quá trình bơm hơi khí CO2 áp lực lớn gây ra là:", answers: ['Phù thanh quản cấp do dị ứng chất liệu ống.', 'Tràn khí màng phổi hoặc tràn khí trung thất do rách các rãnh màng bụng.', 'Bệnh lý lao phổi tiến triển cấp tính.', 'Viêm thanh quản cấp tính do kích thích đường thở.'], correct: "B", topic: "1" },
{ id: 72, text: "Biến chứng tim mạch thường gặp nhất trong quá trình bơm hơi tạo áp lực ổ bụng trong mổ nội soi là gì?", answers: ['Nhịp tim chậm do kích thích dây thần kinh phế vị (dây X).', 'Biến chứng Block tim hoàn toàn (Block nhĩ thất độ III).', 'Ngừng tuần hoàn đột ngột do vô tâm thu.', 'Cơn loạn nhịp rung thất nguy hiểm.'], correct: "A", topic: "1" },
{ id: 73, text: "Cơ chế chính gây nên tình trạng giảm lượng nước tiểu (thiểu niệu) tạm thời của người bệnh trong quá trình bơm hơi ổ bụng nội soi là:", answers: ['Giảm bài tiết hormone chống bài niệu ADH từ tuyến yên.', 'Tăng lưu lượng dòng máu đến nuôi dưỡng hai thận.', 'Tăng tốc độ và chỉ số lọc của cầu thận.', 'Áp lực hơi tăng cao trực tiếp chèn ép lên nhu mô thận và hệ thống tĩnh mạch thận.'], correct: "D", topic: "1" },
{ id: 74, text: "Trong quá trình phẫu thuật nội soi, tình trạng tăng nồng độ khí PaCO2 trong máu kéo dài có thể gây nên hệ quả nào sau đây?", answers: ['Co mạch máu hệ thống thận và gây toan hô hấp.', 'Làm gia tăng đột ngột lượng nước tiểu bài tiết.', 'Làm tăng chỉ số pH của máu toàn phần.', 'Gây hiện tượng giảm nhịp tim sinh lý kéo dài.'], correct: "A", topic: "1" },
{ id: 75, text: "Biến chứng hình thành ổ áp xe tồn lưu trong ổ bụng sau phẫu thuật nội soi thường có nguyên nhân xuất phát từ:", answers: ['Quá trình lau hút dịch viêm, dịch máu tích tụ trong ổ bụng không sạch sẽ, triệt để.', 'Do người bệnh được chỉ định cho ăn uống quá sớm sau mổ.', 'Do người bệnh tiến hành tập đi lại, vận động quá sớm tại phòng bệnh.', 'Do lạm dụng liệu pháp thở oxy kéo dài sau phẫu thuật.'], correct: "A", topic: "1" },
{ id: 76, text: "Biện pháp kỹ thuật quan trọng nhất giúp hạn chế tối đa nguy cơ tai biến tắc mạch khí (Gas embolism) do khí CO2 lọt vào lòng mạch trong mổ nội soi là:", answers: ['Tiến hành bơm hơi thật nhanh vào ổ bụng với áp lực lớn ngay từ đầu.', 'Kiểm tra kỹ vị trí kim Veress đảm bảo nằm đúng trong khoang phúc mạc trước khi bơm khí.', 'Duy trì tốc độ bơm khí cố định ở mức rất thấp 1 lít/phút suốt cuộc mổ.', 'Tăng áp lực bơm hơi lên mức tối đa cho phép của máy bơm khí.'], correct: "B", topic: "1" },
{ id: 77, text: "Người bệnh sau mổ nội soi ổ bụng có biểu hiện đau bụng tiến triển tăng dần, sốt cao, bí trung đại tiện, bụng chướng nề kèm phản ứng thành bụng rõ. Điều dưỡng cần nhận định ngay nguy cơ biến chứng:", answers: ['Liệt ruột sinh lý thông thường sau mổ.', 'Viêm phúc mạc toàn bộ sau mổ do tổn thương tạng hoặc bục miệng nối.', 'Cơn viêm ruột cấp tính do nhiễm khuẩn thức ăn.', 'Biểu hiện của hội chứng ruột kích thích hậu phẫu.'], correct: "B", topic: "1" },
{ id: 78, text: "Người bệnh sau phẫu thuật lồng ngực xuất hiện tràn khí dưới da tiến triển tăng dần kèm theo khó thở. Hành động ưu tiên hàng đầu của điều dưỡng là:", answers: ['Tiếp tục theo dõi và ghi nhận diễn tiến vào hồ sơ.', 'Báo ngay cho bác sĩ điều trị để xử trí kịp thời.', 'Cho người bệnh nằm đầu cao và thở oxy qua gọng kính.', 'Tiến hành kẹp tạm thời ống dẫn lưu màng phổi.'], correct: "B", topic: "1" },
{ id: 79, text: "Người bệnh sau mổ ngực đột ngột xuất hiện khó thở dữ dội, tím tái, co kéo mạnh các cơ hô hấp phụ, tăng tiết nhiều đờm dãi trong đường thở. Xử trí điều dưỡng ưu tiên số một là:", answers: ['Cho người bệnh thở oxy lưu lượng cao qua mặt nạ.', 'Hút đờm dãi, khai thông đường thở ngay lập tức.', 'Đặt người bệnh ở tư thế Fowler cao và động viên hít thở sâu.', 'Kiểm tra tính thông suốt của hệ thống dẫn lưu và báo bác sĩ.'], correct: "B", topic: "1" },
{ id: 80, text: "Trong chăm sóc giảm đau cho người bệnh chấn thương ngực bằng thuốc giảm đau truyền tĩnh mạch thuộc nhóm Opioid (như Morphine), thông số lâm sàng nào điều dưỡng cần theo dõi sát nhất?", answers: ['Tình trạng tri giác và tổng trạng toàn thân.', 'Tần số, biên độ và nhịp điệu hô hấp.', 'Thị lực và phản xạ đồng tử.', 'Tình trạng xuất huyết tại vết thương.'], correct: "B", topic: "1" },
{ id: 81, text: "Người bệnh sau phẫu thuật vết thương ngực xuất hiện khó thở nặng, tím tái, tĩnh mạch cổ nổi to (cổ bạnh), hõm trên xương ức phồng khi thở ra. Biến chứng ngoại khoa cần nghĩ đến nhiều nhất là:", answers: ['Xẹp phổi sau mổ.', 'Tràn khí trung thất cấp tính.', 'Viêm phổi bệnh viện.', 'Tràn dịch màng tim mạn tính.'], correct: "B", topic: "1" },
{ id: 82, text: "Một người bệnh chấn thương ngực vào viện có dấu hiệu: huyết áp tụt, mạch nhanh nhỏ, chân tay lạnh, da niêm mạc nhợt nhạt, gõ đục vùng thấp phổi bên trái. Nguyên nhân lâm sàng phù hợp nhất là:", answers: ['Tràn máu màng phổi trái lượng nhiều gây sốc mất máu.', 'Cơn hen phế quan cấp tính.', 'Viêm thanh quan cấp gây co thắt.', 'Viêm phổi thùy mức độ nhẹ.'], correct: "A", topic: "1" },
{ id: 83, text: "Người bệnh chấn thương ngực có tình trạng khó thở tăng dần, rì rào phế nang giảm bên tổn thương, da tím tái, kích thích, vật vã rồi chuyển sang ngủ gà. Các dấu hiệu này cảnh báo tình trạng nguy hiểm nào?", answers: ['Thiếu O2 và tăng CO2 máu nghiêm trọng (Suy hô hấp cấp).', 'Cơn tăng huyết áp giới hạn.', 'Rối loạn tiêu hóa chức năng.', 'Thiếu hụt vitamin và vi chất dinh dưỡng.'], correct: "A", topic: "1" },
{ id: 84, text: "Ngay sau khi người bệnh chấn thương sọ não vào viện, thông thường điều dưỡng cần đo dấu hiệu sinh tồn và đánh giá tri giác (thang điểm Glasgow) với tần suất tối thiểu bao lâu một lần trong những giờ đầu?", answers: ['5 phút một lần cho đến khi ra viện.', '15 phút một lần cho đến khi tình trạng ổn định hoặc theo y lệnh.', '30 phút một lần trong suốt quá trình điều trị.', '1 giờ một lần bất kể tình trạng lâm sàng.'], correct: "B", topic: "1" },
{ id: 85, text: "Mục đích chính của việc sử dụng dung dịch ưu trương (như Mannitol 20%) qua đường tĩnh mạch cho người bệnh chấn thương sọ não là:", answers: ['Kéo nước từ khoảng kẽ tế bào não vào lòng mạch để làm giảm áp lực nội sọ.', 'Làm tăng huyết áp động mạch trung bình cho người bệnh.', 'Kích thích tăng bài tiết để dự phòng nhiễm trùng đường tiết niệu.', 'Kích thích trực tiếp tế bào thần kinh giúp người bệnh tỉnh lại nhanh hơn.'], correct: "A", topic: "1" },
{ id: 86, text: "Mục đích chính của việc chỉ định thuốc chống động kinh cho người bệnh chấn thương sọ não từ trung bình đến nặng trong tuần đầu tiên sau tai nạn là:", answers: ['Giúp người bệnh dễ ngủ và giảm lo âu.', 'Điều trị triệu chứng đau đầu dai dẳng hậu phẫu.', 'Phòng tránh các tổn thương thứ phát ở não gây ra do cơn co giật/động kinh.', 'Tăng cường khả năng phục hồi trí nhớ sau chấn thương.'], correct: "C", topic: "1" },
{ id: 87, text: "Tư thế nằm ưu tiên cho người bệnh chấn thương sọ não còn hôn mê, chưa có chỉ định mổ để đảm bảo an toàn đường thở là:", answers: ['Nằm sấp, đầu nghiêng sang một bên.', 'Nằm đầu thấp, chân gác cao trên gối.', 'Nằm ngửa, đầu cao 30∘ và nghiêng sang một bên (hoặc nằm nghiêng an toàn).', 'Nằm nghiêng hoàn toàn sang bên có tổn thương não.'], correct: "C", topic: "1" },
{ id: 88, text: "Khi người bệnh chấn thương sọ não nhẹ được xuất viện theo dõi tại nhà, dấu hiệu nguy hiểm nào quan trọng nhất cần hướng dẫn người nhà đưa bệnh nhân trở lại viện cấp cứu ngay?", answers: ['Người bệnh cảm thấy mệt mỏi nhẹ sau khi thức dậy.', 'Người bệnh ngủ nhiều hơn bình thường (khoảng 8 tiếng/ngày).', 'Người bệnh có cảm giác ăn uống không ngon miệng.', 'Xuất hiện triệu chứng mới hoặc chuyển biến xấu (nôn tái diễn, đau đầu tăng, lơ mơ).'], correct: "D", topic: "1" },
{ id: 89, text: "Sau phẫu thuật chấn thương sọ não, dấu hiệu lâm sàng nào gợi ý tình trạng nhiễm trùng thần kinh trung ương (viêm não hoặc viêm màng não)?", answers: ['Hội chứng màng não dương tính (Vạch màng não (+), dấu hiệu Brudzinski (+), cổ cứng).', 'Người bệnh ngủ sâu và thở đều theo chu kỳ.', 'Người bệnh có cảm giác thèm ăn và đòi ăn liên tục.', 'Vết mổ rỉ dịch huyết thanh màu hồng nhạt lượng ít.'], correct: "A", topic: "1" },
{ id: 90, text: "Để ngăn ngừa loét do tì đè hiệu quả cho bệnh nhân chấn thương cột sống chưa vững, giải pháp nào sau đây là phù hợp nhất?", answers: ['Nằm ngửa liên tục trên đệm cứng và không thay đổi tư thế.', 'Cho bệnh nhân nằm sấp luân phiên trong ngày.', 'Sử dụng kỹ thuật lăn trở khối gỗ (Log-rolling) để đổi tư thế mỗi 2 giờ trên đệm phù hợp.', 'Cho bệnh nhân ngồi dậy sớm trên ghế có đệm mềm.'], correct: "C", topic: "1" },
{ id: 91, text: "Người bệnh bị tổn thương tủy sống hoàn toàn từ mức thắt lưng 1 (L1) trở xuống thường bị mất cảm giác và vận động ở vùng nào?", answers: ['Toàn bộ vùng bụng và hai chi dưới.', 'Vùng tầng sinh môn và hai chi dưới.', 'Chỉ mất cảm giác chọn lọc ở hai bàn chân.', 'Mất cảm giác từ ngang đường liên sườn trở xuống.'], correct: "B", topic: "1" },
{ id: 92, text: "Mục đích chính của việc tiến hành tập vận động thụ động các khớp cho bệnh nhân liệt tủy ngay từ tuần đầu tiên sau chấn thương là gì?", answers: ['Để phục hồi nhanh chóng sức cơ cho bệnh nhân.', 'Để đề phòng biến chứng co rút cơ, teo cơ và cứng khớp.', 'Để kích thích bệnh nhân có thể đứng và đi lại được ngay.', 'Để kích thích sự phát triển chiều dài của xương chi dưới.'], correct: "B", topic: "1" },
{ id: 93, text: "Khi lập kế hoạch tái hòa nhập cộng đồng cho bệnh nhân liệt hoàn toàn hai chi dưới (hai tay và trí tuệ bình thường), định hướng nghề nghiệp nào sau đây là phù hợp nhất?", answers: ['Công nhân xây dựng công trình.', 'Nhân viên văn phòng, kế toán, công nghệ thông tin.', 'Thợ may công nghiệp đứng chuyền.', 'Vận động viên điền kinh'], correct: "B", topic: "1" },
{ id: 94, text: "Tình trạng hạ huyết áp tư thế đứng ở bệnh nhân tổn thương tủy sống có thể được phòng ngừa hiệu quả bằng cách nào?", answers: ['Đỡ bệnh nhân ngồi dậy thật nhanh để cơ thể tự thích nghi.', 'Cho bệnh nhân thay đổi tư thế từ từ, nâng cao đầu giường dần dần trước khi ngồi dậy.', 'Cho bệnh nhân uống thuốc co mạch tăng huyết áp liên tục trong ngày.', 'Tiến hành băng kín hai chân bệnh nhân thật chặt bằng băng thun liên tục 24/24h.'], correct: "B", topic: "1" },
{ id: 95, text: "Trong chăm sóc người bệnh chấn thương tủy sống giai đoạn cấp, mục đích chính của việc theo dõi và nghe đánh giá âm ruột (nhu động ruột) định kỳ là:", answers: ['Phát hiện sớm tình trạng xuất huyết tiêu hóa do loét stress (loét Cushing).', 'Đánh giá sự hồi phục của nhu động ruột để xác định thời điểm bắt đầu cho người bệnh ăn qua đường miệng.', 'Kiểm tra xem ống thông dạ dày có bị tắc nghẽn hoặc lệch vị trí hay không.', 'Đánh giá mức độ dung nạp của cơ thể đối với các thuốc vận mạch.'], correct: "B", topic: "1" },
{ id: 96, text: "Hành động nào mang tính nhân văn và quan trọng nhất giúp bệnh nhân liệt tứ chi do chấn thương tủy vượt qua mặc cảm, tự ti?", answers: ['Nói dối với bệnh nhân rằng họ sẽ sớm đi lại được như người bình thường.', 'Cách ly bệnh nhân ở phòng riêng để họ tránh tiếp xúc với xã hội.', 'Khuyến khích, hỗ trợ bệnh nhân tự thực hiện các hoạt động chăm sóc cá nhân trong khả năng.', 'Nhân viên y tế và người nhà làm thay tất cả mọi việc để bệnh nhân không phải vận động.'], correct: "C", topic: "1" },
{ id: 97, text: "Biến chứng cấp tính xuất hiện sớm ngay trong hoặc sau những giờ đầu mở khí quản là:", answers: ['Hẹp lòng khí quản thứ phát.', 'Xơ hóa nhu mô phổi.', 'Viêm phổi mạn tính do trào ngược.', 'Chảy máu cấp tính tại chân lỗ mở khí quản hoặc lòng đường thở.'], correct: "D", topic: "1" },
{ id: 98, text: "Khi chăm sóc người bệnh có mở khí quản, điều dưỡng phát hiện vùng da quanh cổ người bệnh sưng nề, khi ấn ngón tay vào có tiếng nổ lép bép dưới da. Đây là dấu hiệu điển hình của biến chứng nào?", answers: ['Nhiễm trùng vết mổ sâu.', 'Tràn khí dưới da.', 'Phù nề dị ứng do chất liệu dây cố định.', 'Tụ máu lớn chân mở khí quản.'], correct: "B", topic: "1" },
{ id: 99, text: "Trong quy trình thay dây cố định ống canule mở khí quản, tại sao bắt buộc phải cố định xong dây mới rồi mới được cắt bỏ dây cũ?", answers: ['Để đảm bảo canun luôn được giữ cố định, tránh nguy cơ tuột/sút ống khi người bệnh ho đột ngột.', 'Để tiết kiệm thời gian và đơn giản hóa các bước làm việc của điều dưỡng.', 'Để tránh việc canun bị xoay trục làm tổn thương niêm mạc khí quản.', 'Để người bệnh cảm thấy an tâm hơn về mặt tâm lý.'], correct: "A", topic: "1" },
{ id: 100, text: "Khi tiến hành kỹ thuật vệ sinh, chăm sóc vết mổ mở khí quản, thứ tự thực hiện nào sau đây là đúng nguyên tắc vô khuẩn?", answers: ['Sát khuẩn da vùng xa → sát khuẩn da vùng gần → lau mặt ngoài canun.', 'Lau miệng ống bên trong → lau mặt ngoài ống cố định → sát khuẩn vùng da xung quanh từ trong ra ngoài.', 'Sát khuẩn vùng da dưới cánh canun trước vì đây là nơi tập trung nhiều dịch bẩn nhất.', 'Lau rửa dây cố định trước rồi mới tiến hành sát khuẩn da.'], correct: "B", topic: "1" },
{ id: 101, text: "Khi thay dây cố định mở khí quản cho người bệnh, tiêu chuẩn để đánh giá độ căng (độ chặt) của dây đạt yêu cầu trên lâm sàng là:", answers: ['Dây phải được buộc thật chặt, không thể luồn được bất cứ vật gì qua. B. Dây buộc lỏng để có thể luồn được ba đến bốn ngón tay thoải mái.', 'Độ căng vừa phải, luồn vừa khít từ một đến hai ngón tay dưới dây buộc.', 'Dây thật lỏng để canun có thể tự do xoay tròn theo chuyển động của cổ.'], correct: "C", topic: "1" },
{ id: 102, text: "Tại sao bắt buộc phải cung cấp oxy có qua hệ thống làm ẩm và làm ấm cho người bệnh đang thở qua ống mở khí quản?", answers: ['Để người bệnh cảm thấy dễ chịu và ấm áp hơn khi hít thở.', 'Để thay thế chức năng sinh lý của mũi, tránh khô niêm mạc đường thở, xẹp phổi và đờm đặc đóng bánh gây tắc ống.', 'Để dung dịch sát khuẩn trong bình làm ẩm tiến hành diệt khuẩn dòng khí oxy.', 'Để giữ cho áp lực trong bóng chèn (cuff) luôn được ổn định.'], correct: "B", topic: "1" },
{ id: 103, text: "Khi người bệnh có ống mở khí quản được chỉ định cho ăn qua ống thông dạ dày, tại sao cần kiểm tra áp lực bóng chèn (cuff) trước khi ăn và giữ bóng chèn bơm phù hợp trong và sau khi ăn 15-30 phút?", answers: ['Nhằm tạo khoảng trống cho người bệnh tập nói chuyện dễ dàng hơn.', 'Nhằm ngăn chặn hiện tượng dịch thức ăn trào ngược từ dạ dày bị hít sặc vào đường hô hấp dưới.', 'Nhằm kích thích dạ dày tăng co bóp và tiêu hóa thức ăn nhanh hơn.', 'Nhằm mục đích ngăn ngừa tuyệt đối tình trạng người bệnh bị nôn ói.'], correct: "B", topic: "1" },
{ id: 104, text: "Tại sao chấn thương bụng kín thường gây khó khăn và dễ bỏ sót trong việc chẩn đoán tổn thương ở những giờ đầu?", answers: ['Do nạn nhân thường nhập viện trong tình trạng sốc mất máu hoặc hôn mê sâu.', 'Do các tổn thương phối hợp nặng ở sọ não, cột sống hoặc gãy xương chi che lấp triệu chứng bụng.', 'Do tổn thương tạng rỗng giai đoạn đầu chưa rõ ràng, biểu hiện viêm phúc mạc thường xuất hiện muộn sau 6–12 giờ.', 'Tất cả các nguyên nhân trên đều đúng.'], correct: "D", topic: "1" },
{ id: 105, text: "Tiến hành chọc dò hoặc chọc rửa ổ bụng cấp cứu hút ra máu dòng không đông (chiếm khoảng 80% trường hợp chấn thương) có ý nghĩa lâm sàng là:", answers: ['Xác định bệnh nhân có tiền sử mắc bệnh lý máu khó đông (Hemophilia).', 'Khẳng định có tình trạng chảy máu nội tạng hoạt động trong ổ bụng.', 'Phản ánh tình trạng bệnh nhân đang bị thiếu máu mạn tính mức độ nặng.', 'Biểu hiện của kỹ thuật chọc dò thực hiện sai vị trí giải phẫu.'], correct: "B", topic: "1" },
{ id: 106, text: "Chẩn đoán điều dưỡng nào sau đây được xếp vào nhóm ưu tiên hàng đầu đối với người bệnh vỡ tạng đặc (gan, lách) gây chảy máu trong ổ bụng?", answers: ['Nguy cơ nhiễm trùng thứ phát liên quan đến vết mổ ngoại khoa.', 'Thiếu hụt dinh dưỡng liên quan đến tình trạng chướng bụng, nôn ói.', 'Giảm khối lượng tuần hoàn liên quan đến tình trạng mất máu cấp tính từ tạng vỡ.', 'Lo âu, căng thẳng liên quan đến việc chưa hiểu rõ về tình trạng bệnh lý.'], correct: "C", topic: "1" },
{ id: 107, text: "Biến chứng "Chảy máu thì hai" trong tổn thương chấn thương gan, lách kín được hiểu trên lâm sàng là do cơ chế nào?", answers: ['Do khối máu tụ áp lực lớn nằm dưới bao tạng bị vỡ vào ổ bụng sau vài ngày theo dõi.', 'Do người bệnh cử động xoay trở mình quá mạnh trong phòng hậu phẫu.', 'Do vi khuẩn xâm nhập gây nhiễm trùng và hoại tử mạch máu vết mổ.', 'Do tác dụng phụ của thuốc kháng sinh điều trị gây rối loạn đông máu.'], correct: "A", topic: "1" },
{ id: 108, text: "Người bệnh nam nhập viện do bị đâm vào vùng bụng, hiện tại con dao nhọn vẫn còn cắm nguyên vị trí ở thành bụng. Điều dưỡng cần xử trí tại chỗ như thế nào là đúng nguyên tắc?", answers: ['Rút ngay con dao ra khỏi thành bụng và tiến hành băng ép chặt để cầm máu.', 'Giữ nguyên dị vật và không làm gì cả vì sẽ ảnh hưởng đến vết thương gây chảy máu thêm', 'Giữ nguyên dị vật, dùng gạc vô khuẩn cuộn cố định vững chắc xung quanh chân dị vật và chuyển ngay lên phòng mổ cấp cứu.', 'Đổ trực tiếp dung dịch oxy già hoặc cồn sát khuẩn liều cao vào xung quanh dị vật.'], correct: "C", topic: "1" },
{ id: 109, text: "Một người bệnh sau mổ chấn thương bụng xuất hiện tình trạng nấc cụt liên tục, đau tăng nhiều ở vùng hạ sườn phải kèm theo sốt cao dao động. Điều dưỡng cần nghi ngờ biến chứng hậu phẫu nào?", answers: ['Tắc ruột cơ học muộn sau mổ.', 'Viêm dạ dày cấp tính do stress.', 'Hình thành ổ áp xe dưới cơ hoành.', 'Tụ máu hoặc chảy máu thành bụng tại vết mổ.'], correct: "C", topic: "1" },
{ id: 110, text: "Trong theo dõi chấn thương bụng kín chưa có chỉ định mổ, tại sao thời gian theo dõi sát tại bệnh viện tối thiểu phải từ 5 đến 7 ngày?", answers: ['Nhằm mục đích hoàn thiện các thủ tục hành chính và đóng đủ viện phí.', 'Vì có những tổn thương diễn tiến chậm, tiềm tàng như vỡ tạng đặc thì hai hoặc hoại tử thủng ruột do thiếu máu cục bộ.', 'Để tuân thủ theo quy định chung về thời gian lưu viện tối thiểu của bảo hiểm.', 'Để chờ đợi đầy đủ tất cả các kết quả xét nghiệm sinh hóa máu chuyên sâu.'], correct: "B", topic: "1" },
{ id: 111, text: "Một mảnh da tự thân được ghép lên vùng tổn thương, ở giai đoạn sống bám bình thường (được tưới máu tốt) sẽ có màu sắc như thế nào?", answers: ['Tím đen hoặc xám xịt do hoại tử.', 'Xanh tái, lạnh khi sờ vào.', 'Trắng bệch do thiếu máu nuôi dưỡng.', 'Hồng hào, ấm áp, tương đồng hoặc hơi đậm hơn màu da lành xung quanh.'], correct: "D", topic: "1" },
{ id: 112, text: "Sau khi phẫu thuật ghép da, nếu tiến hành ấn ngón tay lên vùng da ghép và nhận thấy màu sắc da trở lại rất chậm (thời gian làm đầy mao mạch >2−3 giây), đây là dấu hiệu cảnh báo tình trạng gì?", answers: ['Sự gia tăng lưu lượng tuần hoàn vi mạch tại mảnh ghép.', 'Giảm lưu lượng máu nuôi dưỡng hoặc có tình trạng thiếu máu cục bộ mảnh ghép.', 'Diễn tiến hoàn toàn bình thường của mảnh ghép ở tuần đầu tiên.', 'Hiện tượng sinh lý không liên quan đến hệ thống tuần hoàn ngoại vi.'], correct: "B", topic: "1" },
{ id: 113, text: "Dấu hiệu lâm sàng nào gợi ý có tình trạng tắc nghẽn mạch máu tĩnh mạch (ứ máu) ở vùng vạt da hoặc mảnh da được ghép?", answers: ['Da có màu đỏ tím hoặc sẫm màu, bề mặt quá căng, xuất hiện nhiều nốt phồng ứ dịch.', 'Da trở nên trắng bệch, nhợt nhạt và lạnh.', 'Da có màu hồng nhạt, mềm mại khi ấn vào.', 'Người bệnh bị mất hoàn toàn cảm giác đau tại vị trí lấy da.'], correct: "A", topic: "1" },
{ id: 114, text: "Người bệnh bỏng ở giai đoạn phục hồi cần được hướng dẫn tập vận động các khớp sớm nhằm mục đích chính là gì?", answers: ['Giảm cảm giác đau đớn tại vị trí các vết bỏng sâu.', 'Ngăn ngừa biến chứng teo cơ, co rút gân và cứng khớp do sẹo bỏng co kéo.', 'Kích thích làm bong nhanh các tế bào hoại tử khô để mau liền sẹo.', 'Giúp dịch mủ thoát ra tốt hơn và tăng lưu thông tuần hoàn hệ thống.'], correct: "B", topic: "1" },
{ id: 115, text: "Dấu hiệu lâm sàng nào sau đây cho thấy người bệnh bỏng đang có nguy cơ cao bị tổn thương đường hô hấp do nhiệt hoặc khí độc?", answers: ['Người bệnh than phiền đau rát nhiều tại vùng ngực và thành bụng.', 'Mạch nhanh trên 100 lần/phút, huyết áp tụt, lượng nước tiểu giảm rõ rệt.', 'Cháy xém lông mũi, niêm mạc mũi miệng có muội than, đờm sẫm màu, ho khan, tiếng thở rít hoặc tím tái.', 'Vết bỏng ở vùng chi dưới có dấu hiệu tiết nhiều dịch huyết thanh.'], correct: "C", topic: "1" },
{ id: 116, text: "Trong giai đoạn phòng chống sốc bỏng (24 - 48 giờ đầu), chỉ số nào cần được điều dưỡng theo dõi và ghi nhận hàng giờ để đánh giá chính xác nhất hiệu quả bù dịch và sự tưới máu thận?", answers: ['Chỉ số huyết áp tâm thu và huyết áp tâm trương.', 'Số lượng và màu sắc nước tiểu đo được qua ống thông tiểu liên tục.', 'Nồng độ chất điện giải Kali (Potassium) trong máu.', 'Áp lực tĩnh mạch trung tâm (CVP) đo qua catheter.'], correct: "B", topic: "1" },
{ id: 117, text: "Các can thiệp điều dưỡng để giữ ổn định thân nhiệt cho người bệnh bỏng diện rộng bao gồm các nội dung sau, NGOẠI TRỪ:", answers: ['Kiểm soát tốt nhiệt độ phòng bệnh (giữ ấm) và đắp chăn ấm cho người bệnh.', 'Hạn chế tối đa việc bộc lộ toàn bộ vết bỏng quá lâu trong quá trình thay băng.', 'Duy trì chế độ dinh dưỡng giàu Calo trong ngày để tạo năng lượng nội sinh giữ ấm.', 'Tiến hành tắm nước mát hoặc lau người bằng nước lạnh hàng ngày để hạ nhiệt vết bỏng.'], correct: "D", topic: "1" },
{ id: 118, text: "Người bệnh có tiền sử bệnh phổi tắc nghẽn mạn tính (COPD) khi thực hiện phẫu thuật nội soi ổ bụng cần được điều dưỡng và kíp gây mê chú ý theo dõi sát nguy cơ biến chứng nào do bơm khí CO2?", answers: ['Cơn tăng huyết áp kịch phát do thiếu oxy mạn tính', 'Toan hô hấp do hấp thu khí CO2 từ ổ bụng kết hợp với tình trạng giảm thông khí.', 'Táo bón chức năng kéo dài sau mổ.', 'Hạ đường huyết đột ngột do stress phẫu thuật.'], correct: "B", topic: "1" },
{ id: 119, text: "Trên điện tâm đồ (ECG), dấu hiệu nào sau đây có thể xuất hiện đột ngột cảnh báo biến chứng tắc mạch khí trong quá trình bơm hơi nội soi ổ bụng?", answers: ['ST chênh xuống đơn thuần ở các chuyển đạo ngoại biên.', 'Phức hợp QRS giãn rộng đột ngột kèm theo dấu hiệu tâm phế cấp', 'Sóng P biến mất hoàn toàn trên toàn bộ băng ghi.', 'Xuất hiện Block nhĩ thất độ I ổn định.'], correct: "B", topic: "1" },
{ id: 120, text: "Khi áp lực bơm hơi khí CO2 trong ổ bụng được duy trì quá cao (>15 mmHg) trong thời gian dài, hậu quả huyết động học hệ thống quan trọng xảy ra là gì?", answers: ['Tăng cung lượng tim do kích thích giao cảm.', 'Giảm sức cản mạch máu ngoại vi toàn thân.', 'Chèn ép tĩnh mạch chủ dưới làm giảm lượng máu hồi lưu về tim (giảm tiền gánh).', 'Tăng dòng máu tưới trực tiếp cho nhu mô thận.'], correct: "C", topic: "1" },
{ id: 121, text: "Người bệnh đang trong quá trình phẫu thuật nội soi ổ bụng đột ngột xuất hiện tụt huyết áp sâu, da tím tái, chỉ số EtCO2 (áp lực khí CO2 cuối kỳ thở ra) sụt giảm rất nhanh. Biến chứng ngoại khoa/gây mê cần nghĩ đến đầu tiên là:", answers: ['Nhồi máu cơ tim cấp tính diện rộng.', 'Tắc mạch khí do khí CO2 lọt vào lòng mạch tổn thương.', 'Xuất huyết tiêu hóa cấp tính do loét cũ.', 'Co thắt phế quản đơn thuần do kích thích ống nội khí quản.'], correct: "B", topic: "1" },
{ id: 122, text: "Khi áp lực khí ổ bụng tăng cao vượt mốc 20 mmHg và kéo dài suốt cuộc mổ nội soi, hậu quả sinh lý nào sau đây là nguy hiểm nhất đối với hệ tuần hoàn?", answers: ['Tăng mạnh nhu động ruột và tăng tiết dịch tiêu hóa.', 'Giảm thể tích cuối tâm trương và giảm chức năng co bóp của thất trái do cơ hoành bị đẩy lên cao kèm giảm máu về tim.', 'Tăng chỉ số lọc cầu thận do tăng áp lực thẩm thấu.', 'Tăng lưu lượng tim để bù trừ cho mô ngoại vi.'], correct: "B", topic: "1" },
{ id: 123, text: "Người bệnh sau phẫu thuật nội soi ổ bụng kéo dài xuất hiện tình trạng thiểu niệu (lượng nước tiểu <0,5 ml/kg/giờ), xét nghiệm thấy chỉ số Creatinin máu tăng nhẹ. Cơ chế bệnh sinh phù hợp nhất giải thích cho tình trạng này là gì?", answers: ['Sự gia tăng đột ngột lưu lượng máu nuôi dưỡng thận trong cuộc mổ.', 'Giảm bài tiết hormone chống bài niệu ADH của tuyến yên.', 'Tăng áp lực ổ bụng khi bơm hơi gây chèn ép nhu mô thận, tĩnh mạch thận và làm giảm áp lực lọc cầu thận.', 'Tăng cường tốc độ lọc của các nephron ở vỏ thận.'], correct: "C", topic: "1" },
{ id: 124, text: "Khó thở trong chấn thương ngực thường:", answers: ['Khó thở giảm dần', 'Khó thở tăng dần', 'Khó thở buổi sáng', 'Khó thở ban đêm'], correct: "B", topic: "1" },
{ id: 125, text: "Ho ra máu trong chấn thương ngực là:", answers: ['Rât hay gặp', 'Thỉnh thoảng nhưng không có giá trị chẩn đoán', 'Hiếm nhưng giá trị cao', 'Không liên quan đến chấn thương ngực'], correct: "C", topic: "1" },
{ id: 126, text: "Dấu hiệu gợi ý tràn máu màng phổi khi gõ là:", answers: ['Gõ vang', 'Gõ đục', 'Gõ kêu như thùng rỗng', 'Dấu hiệu không rõ'], correct: "B", topic: "1" },
{ id: 127, text: "Biến chứng sớm nguy hiểm nhất  trong chấn thương ngực là:", answers: ['Dày dính màng phổi', 'Mủ màng phổi', 'Sốc', 'Ho kéo dài'], correct: "C", topic: "1" },
{ id: 128, text: "Nguyên tắc điều trị đầu tiên trong chấn thương ngực là:", answers: ['Kháng sinh', 'Giảm đau', 'Chống sốc và suy hô hấp', 'Tập vận động'], correct: "C", topic: "1" },
{ id: 129, text: "Nguyên nhân chính gây suy hô hấp trong chấn thương ngực kín là:", answers: ['Nhiễm trùng', 'Rối loạn thông khí', 'Tăng huyết áp', 'Thiếu máu nhẹ'], correct: "B", topic: "1" },
{ id: 130, text: "Dấu hiệu đặc trưng của mảng sườn di động là:", answers: ['Khó thở', 'Hô hấp đảo chiều', 'Không có dấu hiệu đặc trưng', 'Thở nhanh và nông'], correct: "B", topic: "1" },
{ id: 131, text: "Dấu hiệu chèn ép tim cấp là:", answers: ['Huyết áp tăng', 'Tĩnh mạch cổ nổi', 'Nhịp tim chậm', 'Da môi tím tái'], correct: "B", topic: "1" },
{ id: 132, text: "Biện pháp giảm đau hiệu quả trong gãy sườn nặng là:", answers: ['Dùng Paracetamol để giảm đau', 'Phong bế thần kinh liên sườn', 'Nghỉ ngơi hoàn toàn', 'Không điều trị gì'], correct: "B", topic: "1" },
{ id: 133, text: "Trong chăm sóc sau mổ ngực, người bệnh cần được:", answers: ['Hạn chế ho hoàn toàn để chống bục vết mổ', 'Khuyến khích thở sâu', 'Nằm bất động tuyệt đối nhiều ngày', 'Tất cả đều đúng'], correct: "B", topic: "1" },
{ id: 134, text: "Người bệnh chấn thương ngực có mạch nhanh, HA tụt, tĩnh mạch cổ nổi, tiếng tim mờ xa xăm. Điều dưỡng nghĩ nhiều đến:", answers: ['Tràn khí màng phổi đơn thuần', 'Hội chứng chèn ép tim cấp', 'Gãy xương đòn', 'Viêm phế quản'], correct: "B", topic: "1" },
{ id: 135, text: "Triệu chứng thực thể nào dưới đây điển hình của chấn thương sọ não nhẹ?", answers: ['Hôn mê sâu', 'Dãn đồng tử', 'Đau đầu, buồn nôn', 'Yếu liệt tứ chi'], correct: "C", topic: "1" },
{ id: 136, text: "Trong thang điểm Glasgow, mức điểm từ 13 - 15 được phân loại là:", answers: ['Chấn thương sọ não nhẹ', 'Chấn thương sọ não trung bình', 'Chấn thương sọ não nặng', 'Hôn mê sâu'], correct: "A", topic: "1" },
{ id: 137, text: "Thuốc lợi tiểu qua đường tĩnh mạch có tác dụng gì trong chấn thương sọ não?", answers: ['Tăng huyết áp', 'Giảm áp lực nội sọ', 'Chống nhiễm trùng', 'Giảm đau đầu'], correct: "B", topic: "1" },
{ id: 138, text: "Dấu hiệu sớm của nguy cơ loét ép do tỳ đè là:", answers: ['Vết mổ thấm dịch', 'Da vùng tỳ đè đỏ lên', 'Da rỉ dịch', 'Huyết áp tăng cao'], correct: "B", topic: "1" },
{ id: 139, text: "Tư thế nằm cho người bệnh sau mổ máu tụ ngoài màng cứng thường là:", answers: ['Nằm nghiêng bên lành, đầu cao 45 độ', 'Nằm sấp', 'Nằm ngửa không gối', 'Nằm nghiêng bên mổ'], correct: "D", topic: "1" },
{ id: 140, text: "Người bệnh có biểu hiện 'duỗi cứng mất não' nhận được mấy điểm vận động Glasgow?", answers: ['1 điểm', '2 điểm', '3 điểm', '4 điểm'], correct: "B", topic: "1" },
{ id: 141, text: "Nguyên tắc điều trị chấn thương nặng tập trung vào việc đảm bảo:", answers: ['Vệ sinh sạch sẽ', 'Oxy và lượng máu tưới não', 'Vận động sớm', 'Chế độ ăn nhiều vitamin'], correct: "B", topic: "1" },
{ id: 142, text: "Nguyên tắc điều trị chính cho chấn thương sọ não nhẹ là:", answers: ['Phẫu thuật ngay', 'Dùng thuốc lợi tiểu mạnh', 'Nghỉ ngơi và theo dõi tại nhà', 'Truyền dịch ưu trương'], correct: "C", topic: "1" },
{ id: 143, text: "Theo dõi Glasgow trong cấp cứu nên thực hiện:", answers: ['1 lần/ngày', '15 phút/lần khi chưa ổn định', '1 tuần/lần', 'Không cần theo dõi'], correct: "B", topic: "1" },
{ id: 144, text: "Khi bệnh nhân có dấu hiệu co giật, xử trí đầu tiên của điều dưỡng là:", answers: ['Cho ăn ngay', 'Trói tay chân hạn chế co giật', 'Thực hiện y lệnh thuốc khẩn cấp', 'Giữ an toàn, tránh chấn thương'], correct: "D", topic: "1" },
{ id: 145, text: "Thời điểm nào người bệnh CTSN thường được chỉ định chụp MRI thay vì CT Scan?", answers: ['Ngay khi mới nhập viện để cấp cứu nhanh', 'Khi cần phát hiện lún xương sọ', 'Khi tình trạng người bệnh đã ổn định hoặc triệu chứng không cải thiện', 'Khi người bệnh có vết thương xuyên thấu cấp tính', 'Hôn mê sâu', 'Dãn đồng tử', 'Đau đầu, buồn nôn', 'Yếu liệt tứ chi'], correct: "C", topic: "1" },
{ id: 146, text: "Ngay sau khi người bệnh CTSN vào viện, điều dưỡng cần đo dấu hiệu sinh tồn và đánh giá tình trạng thần kinh với tần suất bao lâu một lần?", answers: ['5 phút/lần', '15 phút/lần cho đến khi ổn định', '30 phút/lần', '1 giờ/lần'], correct: "B", topic: "1" },
{ id: 147, text: "Mục đích chính của việc sử dụng thuốc lợi tiểu (như Manitol 20%) qua đường tĩnh mạch cho người bệnh CTSN là:", answers: ['Để tăng huyết áp cho người bệnh', 'Làm giảm áp lực nội sọ bằng cách giảm lượng dịch trong các mô', 'Để dự phòng nhiễm trùng đường tiết niệu', 'Để kích thích người bệnh tỉnh lại nhanh hơn Đáp án: B..'], correct: "B", topic: "1" },
{ id: 148, text: "Tại sao thuốc chống động kinh được chỉ định cho người bệnh CTSN từ trung bình đến nặng trong tuần đầu tiên?", answers: ['Để giúp người bệnh dễ ngủ hơn', 'Để giảm đau đầu dai dẳng', 'Để phòng tránh các tổn thương thêm ở não gây ra do cơn động kinh', 'Để tăng cường trí nhớ sau chấn thương'], correct: "C", topic: "1" },
{ id: 149, text: "Tư thế nằm ưu tiên cho người bệnh CTSN trước mổ để đảm bảo hô hấp là:", answers: ['Nằm sấp, đầu nghiêng một bên', 'Nằm đầu thấp, chân cao', 'Nằm ngửa, đầu nghiêng một bên', 'Nằm nghiêng hoàn toàn sang bên tổn thương'], correct: "C", topic: "1" },
{ id: 150, text: "Khi người bệnh CTSN nhẹ được theo dõi tại nhà, dấu hiệu nào là quan trọng nhất cần hướng dẫn người nhà đưa bệnh nhân trở lại viện ngay?", answers: ['Người bệnh kêu mệt mỏi', 'Người bệnh ngủ nhiều hơn 8 tiếng/ngày', 'Người bệnh chán ăn', 'Xuất hiện các triệu chứng mới hoặc dấu hiệu xấu đi (nôn nhiều, đau đầu tăng, lơ mơ)'], correct: "D", topic: "1" },
{ id: 151, text: "Dấu hiệu lâm sàng nào gợi ý tình trạng viêm não hoặc viêm màng não sau mổ?", answers: ['Vạch màng não (+) và dấu hiệu Brudzinsky (+)', 'Người bệnh ngủ say', 'Người bệnh đòi ăn liên tục', 'Vết mổ rỉ dịch màu hồng nhạt'], correct: "A", topic: "1" },
{ id: 152, text: "Trước khi cho người bệnh sau mổ CTSN ăn qua đường miệng, bước quan trọng nhất là:", answers: ['Cho người bệnh uống nhiều nước', 'Kiểm tra khả năng tự nuốt của người bệnh khi đã tỉnh hẳn', 'Chỉ cho ăn khi người bệnh yêu cầu mãnh liệt', 'Luôn luôn đặt ống thông dạ dày trước mỗi bữa ăn để dự phòng'], correct: "B", topic: "1" },
{ id: 153, text: "Trong giáo dục sức khỏe trước khi xuất viện, nội dung nào cần lưu ý đặc biệt cho người nhà người bệnh CTSN nặng?", answers: ['Tuyệt đối không cho người bệnh vận động', 'Cho người bệnh ăn chế độ ăn ít đạm mãi mãi', 'Theo dõi sát các cơn động kinh và các dấu hiệu thần kinh bất thường để tái khám ngay', 'Tự thay băng vết mổ tại nhà bằng nước muối tự pha'], correct: "C", topic: "1" },
{ id: 154, text: "Việc massage toàn thân 24 giờ/lần và vệ sinh cá nhân hàng ngày cho người bệnh CTSN hôn mê nhằm mục đích chính là:", answers: ['Để người bệnh không bị hôi', 'Giúp người bệnh tỉnh lại nhanh hơn', 'Để người nhà hài lòng với dịch vụ chăm sóc', 'Phòng ngừa nhiễm trùng, loét tỳ đè và tăng cường tuần hoàn'], correct: "D", topic: "1" },
{ id: 155, text: "Dấu hiệu nào sau đây ở nam giới là đặc trưng khi bị đứt tủy sống cấp tính?", answers: ['Mất khả năng cương cứng hoàn toàn.', 'Dương vật luôn trong tình trạng co cứng.', 'Tiểu tiện không tự chủ ngay lập tức.', 'Tăng cảm giác vùng tầng sinh môn.'], correct: "B", topic: "1" },
{ id: 156, text: "Kỹ thuật chẩn đoán hình ảnh nào là tốt nhất để khảo sát tổn thương chi tiết trong nhu mô tủy sống?", answers: ['Chụp X-quang cột sống thẳng nghiêng.', 'Chụp cắt lớp vi tính (CT Scanner).', 'Chụp cộng hưởng từ (MRI) cột sống.', 'Chụp phim tư thế Blondeau.'], correct: "C", topic: "1" },
{ id: 157, text: "Khi sơ cứu người bệnh nghi ngờ gãy cột sống, tư thế vận chuyển nào sau đây là SAI?", answers: ['Nằm ngửa trên cán cứng.', 'Nằm sấp trên cán mềm.', 'Cho người bệnh ngồi tựa lưng để dễ thở.', 'Nằm thẳng và cố định cổ bằng nẹp.'], correct: "C", topic: "1" },
{ id: 158, text: "Bệnh nhân chấn thương cột sống ngực đoạn D6 thường có biểu hiện mạch và huyết áp như thế nào?", answers: ['Mạch nhanh và huyết áp tăng cao.', 'Mạch thường chậm (50-60 lần/phút) và huyết áp giảm.', 'Mạch và huyết áp không thay đổi.', 'Mạch nhanh nhưng huyết áp hạ thấp.'], correct: "B", topic: "1" },
{ id: 159, text: "Tại sao cần đặt dẫn lưu dạ dày giải áp cho bệnh nhân chấn thương cột sống trong 48-72 giờ đầu?", answers: ['Để nuôi dưỡng bệnh nhân qua đường tiêu hóa.', 'Do tình trạng liệt ruột cơ năng gây chướng bụng.', 'Để kiểm tra xem bệnh nhân có bị xuất huyết dạ dày không.', 'Để chuẩn bị cho phẫu thuật cột sống cổ.'], correct: "B", topic: "1" },
{ id: 160, text: "Trong thực hiện kế hoạch chăm sóc, tần suất đánh giá chức năng vận động và cảm giác được khuyến cáo là bao nhiêu?", answers: ['Tối thiểu mỗi 2 giờ/lần.', 'Tối thiểu mỗi 4 giờ/lần.', 'Mỗi ngày 1 lần vào buổi sáng.', 'Chỉ đánh giá khi bệnh nhân kêu đau hoặc có yêu cầu.'], correct: "A", topic: "1" },
{ id: 161, text: "Biện pháp nào hiệu quả nhất để giúp bệnh nhân liệt tủy tống dịch tiết đường hô hấp ra ngoài?", answers: ['Cho bệnh nhân uống thuốc loãng đờm.', 'Đặt bệnh nhân nằm ngửa hoàn toàn.', 'Yêu cầu bệnh nhân tự ho mà không hỗ trợ.', 'Đặt tay lên ngực và ấn mạnh xuống khi bệnh nhân ho.'], correct: "D", topic: "1" },
{ id: 162, text: "Bệnh nhân chấn thương cột sống cổ có nguy cơ bị biến nhiệt theo nhiệt độ môi trường do nguyên nhân nào?", answers: ['Do mất khả năng vã mồ hôi bên dưới mức tổn thương.', 'Do tình trạng nhiễm trùng đường tiết niệu gây sốt.', 'Do bệnh nhân không được uống đủ nước.', 'Do tình trạng loét da làm thoát nhiệt'], correct: "A", topic: "1" },
{ id: 163, text: "Tư thế nằm tốt nhất để ngăn ngừa loét do đè ép cho bệnh nhân chấn thương cột sống là:", answers: ['Nằm ngửa liên tục trên đệm cứng.', 'Nằm sấp.', 'Nằm nghiêng về bên liệt.', 'Ngồi trên ghế có đệm mềm.'], correct: "C", topic: "1" },
{ id: 164, text: "Bệnh nhân tổn thương tủy sống từ mức Thắt lưng 1 (L1) trở xuống thường bị mất cảm giác ở vùng nào?", answers: ['Toàn bộ vùng bụng và hai chi dưới.', 'Vùng tầng sinh môn và hai chi dưới.', 'Chỉ mất cảm giác ở hai bàn chân.', 'Mất cảm giác từ ngang rốn trở xuống.'], correct: "B", topic: "1" },
{ id: 165, text: "Mục đích của việc tập vận động thụ động các khớp cho bệnh nhân liệt tủy ngay từ tuần đầu là gì?", answers: ['Để phục hồi sức cơ cho bệnh nhân.', 'Để đề phòng co rút cơ và cứng khớp.', 'Để giúp bệnh nhân có thể đi lại được ngay.', 'Để kích thích sự phát triển của xương.'], correct: "B", topic: "1" },
{ id: 166, text: "Khi lập kế hoạch giáo dục hướng nghiệp, nghề nào phù hợp với bệnh nhân liệt hai chân nhưng tay và trí tuệ bình thường?", answers: ['Công nhân xây dựng.', 'Nhân viên văn phòng, kế toán.', 'Cảnh sát giao thông đường bộ.', 'Vận động viên điền kinh chuyên nghiệp.'], correct: "B", topic: "1" },
{ id: 167, text: "Tình trạng hạ huyết áp tư thế đứng ở bệnh nhân chấn thương tủy có thể được phòng ngừa bằng cách nào?", answers: ['Cho bệnh nhân ngồi dậy thật nhanh.', 'Cho bệnh nhân cử động từ từ và thay đổi tư thế dần dần.', 'Cho bệnh nhân uống thuốc tăng huyết áp liên tục.', 'Băng kín hai chân bệnh nhân thật chặt.'], correct: "B", topic: "1" },
{ id: 168, text: "Tại sao điều dưỡng cần nghe âm ruột tối thiểu 4 giờ/lần cho bệnh nhân chấn thương tủy?", answers: ['Để phát hiện sớm tình trạng xuất huyết tiêu hóa.', 'Để xác định thời điểm bệnh nhân có thể bắt đầu ăn qua đường miệng.', 'Để kiểm tra xem ống thông dạ dày có đúng vị trí không.', 'Để đánh giá hiệu quả của thuốc giảm đau.'], correct: "B", topic: "1" },
{ id: 169, text: "Hành động nào là quan trọng nhất để giúp bệnh nhân liệt tứ chi vượt qua mặc cảm và tự ti?", answers: ['Nói dối rằng bệnh nhân sẽ sớm đi lại được như bình thường.', 'Cách ly bệnh nhân để họ không phải nhìn thấy người bình thường.', 'Khuyến khích bệnh nhân tự làm các công việc chăm sóc cá nhân càng nhiều càng tốt.', 'Làm thay tất cả mọi việc để bệnh nhân không phải vận động.'], correct: "C", topic: "1" },
{ id: 170, text: "Bệnh nhân chấn thương cột sống cổ có huyết áp trung bình là 70 mmHg. Hành động ưu tiên của điều dưỡng là:", answers: ['Chờ đợi và theo dõi tiếp trong 2 giờ sau.', 'Báo bác sĩ để thực hiện y lệnh thuốc vận mạch.', 'Cho bệnh nhân uống trà gừng để tăng huyết áp.', 'Chỉ thực hiện vỗ rung ngực để bệnh nhân tỉnh táo hơn.'], correct: "B", topic: "1" },
{ id: 171, text: "Một bệnh nhân liệt tủy có nồng độ Creatinine máu tăng cao rõ rệt. Điều dưỡng nên nghĩ đến nguy cơ gì?", answers: ['Bệnh nhân bị thiếu hụt protein trầm trọng.', 'Chức năng thận bị ảnh hưởng do nhiễm trùng hoặc ứ đọng nước tiểu lâu ngày.', 'Bệnh nhân đang hồi phục cơ bắp rất tốt.', 'Đây là dấu hiệu của việc liệt ruột đã kết thúc.'], correct: "B", topic: "1" },
{ id: 172, text: "Trong giáo dục sức khỏe, tại sao điều dưỡng cần nhắc gia đình không nên nói dối về khả năng hồi phục của bệnh nhân?", answers: ['Vì nói dối sẽ làm gia tăng chi phí điều trị.', 'Để bệnh nhân có thể từng bước chấp nhận thực tế và tập thích nghi với khuyết tật.', 'Vì nói dối là vi phạm đạo đức ngành y của người nhà.', 'Để bệnh nhân tự tìm cách chữa trị ở những nơi khác.'], correct: "B", topic: "1" },
{ id: 173, text: "Phát hiện vết đỏ trên vùng da xương cùng của bệnh nhân liệt tủy, hành động nào sau đây là ĐÚNG?", answers: ['Tiếp tục cho nằm ngửa và xoa bóp mạnh vào vết đỏ.', 'Thay đổi tư thế ngay lập tức và giữ cho vùng da đó không bị tỳ đè thêm.', 'Bôi thật nhiều mỡ kháng sinh lên vết đỏ và băng kín.', 'Chườm đá lạnh để làm giảm vết đỏ.'], correct: "B", topic: "1" },
{ id: 174, text: "Mở khí quản cấp cứu được chỉ định trong trường hợp nào sau đây, NGOẠI TRỪ:", answers: ['Tắc nghẽn đường hô hấp trên do dị vật', 'Chấn thương gây dập nát, phù nề ở cổ và thanh quản', 'Khó thở do viêm phổi', 'Bỏng đường thở'], correct: "C", topic: "1" },
{ id: 175, text: "Những biến chứng muộn ngay sau khi mở khí quản thường gặp, NGOẠI TRỪ:", answers: ['Hẹp khí quản', 'Tắc nghẽn ống do cục máu đông', 'Nhiễm trùng da xung quanh ống', 'Dò khí quản – thực quản.'], correct: "B", topic: "1" },
{ id: 176, text: "Áp lực trong bóng chèn mở khí quản không vượt quá:", answers: ['10 cmH2O.', '20 cmH2O.', '30 cmH2O.', '40 cmH2O.'], correct: "C", topic: "1" },
{ id: 177, text: "Xử trí khi có tai biến sút ống mở khí quản, điều dưỡng nên làm:", answers: ['Theo dõi sát tình trạng hô hấp người bệnh', 'Rửa sach vết thương, đặt lại canule mở khí quản', 'Dùng kìm banh rộng vết thương nơi mở khí quản, cho thở oxy và kêu người đến trợ giúp', 'Báo Bác sĩ tình trạng của người bệnh'], correct: "C", topic: "1" },
{ id: 178, text: "Vị trí thường mở khí quản là ở vòng sụn khí quản số:", answers: ['1, 2', '2, 3, 4', '5, 6, 7', '7, 8'], correct: "B", topic: "1" },
{ id: 179, text: "Canule mở khí quản hiện nay thường được sử dụng là:", answers: ['Ống kim loại không bóng chèn', 'Ống nhựa có tráng silicon và bóng chèn', 'Ống thông tiểu Foley', 'Ống Nelaton mềm'], correct: "B", topic: "1" },
{ id: 180, text: "Khi cố định dây mở khí quản cần tránh:", answers: ['Cột quá lỏng', 'Cột ở gáy người bệnh', 'Cột trên đường đi động mạch cảnh', 'Cột bằng dây sạch'], correct: "B", topic: "1" },
{ id: 181, text: "Câu 3. Một chỉ định mở khí quản trong tắc nghẽn hô hấp là:", answers: ['Viêm dạ dày', 'Thở máy dài ngày >7–10 ngày', 'Tăng huyết áp', 'Suy thận'], correct: "B", topic: "1" },
{ id: 182, text: "Một lợi ích quan trọng của mở khí quản là:", answers: ['Tăng áp lực nội sọ', 'Tăng nhịp tim', 'Tăng đau ngực', 'Giảm khoảng chết hô hấp'], correct: "D", topic: "1" },
{ id: 183, text: "Trong thực hành hiện nay, loại canule thường dùng là:", answers: ['Nhựa có tráng silicon có bóng chèn', 'Thủy tinh', 'Kim loại cứng', 'Cao su'], correct: "A", topic: "1" },
{ id: 184, text: "Biến chứng sớm sau mở khí quản là:", answers: ['Hẹp khí quản', 'Xơ phổi', 'Viêm phổi mạn', 'Chảy máu chân mở khí quản'], correct: "D", topic: "1" },
{ id: 185, text: "Điều dưỡng phát hiện vùng da quanh cổ người bệnh sưng to, khi ấn vào có tiếng nổ lép bép. Đây là dấu hiệu của biến chứng nào?", answers: ['Nhiễm trùng vết mổ.', 'Tràn khí dưới da.', 'Phù nề do dị ứng dây cố định.', 'Tụ máu chân mở khí quản.'], correct: "B", topic: "1" },
{ id: 186, text: "Tại sao trong quy trình thay dây cố định, phải buộc dây mới xong mới được cắt dây cũ?", answers: ['Để đảm bảo canun luôn được giữ cố định, tránh sút ống khi NB ho.', 'Để tiết kiệm thời gian làm việc.', 'Để tránh việc canun bị xoay làm tổn thương niêm mạc.', 'Để người bệnh cảm thấy an tâm hơn.'], correct: "A", topic: "1" },
{ id: 187, text: "Thứ tự rửa canun và vùng da xung quanh nào sau đây là đúng nguyên tắc vô khuẩn?", answers: ['Rửa da vùng xa -> rửa da vùng gần -> rửa mặt ngoài canun.', 'Rửa miệng ống canun -> rửa mặt ngoài canun -> rửa vùng da xung quanh.', 'Rửa vùng da dưới canun trước vì đây là nơi bẩn nhất.', 'Rửa dây cố định trước khi rửa da.'], correct: "B", topic: "1" },
{ id: 188, text: "Khi thay dây cố định, kiểm tra độ chặt của dây như thế nào là đạt yêu cầu?", answers: ['Dây phải thật chặt không thể luồn gì vào.', 'Luồn được hai ngón tay thoải mái.', 'Luồn vừa khít một ngón tay (ngón số 2) dưới dây.', 'Dây lỏng để canun có thể xoay tròn.'], correct: "C", topic: "1" },
{ id: 189, text: "Tại sao phải cung cấp oxy ẩm và ấm cho người bệnh mở khí quản?", answers: ['Để người bệnh dễ chịu.', 'Tránh khô niêm mạc, xẹp phổi và đờm đặc đóng bánh.', 'Để diệt khuẩn trong bình oxy.', 'Để giữ áp lực bóng chèn ổn định.'], correct: "B", topic: "1" },
{ id: 190, text: "Khi NB ăn qua ống thông dạ dày, tại sao cần xả bóng chèn (cuff) sau khi ăn 15-30 phút?", answers: ['Để NB tập nói.', 'Giảm áp lực liên tục lên thành khí quản, phòng hoại tử.', 'Giúp tiêu hóa thức ăn nhanh hơn.', 'Để tránh NB bị nôn.'], correct: "B", topic: "1" },
{ id: 191, text: "Một vết thương bụng được gọi là "vết thương thấu bụng" khi:", answers: ['Vết thương làm rách da bụng sâu.', 'Vết thương gây chảy máu nhiều ở thành bụng.', 'Vết thương xuyên thủng phúc mạc vào ổ bụng.', 'Vết thương làm bầm tím các cơ thành bụng.'], correct: "C", topic: "1" },
