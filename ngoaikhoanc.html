{ id: 192, text: "Phương pháp cận lâm sàng nào có giá trị cao nhất, nhanh chóng và an toàn để chẩn đoán dịch và tổn thương tạng đặc tại phòng cấp cứu?", answers: ['Siêu âm ổ bụng.', 'X-quang bụng đứng không chuẩn bị.', 'Chọc dò túi cùng Douglas.', 'CT Scanner.'], correct: "D", topic: "1" },
{ id: 193, text: "Xử trí điều dưỡng đối với vết thương thấu bụng có lòi ruột ra ngoài miệng vết thương:", answers: ['Nhanh chóng đẩy ruột vào và băng kín.', 'Rửa sạch ruột bằng cồn 70 độ.', 'Dùng gạc vô khuẩn thấm nước muối sinh lý ấm đắp lên ruột và dùng bát úp bảo vệ.', 'Để hở hoàn toàn cho thông thoáng.'], correct: "C", topic: "1" },
{ id: 194, text: "Những hành động nào sau đây thuộc kế hoạch chống sốc cho bệnh nhân, NGOẠI TRỪ:", answers: ['Ủ ấm và cho bệnh nhân nằm nơi yên tĩnh.', 'Thực hiện y lệnh truyền dịch, truyền máu.', 'Cho bệnh nhân uống nước đường ấm để tăng năng lượng.', 'Tiêm thuốc trợ tim, trợ lực theo y lệnh.'], correct: "C", topic: "1" },
{ id: 195, text: "Sau mổ chấn thương bụng, việc chăm sóc ống dẫn lưu ổ bụng cần lưu ý điều gì?", answers: ['Rút ống ngay sau 12 giờ đầu.', 'Theo dõi màu sắc, tính chất và số lượng dịch hàng ngày.', 'Luôn kẹp ống dẫn lưu để tránh mất dịch', 'Không cần thay băng chân ống dẫn lưu'], correct: "B", topic: "1" },
{ id: 196, text: "Mục đích chính của việc đặt sonde dạ dày và hút dịch sau mổ là:", answers: ['Để bơm thức ăn nhanh hơn.', 'Giảm áp lực trong lòng ống tiêu hóa, giúp các đường khâu nối mau lành.', 'Để lấy mẫu dịch dạ dày đi cấy khuẩn hằng ngày.', 'Để bệnh nhân không bị nấc.'], correct: "B", topic: "1" },
{ id: 197, text: "Khi nhận định bệnh nhân sau mổ, dấu hiệu nào cho thấy hệ tiêu hóa bắt đầu hồi phục?", answers: ['Bệnh nhân cảm thấy khát nước.', 'Vết mổ khô, không chảy dịch.', 'Bệnh nhân có trung tiện (đánh hơi) được.', 'Hết sốt.'], correct: "C", topic: "1" },
{ id: 198, text: "Để phòng ngừa nhiễm trùng sau mổ cho bệnh nhân chấn thương bụng, điều dưỡng cần:", answers: ['Thực hiện y lệnh kháng sinh đúng và đủ.', 'Thay băng vết mổ đảm bảo vô khuẩn.', 'Hướng dẫn bệnh nhân vệ sinh răng miệng và vận động sớm.', 'Tất cả các hành động trên.'], correct: "D", topic: "1" },
{ id: 199, text: "Biến chứng viêm phúc mạc do hoại tử ruột chậm thường liên quan đến:", answers: ['Bệnh nhân ăn quá sớm sau mổ.', 'Tổn thương mạch máu mạc treo gây thiếu máu nuôi dưỡng một đoạn ruột.', 'Do dùng thuốc giảm đau quá liều.', 'Do rách cơ thành bụng.'], correct: "B", topic: "1" },
{ id: 200, text: "Dấu hiệu Kehr (đau lan lên vai trái) thường gợi ý tổn thương ở tạng nào sau đây?", answers: ['Gan.', 'Lách.', 'Dạ dày.', 'Tụy.'], correct: "B", topic: "1" },
{ id: 201, text: "Tại sao chấn thương bụng kín thường gây khó khăn cho việc chẩn đoán ban đầu?", answers: ['Do nạn nhân thường trong tình trạng sốc hoặc hôn mê.', 'Do các tổn thương kết hợp ở sọ não, cột sống, tứ chi che lấp triệu chứng.', 'Do triệu chứng tạng rỗng thường biểu hiện muộn sau 6-12 giờ.', 'Tất cả các ý trên'], correct: "D", topic: "1" },
{ id: 202, text: "Chọc dò ổ bụng thấy máu không đông (80% trường hợp) có ý nghĩa:", answers: ['Bệnh nhân có tiền sử máu khó đông.', 'Có chảy máu trong ổ bụng.', 'Bệnh nhân bị thiếu máu nặng.', 'Kỹ thuật chọc dò bị sai.'], correct: "B", topic: "1" },
{ id: 203, text: "Chẩn đoán điều dưỡng ưu tiên đối với bệnh nhân vỡ tạng đặc gây chảy máu trong là:", answers: ['Nguy cơ nhiễm trùng liên quan đến vết thương.', 'Thiếu hụt dinh dưỡng liên quan đến nôn ói.', 'Giảm khối lượng tuần hoàn liên quan đến mất máu cấp.', 'Lo âu liên quan đến tình trạng bệnh.'], correct: "C", topic: "1" },
{ id: 204, text: "Biến chứng "Chảy máu thì hai" trong tổn thương gan, lách thường do:", answers: ['Khối máu tụ dưới bao tạng bị vỡ sau vài ngày.', 'Bệnh nhân vận động quá mạnh sau mổ.', 'Do nhiễm trùng vết mổ.', 'Do thuốc kháng sinh gây loãng máu.'], correct: "A", topic: "1" },
{ id: 205, text: "Bệnh nhân nam bị đâm vào bụng bằng dao nhọn, dao hiện vẫn còn cắm ở thành bụng. Điều dưỡng xử trí tại chỗ như thế nào?", answers: ['Rút dao ra ngay và băng ép cầm máu.', 'Ấn dao sâu thêm để nút chặt vết thương.', 'Giữ nguyên dị vật, dùng gạc và băng cố định dị vật rồi chuyển đi mổ cấp cứu.', 'Đổ oxy già vào xung quanh dị vật.'], correct: "C", topic: "1" },
{ id: 206, text: "Một bệnh nhân sau mổ chấn thương bụng xuất hiện tình trạng nấc liên tục, đau hạ sườn phải, sốt cao. Điều dưỡng nghi ngờ biến chứng:", answers: ['Tắc ruột sau mổ.', 'Viêm dạ dày cấp.', 'Áp xe dưới cơ hoành.', 'Chảy máu vết mổ'], correct: "C", topic: "1" },
{ id: 207, text: "Tại sao trong chấn thương bụng kín, cần phải theo dõi tối thiểu từ 5 – 7 ngày?", answers: ['Để bệnh nhân đóng đủ viện phí.', 'Vì có những tổn thương diễn biến chậm như vỡ tạng thì hai hoặc thủng ruột do thiếu máu.', 'Vì quy định của bệnh viện.', 'Để chờ kết quả xét nghiệm máu.'], correct: "B", topic: "1" },
{ id: 208, text: "Các can thiệp điều dưỡng để giữ thân nhiệt ổn định cho người bệnh bỏng diện rộng bao gồm các nội dung sau, NGOẠI TRỪ:", answers: ['Kiểm soát nhiệt độ môi trường và giữ ấm người bệnh.', 'Giới hạn việc bộc lộ vết bỏng khi thay băng.', 'Duy trì đủ calo trong ngày để tạo năng lượng giữ ấm.', 'Tắm nước mát hàng ngày để giữ vệ sinh cơ thể sạch sẽ'], correct: "D", topic: "1" },
{ id: 209, text: "Áp lực bơm hơi ổ bụng thường đạt khoảng:", answers: ['2 – 4 mmHg', '5 – 7 mmHg', '12 – 14 mmHg', '25 – 30 mmHg'], correct: "C", topic: "1" },
{ id: 210, text: "Trocar đầu tiên trong mổ nội soi ổ bụng thường có kích thước:", answers: ['3 mm', '5 mm', '8 mm', '10 mm'], correct: "D", topic: "1" },
{ id: 211, text: "Phương pháp vô cảm thường dùng trong mổ nội soi ổ bụng là:", answers: ['Gây tê tại chỗ', 'Gây tê tủy sống', 'Gây mê nội khí quản', 'Tiền mê đơn thuần'], correct: "C", topic: "1" },
{ id: 212, text: "Một biến chứng hô hấp có thể gặp sau mổ nội soi ổ bụng là:", answers: ['Phù thanh quản do dị ứng', 'Tràn khí màng phổi', 'Lao phổi', 'Viêm thanh quản cấp'], correct: "B", topic: "1" },
{ id: 213, text: "Biến chứng tim mạch thường gặp nhất trong mổ nội soi là:", answers: ['Nhịp chậm', 'Block tim hoàn toàn', 'Ngừng tim', 'Rung thất'], correct: "A", topic: "1" },
{ id: 214, text: "Một nguyên nhân gây thiểu niệu khi bơm hơi ổ bụng là:", answers: ['Giảm ADH', 'Tăng lưu lượng máu thận', 'Tăng lọc cầu thận', 'Chèn ép nhu mô thận'], correct: "D", topic: "1" },
{ id: 215, text: "Trong mổ nội soi, tăng PaCO₂ có thể gây:", answers: ['Co mạch cầu thận', 'Tăng lượng nước tiểu', 'Tăng pH máu', 'Giảm nhịp tim sinh lý'], correct: "A", topic: "1" },
{ id: 216, text: "Áp xe tồn lưu sau mổ có thể do:", answers: ['Lau hút dịch không sạch', 'Ăn uống sớm', 'Đi lại sớm', 'Thở oxy kéo dài'], correct: "A", topic: "1" },
{ id: 217, text: "Biện pháp giúp hạn chế tắc mạch khí khi bơm CO₂ là:", answers: ['Bơm nhanh', 'Kiểm tra kim Veress', 'Bơm 1 lít/phút', 'Tăng áp lực tối .'], correct: "B", topic: "1" },
{ id: 218, text: "Người bệnh sau nội soi đau bụng tăng, sốt, bí trung đại tiện trở lại cần nghĩ:", answers: ['Liệt ruột sinh lý', 'Viêm phúc mạc sau mổ', 'Viêm ruột cấp', 'Hội chứng ruột kích thích'], correct: "B", topic: "1" },
{ id: 219, text: "Theo dõi nước tiểu sau mổ nội soi giúp đánh giá:", answers: ['Chức năng thận', 'Chức năng thận và tuần hoàn', 'Lưu lượng dịch bù', 'Chức năng tuyến thượng thận'], correct: "B", topic: "1" },
{ id: 220, text: "Trong nội soi ổ bụng, tư thế đầu thấp có thể:", answers: ['Giảm máu về tim', 'Tăng máu trở về tim', 'Giảm áp lực tĩnh mạch trung tâm', 'Giảm áp lực nội sọ'], correct: "B", topic: "1" },
{ id: 221, text: "Người bệnh có COPD trước mổ nội soi cần chú ý nhất biến chứng:", answers: ['Tăng huyết áp', 'Toan hô hấp', 'Táo bón', 'Hạ đường huyết'], correct: "B", topic: "1" },
{ id: 222, text: "Dấu hiệu ECG có thể gặp khi tắc mạch khí là:", answers: ['ST chênh xuống đơn thuần', 'Giãn rộng phức hợp QRS', 'Sóng P mất hoàn toàn', 'Block AV độ I'], correct: "B", topic: "1" },
{ id: 223, text: "Khi áp lực ổ bụng quá cao, hậu quả huyết động quan trọng là:", answers: ['Tăng cung lượng tim', 'Giảm sức cản mạch máu', 'Giảm hồi lưu tĩnh mạch', 'Tăng tưới máu thận'], correct: "C", topic: "1" },
{ id: 224, text: "Người bệnh đang nội soi ổ bụng đột ngột tụt huyết áp, tím tái, end-tidal CO₂ giảm nhanh. Biến chứng nghĩ nhiều nhất là:", answers: ['Nhồi máu cơ tim', 'Tắc mạch khí', 'Xuất huyết tiêu hóa', 'Co thắt phế quản đơn thuần'], correct: "B", topic: "1" },
{ id: 225, text: "Khi áp lực ổ bụng tăng trên 20 mmHg kéo dài, hậu quả nào nguy hiểm nhất?", answers: ['Tăng nhu động ruột', 'Giảm chức năng thất trái', 'Tăng lọc cầu thận', 'Tăng lưu lượng tim'], correct: "B", topic: "1" },
{ id: 226, text: "Người bệnh sau mổ nội soi xuất hiện thiểu niệu, creatinin tăng. Cơ chế phù hợp nhất là:", answers: ['Tăng lưu lượng máu thận', 'Giảm ADH', 'Chèn ép nhu mô thận do tăng áp lực ổ bụng', 'Tăng lọc cầu thận'], correct: "C", topic: "1" },
{ id: 227, text: "Người bệnh nam, 35 tuổi, nhập viện sau tai nạn lao động do vật nặng va đập vào ngực phải. Ghi nhận lúc vào viện: người bệnh tỉnh, kích thích, thở nhanh nông 32 lần/phút, mạch 112 lần/phút, huyết áp 95/60 mmHg. Quan sát thấy có một vùng thành ngực kích thước khoảng 10x12 cm bên phải lõm vào khi hít vào và phồng ra khi thở ra. Hành động sơ cứu khẩn cấp tại chỗ của điều dưỡng là gì?", answers: ['Tiến hành chọc hút khí màng phổi cấp cứu bằng kim lớn.', 'Đặt một đệm gạc dày lên vùng thành ngực di động và băng ép cố định bằng băng dính.', 'Chuẩn bị dụng cụ và phụ giúp bác sĩ đặt ống dẫn lưu màng phổi ngay.', 'Cho người bệnh thở oxy liều cao qua mặt nạ có túi dự trữ 10 lít/phút.'], correct: "B", topic: "1" },
{ id: 228, text: "Một người bệnh bị vết thương ngực hở do dao đâm, nghe có tiếng phì phò của không khí đi qua vết thương theo nhịp thở. Lúc này, áp lực trong khoang màng phổi của bên tổn thương có xu hướng biến đổi sinh lý bệnh như thế nào?", answers: ['Trở nên âm hơn rất nhiều so với áp lực khí quyển bên ngoài.', 'Bằng với áp lực của khí quyển bên ngoài (mất hoàn toàn áp lực âm sinh lý).', 'Duy trì ở mức ổn định như trạng thái bình thường của cơ thể.', 'Luôn duy trì ở mức áp lực dương cao liên tục trong cả hai thì hô hấp.'], correct: "B", topic: "1" },
{ id: 229, text: "Tại sao trong chăm sóc người bệnh gãy xương sườn lớn hoặc mảng sườn di động, điều dưỡng tuyệt đối không được sử dụng kỹ thuật băng nẹp cố định vòng tròn quanh toàn bộ lồng ngực?", answers: ['Vì kỹ thuật này rất khó thực hiện và dễ gây tuột băng khi người bệnh xoay trở.', 'Vì gây đau chói nhiều tại vị trí các đầu xương sườn bị gãy tổn thương.', 'Vì làm hạn chế tối đa biên độ hô hấp của cả hai bên phổi, gây xẹp phổi và suy hô hấp nặng hơn.', 'Vì cản trở trực tiếp đến việc thăm khám và nghe tim phổi hàng ngày của bác sĩ.'], correct: "C", topic: "1" },
{ id: 230, text: "Một người bệnh sau phẫu thuật lấy khối máu tụ nội sọ ngày thứ hai, hiện đang tỉnh táo hoàn toàn nhưng đột ngột xuất hiện mạch chậm dần từ 75 lần/phút xuống 52 lần/phút, huyết áp tăng từ 120/80 mmHg lên 165/90 mmHg, kèm theo thở chậm, sâu và không đều. Điều dưỡng cần nhận định người bệnh đang có nguy cơ bị biến chứng cấp tính nào?", answers: ['Tình trạng sốc nhiễm khuẩn giai đoạn đầu do nhiễm trùng vết mổ.', 'Hội chứng tăng áp lực nội sọ tiến triển cấp tính (Tam chứng Cushing).', 'Biến chứng nhồi máu cơ tim cấp tính do stress sau phẫu thuật lớn.', 'Tình trạng thiếu thể tích tuần hoàn do mất máu ẩn dòng sau mổ.'], correct: "B", topic: "1" },
{ id: 231, text: "Khi theo dõi một người bệnh chấn thương sọ não có đặt ống dẫn lưu não thất ra hệ thống bình chứa bên ngoài, nguyên tắc đặt vị trí của bình hứng dịch dẫn lưu so với mốc giải phẫu tai ngoài của người bệnh là:", answers: ['Luôn đặt bình chứa thấp hơn hẳn vị trí tai ngoài từ 30 đến 40 cm để dịch thoát ra nhanh.', 'Luôn đặt bình chứa cao hơn hẳn đỉnh đầu của người bệnh từ 20 đến 30 cm để ngăn dịch thoát.', 'Đặt bình hứng dịch ở mức chiều cao chính xác theo y lệnh bác sĩ (thường cao hơn mốc tai ngoài khoảng 10-15 cm).', 'Vị trí đặt bình chứa hoàn toàn tự do, không ảnh hưởng đến áp lực nội sọ.'], correct: "C", topic: "1" },
{ id: 232, text: "Tại sao tình trạng hạ huyết áp động mạch (Huyết áp tâm thu < 90 mmHg) lại được xem là một "kẻ thù lớn" gây tổn thương não thứ phát nghiêm trọng nhất ở bệnh nhân chấn thương sọ não nặng?", answers: ['Vì hạ huyết áp kích thích gây ra các cơn co giật và động kinh liên tục.', 'Vì hạ huyết áp làm gia tăng tốc độ hình thành các khối máu tụ ngoài màng cứng.', 'Vì làm sụt giảm nghiêm trọng áp lực tưới máu não (CPP), dẫn đến thiếu máu cục bộ và hoại tử tế bào não.', 'Vì hạ huyết áp làm tăng nguy cơ bục rách các mạch máu tại vết mổ sọ não.'], correct: "C", topic: "1" },
{ id: 233, text: "Một người bệnh chấn thương sọ não đang trong trạng thái lơ mơ, đột ngột xuất hiện dấu hiệu đồng tử mắt bên phải dãn to (kích thước khoảng 5mm) và mất hoàn toàn phản xạ với ánh sáng, trong khi đồng tử mắt bên trái bình thường (2mm). Dấu hiệu thần kinh khu trú này cảnh báo nguy cơ nguy hiểm nào?", answers: ['Người bệnh bị tổn thương chọn lọc dây thần kinh thị giác (dây II) bên trái.', 'Hiện tượng thoát vị não (thoát vị móc hải mã) chèn ép vào dây thần kinh vận nhãn (dây III) bên phải.', 'Xuất hiện tình trạng xuất huyết võng mạc diện rộng ở cả hai bên mắt.', 'Diễn tiến lành tính bình thường của chấn thương sọ não giai đoạn hồi phục.'], correct: "B", topic: "1" },
{ id: 234, text: "Tại sao việc duy trì nồng độ khí Carbon dioxide trong máu động mạch (PaCO2) ở mốc giới hạn thấp (khoảng 30–35 mmHg) bằng cách điều chỉnh thông khí thích hợp lại có vai trò quan trọng trong điều trị tăng áp lực nội sọ nặng?", answers: ['Khí CO2 ở mức thấp giúp tăng cường tưới máu đến các vùng não bị tổn thương.', 'Vì PaCO2 giảm nhẹ gây co mạch máu não sinh lý, từ đó làm giảm thể tích máu trong hộp sọ và giảm áp lực nội sọ.', 'Khí CO2 giảm giúp kích thích người bệnh nhanh chóng phục hồi tri giác.', 'Khí CO2 thấp làm tăng tính thấm của hàng rào máu não đối với thuốc điều trị.'], correct: "B", topic: "1" },
{ id: 235, text: "Khi chăm sóc bệnh nhân chấn thương cột sống cổ cao đang được cố định bằng hệ thống khung kéo Halo (Halo vest), hành động chăm sóc nào sau đây của điều dưỡng là SAI nguyên tắc an toàn?", answers: ['Thực hiện vệ sinh và sát khuẩn chân đinh cố định hàng ngày bằng dung dịch sát khuẩn phù hợp.', 'Kiểm tra độ chặt của các khóa vít trên khung cố định định kỳ và báo bác sĩ khi có lỏng.', 'Sử dụng các thanh giằng dọc của khung Halo làm điểm tựa lực để kéo, nâng hoặc xoay trở người bệnh.', 'Lót thêm đệm mềm ở các vị trí cạnh khung tiếp xúc với da để phòng ngừa loét tì đè.'], correct: "C", topic: "1" },
{ id: 236, text: "Bệnh nhân chấn thương tủy sống ngực cao (từ đoạn D6 trở lên) sau giai đoạn sốc tủy đột ngột xuất hiện: Huyết áp tăng vọt kịch phát (180/110 mmHg), nhịp tim chậm (48 lần/phút), đau đầu dữ dội, vã mồ hôi và đỏ bừng da vùng trên mức tổn thương tủy. Điều dưỡng cần nhận định ngay đây là tình trạng cấp cứu nguy kịch nào?", answers: ['Hội chứng Cushing do tăng áp lực nội sọ tiến triển cấp tính.', 'Hội chứng phản xạ tự trị bất thường (Autonomic Dysreflexia) do kích thích giao cảm quá mức bên dưới tổn thương.', 'Tình trạng nhiễm khuẩn huyết giai đoạn sốc nhiễm trùng nặng.', 'Biểu hiện của cơn đột quỵ nhồi máu cơ tim cấp tính diện rộng.'], correct: "B", topic: "1" },
{ id: 237, text: "Khi phát hiện bệnh nhân chấn thương tủy sống ngực có biểu hiện của Hội chứng phản xạ tự trị bất thường (Autonomic Dysreflexia), can thiệp điều dưỡng khẩn cấp đầu tiên cần thực hiện ngay lập tức là:", answers: ['Đặt bệnh nhân nằm ngửa bằng phẳng tuyệt đối và kê cao hai chân để tăng tuần hoàn về tim.', 'Cho bệnh nhân ngồi dậy cao (nếu cột sống ổn định) và kiểm tra xả rỗng bàng quang (thông tiểu) hoặc tháo phân kẹt.', 'Thực hiện truyền tĩnh mạch liều cao dung dịch ưu trương Mannitol 20% theo phác đồ.', 'Tiến hành chườm lạnh toàn thân để hạ huyết áp kịch phát cho bệnh nhân.'], correct: "B", topic: "1" },
{ id: 238, text: "Tại sao bệnh nhân liệt tủy cao nằm lâu ngày lại có nguy cơ rất cao hình thành cục máu đông gây tắc mạch huyết khối tĩnh mạch sâu (DVT) ở hai chi dưới?", answers: ['Do tình trạng tăng canxi máu từ xương giải phóng ra làm tăng đông máu.', 'Do bệnh nhân không được cung cấp đầy đủ các chất dinh dưỡng và nước uống.', 'Do mất phân bố thần kinh vận mạch gây ứ trệ tuần hoàn tĩnh mạch vùng thấp kết hợp bất động kéo dài.', 'Do tác dụng phụ đặc hiệu của các thuốc giảm đau kháng viêm sử dụng dài ngày.'], correct: "C", topic: "1" },
{ id: 239, text: "Để phòng ngừa hiệu quả biến chứng nhiễm trùng đường tiết niệu ngược dòng ở bệnh nhân liệt tủy phải đặt ống thông tiểu lưu tục dài ngày, can thiệp điều dưỡng nào sau đây là quan trọng nhất?", answers: ['Định kỳ bơm rửa bàng quang bằng dung dịch kháng sinh phổ rộng hàng ngày.', 'Cho bệnh nhân uống thuốc kháng sinh dự phòng liều thấp liên tục suốt quá trình đặt ống.', 'Duy trì hệ thống dẫn lưu nước tiểu kín, vô khuẩn và giữ túi chứa luôn thấp hơn mức bàng quang.', 'Thay ống thông tiểu mới định kỳ mỗi 2 ngày một lần để đảm bảo vô khuẩn.'], correct: "C", topic: "1" },
{ id: 240, text: "Trong giai đoạn hậu phẫu muộn sau mổ mở khí quản, nếu điều dưỡng thực hiện kỹ thuật hút đờm bằng ống hút thô bạo, áp lực hút quá cao và thời gian hút quá lâu (>15 giây) liên tục thì có nguy cơ trực tiếp gây ra tổn thương nguy hiểm nào cho đường thở?", answers: ['Làm rách bục hoàn toàn đường khâu cố định ống canule mở khí quản.', 'Gây thiếu oxy cấp, kích thích phế vị làm ngừng tim và hoại tử, loét sẹo hẹp niêm mạc khí quản.', 'Làm tăng sinh quá mức các tổ chức tuyến tiết nhầy ở tiểu phế quản.', 'Khiến ống canule bị đẩy sâu vào bên trong lòng phế quản gốc bên phải.'], correct: "B", topic: "1" },
{ id: 241, text: "Khi hút đờm qua ống mở khí quản cho người bệnh đang thở máy, điều dưỡng cần tuân thủ nguyên tắc luồn ống hút vào đường thở như thế nào để tránh làm tổn thương niêm mạc khí quản?", answers: ['Vừa mở áp lực hút tối đa vừa đẩy nhanh ống hút vào sâu trong lòng khí quản.', 'Khóa áp lực hút (không hút), nhẹ nhàng luồn ống vào đến khi gặp lực cản nhẹ thì rút ra 1-2 cm rồi mới mở hút.', 'Luồn ống hút vào thật sâu, xoay tròn mạnh ống hút liên tục trong suốt quá trình đẩy vào.', 'Chỉ luồn ống hút nằm hoàn toàn bên trong lòng của canule mở khí quản, không đi ra ngoài.'], correct: "B", topic: "1" },
{ id: 242, text: "Một người bệnh mở khí quản có bóng chèn (cuff) đang được thở máy tại phòng hồi sức. Điều dưỡng nghe thấy tiếng khí xì phì phò vùng cổ người bệnh theo chu kỳ của máy thở, đồng thời máy báo động áp lực đỉnh đường thở sụt giảm (Low Pressure). Nguyên nhân lâm sàng cần nghĩ đến đầu tiên là:", answers: ['Ống canule mở khí quản đã bị bít tắc hoàn toàn do đờm đặc đóng bánh.', 'Áp lực trong bóng chèn (cuff) bị sụt giảm hoặc bóng chèn đã bị rách/vỡ gây thoát khí.', 'Người bệnh đang có cơn co thắt phế quản cấp tính rất nặng.', 'Hệ thống dây mạch của máy thở bị bẻ cong hoặc bị tắc nghẽn nước lắng đọng.'], correct: "B", topic: "1" },
{ id: 243, text: "Khi tiến hành rút ống canule mở khí quản (cai quản mở khí quản) cho người bệnh giai đoạn hồi phục, quy trình thực hiện thử nghiệm tập thở qua đường tự nhiên thường được tiến hành theo các bước tiến trình nào?", answers: ['Rút ống canule ra ngay lập tức và khâu kín lỗ mở khí quản bằng chỉ không tan.', 'Thay ống bằng loại nhỏ hơn, tiến hành kẹp ống một phần rồi kẹp hoàn toàn trong 24-48 giờ dưới sự theo dõi sát.', 'Cho người bệnh uống thuốc ức chế hô hấp để giảm nhu cầu oxy trước khi rút ống.', 'Chỉ cần xả hết hơi trong bóng chèn (cuff) và yêu cầu người bệnh tự hít thở qua mũi.'], correct: "B", topic: "1" },
{ id: 244, text: "Tại sao trong chấn thương bụng kín, tổn thương vỡ tạng đặc (gan, lách) mức độ nặng lại thường dẫn đến tình trạng sốc giảm thể tích diễn tiến nhanh chóng và nguy kịch hơn tổn thương vỡ tạng rỗng?", answers: ['Vì tạng đặc chứa nhiều vi khuẩn gây ra tình trạng nhiễm trùng nhiễm độc toàn thân sớm.', 'Vì tạng đặc có cấu trúc mạch máu phong phú, lượng máu nuôi tuần hoàn lớn và không có khả năng tự co mạch cầm máu.', 'Vì khi vỡ tạng đặc sẽ giải phóng ra các enzyme tiêu hóa làm phá hủy mạch máu xung quanh.', 'Vì vỡ tạng đặc luôn đi kèm với tổn thương rách các mạch máu lớn như động mạch chủ bụng.'], correct: "B", topic: "1" },
{ id: 245, text: "Người bệnh bị chấn thương bụng kín đang được theo dõi nội khoa tại phòng bệnh. Triệu chứng lâm sàng và cận lâm sàng nào sau đây khẳng định tình trạng chảy máu trong ổ bụng vẫn tiếp diễn hoạt động và cần chỉ định mổ cấp cứu khẩn cấp?", answers: ['Người bệnh tỉnh táo, than phiền đau bụng âm ỉ, mạch 80 lần/phút ổn định.', 'Mạch tăng dần, huyết áp tụt kẹt, chỉ số Hemoglobin (Hb) sụt giảm liên tục sau các lần truyền máu.', 'Nhu động ruột nghe thấy giảm nhẹ, bụng chướng nhẹ và người bệnh chưa trung tiện được.', 'Kết quả siêu âm bụng thấy có một lượng dịch tự do rất ít ở túi cùng Douglas.'], correct: "B", topic: "1" },
{ id: 246, text: "Sau phẫu thuật chấn thương bụng vỡ ruột non gây viêm phúc mạc, ngày thứ 4 hậu phẫu người bệnh xuất hiện: bụng chướng căng đều, đau tức hông âm ỉ, không có phản ứng thành bụng, nghe không thấy âm ruột (nhu động ruột mất hoàn toàn), bí trung đại tiện hoàn toàn. Biến chứng điều dưỡng cần nhận định ở đây là:", answers: ['Tắc ruột cơ học do các dây chằng sẹo dính sau mổ chèn ép lòng ruột.', 'Tình trạng liệt ruột cơ năng hậu phẫu do viêm phúc mạc và rối loạn điện giải (hạ Kali máu).', 'Biến chứng bục rách miệng nối ruột gây rò rỉ dịch tiêu hóa vào ổ bụng.', 'Xuất huyết tiêu hóa thứ phát do loét dạ dày cấp tính do stress.'], correct: "B", topic: "1" },
{ id: 247, text: "Khi thực hiện y lệnh truyền máu khẩn cấp cho người bệnh sốc mất máu nặng do vỡ gan trong chấn thương bụng, tai biến truyền máu cấp tính nguy hiểm đe dọa tính mạng người bệnh cần được điều dưỡng giám sát chặt chẽ nhất trong 15 phút đầu là:", answers: ['Tình trạng lây nhiễm các bệnh đường truyền máu như viêm gan B, HIV.', 'Phản ứng tán huyết cấp do bất đồng nhóm máu hệ ABO (gây sốc, suy thận cấp, tử vong).', 'Tình trạng quá tải thể tích tuần hoàn gây phù phổi cấp muộn.', 'Phản ứng dị ứng nổi mề đay và ngứa da thông thường.'], correct: "B", topic: "1" },
{ id: 248, text: "Một người bệnh bỏng lửa xăng diện rộng 40% diện tích cơ thể, nặng 60kg, nhập viện giờ thứ hai. Áp dụng công thức Parkland để tính toán tổng lượng dịch truyền (Lactated Ringer) cần thiết cho người bệnh này trong 24 giờ đầu tiên là:", answers: ['4.800 ml.', '7.200 ml.', '9.600 ml (gồm 4.800 ml truyền trong 8 giờ đầu và 4.800 ml truyền trong 16 giờ tiếp theo).', '12.000 ml.'], correct: "C", topic: "1" },
{ id: 249, text: "Người bệnh sau phẫu thuật nội soi ruột thừa ngày thứ 3 xuất hiện triệu chứng: đau chói tăng dần tại vị trí lỗ chọc trocar vùng dưới rốn, da xung quanh chân sưng nề, đỏ, có dịch mủ đặc chảy ra qua kẽ chỉ khâu. Điều dưỡng cần nhận định người bệnh đang mắc phải biến chứng hậu phẫu nào?", answers: ['Biến chứng thoát vị nghẹt thành bụng qua vị trí chọc lỗ trocar.', 'Tình trạng nhiễm trùng vết mổ sâu hoặc nhiễm trùng chân trocar.', 'Biến chứng xuất huyết nội thứ phát do tuột nơ buộc mạch máu.', 'Biến chứng tắc ruột cơ học do dây chằng xơ dính sau phẫu thuật.'], correct: "B", topic: "1" },
{ id: 250, text: "Trong phẫu thuật nội soi ổ bụng, sự phối hợp giữa yếu tố nào sau đây sẽ làm sụt giảm nghiêm trọng nhất dung tích cặn chức năng (FRC) của phổi, gây khó khăn cho công tác thông khí của điều dưỡng gây mê?", answers: ['Đặt người bệnh ở tư thế đầu cao (Anti-Trendelenburg) kết hợp duy trì áp lực ổ bụng thấp.', 'Đặt người bệnh ở tư thế đầu thấp (Trendelenburg) kết hợp với quá trình bơm hơi khí áp lực cao vào ổ bụng.', 'Hướng dẫn người bệnh chủ động ngồi dậy sớm ngay tại giường bệnh phòng hậu phẫu.', 'Đặt người bệnh nằm nghiêng hoàn toàn sang phía bên phải trong suốt cuộc mổ hở.'], correct: "B", topic: "1" },
{ id: 251, text: "Theo dõi số lượng nước tiểu của người bệnh sau phẫu thuật nội soi ổ bụng nhằm mục đích đánh giá tốt nhất tình trạng gì?", answers: ['Tình trạng nhiễm trùng hệ tiết niệu sau mổ.', 'Tình trạng tưới máu thận và ảnh hưởng của áp lực ổ bụng lên chức năng thận.', 'Tốc độ đào thải thuốc mê qua đường thận.', 'Khả năng co bóp của cơ bàng quang sau gây mê.'], correct: "B", topic: "1" },
{ id: 252, text: "Người bệnh CTSN sau mổ có ống dẫn lưu. Khi thay băng chân dẫn lưu, điều dưỡng cần đặc biệt chú ý:", answers: ['Rút ống dẫn lưu ngay 12 giờ sau mổ', 'Bơm rửa ống dẫn lưu hàng giờ bằng nước cất', 'Theo dõi số lượng, tính chất dịch và đảm bảo vô khuẩn tuyệt đối', 'Cố định ống thật chặt vào da đầu bằng băng dính kín tránh tuột'], correct: "C", topic: "1" },

     let currentTopic = null;
    let shuffleQuestions = true;
    let shuffleAnswers = true;
    let currentQuestions = [];
    let userSelections = {};
    let answersMapping = new Map();
    
    const questionsContainer = document.getElementById("questionsContainer");
    const scoreContainer = document.getElementById("scoreContainer");
    const shuffleQuestionsToggle = document.getElementById("shuffleQuestionsToggle");
    const shuffleAnswersToggle = document.getElementById("shuffleAnswersToggle");
    const liveScoreSpan = document.getElementById("liveScore");
    
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
    
    function getFilteredQuestions() {
        if (!currentTopic) return [];
        let filtered = QUESTION_SET.filter(q => currentTopic === "all" || q.topic === currentTopic);
        let result = [...filtered];
        if (shuffleQuestions) result = shuffleArray(result);
        return result;
    }
    
    function buildAnswerMapping(question) {
        const originalAnswers = question.answers;
        const correctIndex = question.correct.charCodeAt(0) - 65;
        const correctText = originalAnswers[correctIndex];
        
        if (!shuffleAnswers) {
            return {
                displayList: [
                    { letter: "A", text: originalAnswers[0] },
                    { letter: "B", text: originalAnswers[1] },
                    { letter: "C", text: originalAnswers[2] },
                    { letter: "D", text: originalAnswers[3] }
                ],
                correctLetterDisplay: question.correct
            };
        } else {
            let items = originalAnswers.map((text, idx) => ({ text }));
            items = shuffleArray([...items]);
            const displayList = items.map((item, newIdx) => ({ letter: String.fromCharCode(65+newIdx), text: item.text }));
            const found = displayList.find(item => item.text === correctText);
            return {
                displayList,
                correctLetterDisplay: found ? found.letter : "A"
            };
        }
    }
    
    function updateAllUI() {
        if (!currentQuestions.length) {
            liveScoreSpan.innerText = `0 / 0`;
            return;
        }
        let correctCount = 0;
        
        for (let q of currentQuestions) {
            const mapping = answersMapping.get(q.id);
            if (!mapping) continue;
            const selectedLetter = userSelections[q.id];
            const isCorrect = (selectedLetter && selectedLetter === mapping.correctLetterDisplay);
            if (isCorrect) correctCount++;
            
            const cardDiv = document.querySelector(`.question-card[data-qid='${q.id}']`);
            if (!cardDiv) continue;
            
            const iconSpan = cardDiv.querySelector('.status-icon');
            if (iconSpan) {
                if (!selectedLetter) {
                    iconSpan.innerHTML = "⚪ Chưa làm";
                    iconSpan.className = "status-icon status-none";
                } else if (isCorrect) {
                    iconSpan.innerHTML = "✓ Đúng";
                    iconSpan.className = "status-icon status-correct";
                } else {
                    iconSpan.innerHTML = "✗ Sai";
                    iconSpan.className = "status-icon status-wrong";
                }
            }
            
            const answerDivs = cardDiv.querySelectorAll('.answer-option');
            for (let ansDiv of answerDivs) {
                const letter = ansDiv.dataset.letter;
                const isSelected = (selectedLetter === letter);
                
                ansDiv.classList.remove('correct-highlight', 'wrong-highlight');
                
                if (isSelected) {
                    if (isCorrect) {
                        ansDiv.classList.add('correct-highlight');
                    } else {
                        ansDiv.classList.add('wrong-highlight');
                    }
                }
                
                let statusSpan = ansDiv.querySelector('.answer-status');
                if (!statusSpan) {
                    statusSpan = document.createElement('span');
                    statusSpan.className = 'answer-status';
                    ansDiv.appendChild(statusSpan);
                }
                
                if (isSelected && isCorrect) {
                    statusSpan.innerHTML = '✓';
                    statusSpan.className = 'answer-status check-mark';
                } else if (isSelected && !isCorrect) {
                    statusSpan.innerHTML = '✗';
                    statusSpan.className = 'answer-status cross-mark';
                } else {
                    statusSpan.innerHTML = '';
                }
            }
        }
        liveScoreSpan.innerText = `${correctCount} / ${currentQuestions.length}`;
    }
    
    function onAnswerClick(questionId, selectedLetter) {
        userSelections[questionId] = selectedLetter;
        
        const questionCard = document.querySelector(`.question-card[data-qid='${questionId}']`);
        if (questionCard) {
            const allOptions = questionCard.querySelectorAll('.answer-option');
            allOptions.forEach(opt => {
                const letter = opt.dataset.letter;
                if (letter === selectedLetter) {
                    opt.classList.add('selected');
                } else {
                    opt.classList.remove('selected');
                }
            });
        }
        updateAllUI();
    }
    
    // Hàm cuộn xuống câu hỏi đầu tiên
    function scrollToFirstQuestion() {
        setTimeout(() => {
            const firstQuestion = document.querySelector('.question-card');
            if (firstQuestion) {
                firstQuestion.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }, 100);
    }
    
    function renderFullQuiz() {
        if (!currentTopic) {
            scoreContainer.style.display = "none";
            questionsContainer.innerHTML = `
                <div class="welcome-message">
                    👋 Chào bạn!<br>
                    Hãy chọn một chủ đề bên trên để bắt đầu làm bài trắc nghiệm.
                </div>
            `;
            return;
        }
        
        currentQuestions = getFilteredQuestions();
        answersMapping.clear();
        for (let q of currentQuestions) {
            answersMapping.set(q.id, buildAnswerMapping(q));
        }
        userSelections = {};
        
        if (currentQuestions.length === 0) {
            scoreContainer.style.display = "block";
            questionsContainer.innerHTML = `<div class="card" style="text-align:center">⚠️ Không có câu hỏi cho chủ đề này.</div>`;
            liveScoreSpan.innerText = `0 / 0`;
            return;
        }
        
        let html = '';
        currentQuestions.forEach((q, idx) => {
            const mapping = answersMapping.get(q.id);
            if (!mapping) return;
            const { displayList } = mapping;
            let answersHtml = '';
            for (let ans of displayList) {
                answersHtml += `
                    <div class="answer-option" data-qid="${q.id}" data-letter="${ans.letter}">
                        <span class="answer-letter">${ans.letter}</span>
                        <span class="answer-text">${escapeHtml(ans.text)}</span>
                        <span class="answer-status"></span>
                    </div>
                `;
            }
            html += `
                <div class="question-card" data-qid="${q.id}">
                    <div class="question-text">
                        <span><strong>${idx+1}.</strong> ${escapeHtml(q.text)}</span>
                        <span class="status-icon status-none">⚪ Chưa làm</span>
                    </div>
                    <div class="answers">
                        ${answersHtml}
                    </div>
                </div>
            `;
        });
        
        questionsContainer.innerHTML = html;
        scoreContainer.style.display = "flex";
        
        document.querySelectorAll('.answer-option').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const qid = parseInt(el.dataset.qid);
                const letter = el.dataset.letter;
                if (!isNaN(qid) && letter) {
                    onAnswerClick(qid, letter);
                }
            });
        });
        
        updateAllUI();
        
        // Tự động cuộn xuống câu hỏi đầu tiên
        scrollToFirstQuestion();
    }
    
function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>"']/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}
    
    function refreshQuiz() {
        renderFullQuiz();
    }
    
    function initEventListeners() {
        const topicBtns = document.querySelectorAll('.topic-btn');
        topicBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const topic = btn.dataset.topic;
                if (!topic) return;
                currentTopic = topic;
                topicBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                refreshQuiz();
            });
        });
        
        shuffleQuestionsToggle.addEventListener('change', (e) => {
            shuffleQuestions = e.target.checked;
            if (currentTopic) refreshQuiz();
        });
        
        shuffleAnswersToggle.addEventListener('change', (e) => {
            shuffleAnswers = e.target.checked;
            if (currentTopic) refreshQuiz();
        });
    }
    
    function init() {
        shuffleQuestions = shuffleQuestionsToggle.checked;
        shuffleAnswers = shuffleAnswersToggle.checked;
        initEventListeners();
        currentTopic = null;
        renderFullQuiz();
    }
    
    init();
</script>
