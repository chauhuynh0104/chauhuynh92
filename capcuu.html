<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Trắc nghiệm cấp cứu - Chauhuynh0104</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #f0f4f8;
            font-family: system-ui, 'Segoe UI', 'Roboto', 'Noto Sans', sans-serif;
            padding: 16px 12px 80px;
            color: #0f172a;
        }

        .app-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            padding: 20px 18px;
            margin-bottom: 20px;
        }

        .quiz-header {
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quiz-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1e3c72, #2b4c7c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .badge {
            background: #eef2ff;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #1e3c72;
        }

        .topic-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .topic-btn {
            background: #eef2ff;
            border: none;
            padding: 10px 20px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            color: #1e293b;
            flex: 1 0 auto;
            text-align: center;
        }

        .topic-btn.active {
            background: #1e3c72;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 60px;
            margin-bottom: 20px;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: 0.3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #2d6a4f;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .question-card {
            background: white;
            border-radius: 24px;
            margin-bottom: 20px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            scroll-margin-top: 20px;
        }

        .question-text {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 16px;
            line-height: 1.4;
            background: #fefce8;
            padding: 12px;
            border-radius: 20px;
            border-left: 5px solid #eab308;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .status-icon {
            font-size: 0.85rem;
            font-weight: bold;
            background: white;
            border-radius: 40px;
            padding: 4px 12px;
            min-width: 95px;
            text-align: center;
        }

        .status-correct {
            color: #15803d;
            background: #dcfce7;
            border: 1px solid #86efac;
        }

        .status-wrong {
            color: #b91c1c;
            background: #fee2e2;
            border: 1px solid #fca5a5;
        }

        .status-none {
            color: #64748b;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: #f9f9ff;
            border-radius: 60px;
            border: 2px solid #e2edff;
            cursor: pointer;
            transition: 0.15s;
        }

        .answer-option:hover {
            background: #eef2ff;
        }

        .answer-option.correct-highlight {
            border: 3px solid #15803d;
            background: #e8f5e9;
        }

        .answer-option.wrong-highlight {
            border: 3px solid #dc2626;
            background: #fee2e2;
        }

        .answer-option.selected {
            background: #e0f2fe;
            border-color: #0284c7;
        }

        .answer-letter {
            font-weight: 800;
            background: #e2e8f0;
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 60px;
            font-size: 0.9rem;
        }

        .answer-text {
            flex: 1;
            font-size: 0.92rem;
        }

        .answer-status {
            font-size: 1.2rem;
            font-weight: bold;
            min-width: 44px;
            text-align: center;
        }

        .check-mark {
            color: #15803d;
        }

        .cross-mark {
            color: #dc2626;
        }

        .score-bar {
            background: #e6f7ed;
            padding: 14px 18px;
            border-radius: 60px;
            text-align: center;
            font-weight: bold;
            margin: 8px 0 16px;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .progress-text {
            background: #1e3c72;
            color: white;
            border-radius: 30px;
            padding: 4px 16px;
        }

        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            background: #fef9e3;
            border-radius: 28px;
            color: #b45309;
            font-weight: 500;
        }

        footer {
            text-align: center;
            margin-top: 32px;
            padding: 20px 10px;
            font-size: 0.75rem;
            color: #475569;
            border-top: 1px solid #cbd5e1;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="card">
        <div class="quiz-header">
            <h2>📚 Trắc nghiệm Cấp Cứu</h2>
      
        </div>


        <div class="topic-buttons" id="topicButtons">
            <button data-topic="all" class="topic-btn">📖 Ôn cả môn (tất cả bài)</button>
            <button data-topic="bai1" class="topic-btn">📗 Bài 1: Đánh giá, phân loại và xử trí ban đầu người bệnh cấp cứu</button>
            <button data-topic="bai2" class="topic-btn">📗 Bài 2: Cấp cứu người bệnh chấn thương</button>
			 <button data-topic="bai3" class="topic-btn">📗 Bài 3: Cấp cứu người bệnh ngừng tuần hoàn và ngừng hô hấp</button>
			  <button data-topic="bai4" class="topic-btn">📗 Bài 4: Chăm sóc người bệnh suy hô hấp cấp</button>
			   <button data-topic="bai5" class="topic-btn">📗 Bài 5: Chăm sóc người bệnh phù phổi cấp</button>
			    <button data-topic="bai6" class="topic-btn">📗 Bài 6: Chăm sóc người bệnh sốc</button>
				 <button data-topic="bai7" class="topic-btn">📗 Bài 7: Chăm sóc người bệnh ngộ độc cấp</button>
				 	 <button data-topic="bai8" class="topic-btn">📗 Bài 8: Chăm sóc người bệnh hôn mê</button>
			 <button data-topic="bai9" class="topic-btn">📗 Bài 9: Chăm sóc người bệnh thở máy</button>
				  

        </div>

      <div class="toggle-row">
            <div class="toggle-item">
                <span>🔄 Xáo trộn câu hỏi</span>
                <label class="switch">
                    <input type="checkbox" id="shuffleQuestionsToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="toggle-item">
                <span>🎲 Xáo trộn đáp án</span>
                <label class="switch">
                    <input type="checkbox" id="shuffleAnswersToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <div id="scoreContainer" class="score-bar" style="display: none;">
        <span>🏆 Kết quả hiện tại</span>
        <span id="liveScore" class="progress-text">0 / 0</span>
    </div>

    <div id="questionsContainer">
        <div class="welcome-message">
            👋 Chào bạn!<br>
            Hãy chọn một chủ đề bên trên để bắt đầu làm bài trắc nghiệm.
        </div>
    </div>
    
    <footer>© 2014-2026 Dr.Châu</footer>
</div>

<script>

    const QUESTION_SET = [

{ id: 1, text: "Cấp cứu được hiểu là gì?", answers: ['Điều trị bệnh mạn tính', 'Tình trạng cần đánh giá và điều trị ngay', 'Điều trị dự phòng', 'Điều trị phục hồi'], correct: "B", topic: "bai1" },
{ id: 2, text: "Tình trạng “nguy kịch” là:", answers: ['Có thể chờ điều trị', 'Không ảnh hưởng tính mạng', 'Đe dọa tính mạng, có nguy cơ tử vong nhanh', 'Chỉ cần theo dõi'], correct: "C", topic: "bai1" },
{ id: 3, text: "Vai trò của điều dưỡng cấp cứu KHÔNG bao gồm:", answers: ['Nhận định người bệnh', 'Phẫu thuật cấp cứu', 'Lập kế hoạch chăm sóc', 'Giao tiếp và ghi chép hồ sơ'], correct: "B", topic: "bai1" },
{ id: 4, text: "Trong cấp cứu, điều dưỡng phải làm gì đầu tiên?", answers: ['Làm xét nghiệm', 'Chuyển viện', 'Cho ăn', 'Đánh giá nhanh người bệnh'], correct: "D", topic: "bai1" },
{ id: 5, text: "Đánh giá ban đầu (Primary survey) tập trung vào:", answers: ['ABCD', 'Nội tiết', 'Tiêu hóa', 'Da liễu'], correct: "A", topic: "bai1" },
{ id: 6, text: "ABCD trong cấp cứu KHÔNG bao gồm:", answers: ['Airway', 'Breathing', 'Circulation', 'Digestion'], correct: "D", topic: "bai1" },

{ id: 8, text: "AMPLE là viết tắt của nội dung nào?", answers: ['Dị ứng, thuốc, tiền sử, bữa ăn, sự kiện', 'Huyết áp, mạch, nhiệt độ', 'Hô hấp, tuần hoàn', 'Xét nghiệm máu'], correct: "A", topic: "bai1" },

{ id: 12, text: "Phân loại cấp cứu nhằm mục đích:", answers: ['Sắp xếp ưu tiên xử trí', 'Thu phí', 'Điều trị lâu dài', 'Cho thuốc'], correct: "A", topic: "bai1" },

{ id: 16, text: "Theo dõi nước tiểu trong sốc cần:", answers: ['24h/lần', '6h/lần', '3h/lần', '1h/lần'], correct: "D", topic: "bai1" },
{ id: 17, text: "Dự phòng loét ép cần thay đổi tư thế:", answers: ['1 giờ/lần', '2 giờ/lần', '6 giờ/lần', '12 giờ/lần'], correct: "B", topic: "bai1" },
{ id: 18, text: "Một NB vào cấp cứu trong tình trạng hôn mê, thở yếu, SpO₂ 82%. Ưu tiên xử trí đầu tiên là:", answers: ['Đặt đường truyền', 'Khai thông đường thở và hỗ trợ hô hấp', 'Làm xét nghiệm máu', 'Chụp X-quang'], correct: "B", topic: "bai1" },
{ id: 19, text: "Trong đánh giá ban đầu, dấu hiệu nào cho thấy cần can thiệp ngay đường thở?", answers: ['Ho nhẹ', 'Thở đều', 'Có dị vật gây tắc', 'Nhịp tim nhanh'], correct: "C", topic: "bai1" },
{ id: 20, text: "NB đa chấn thương, thở nhanh, tím tái, nghi tràn khí màng phổi. Xử trí ưu tiên:", answers: ['Truyền dịch', 'Chọc giải áp màng phổi', 'Cho thuốc giảm đau', 'Theo dõi'], correct: "B", topic: "bai1" },

            let items = originalAnswers.map((text, idx) => ({ text }));
            items = shuffleArray([...items]);
            const displayList = items.map((item, newIdx) => ({ letter: String.fromCharCode(65+newIdx), text: item.text }));
            const found = displayList.find(item => item.text === correctText);
            return {
                displayList,
                correctLetterDisplay: found ? found.letter : "A"
            };
        }
    }
    
    function updateAllUI() {
        if (!currentQuestions.length) {
            liveScoreSpan.innerText = `0 / 0`;
            return;
        }
        let correctCount = 0;
        
        for (let q of currentQuestions) {
            const mapping = answersMapping.get(q.id);
            if (!mapping) continue;
            const selectedLetter = userSelections[q.id];
            const isCorrect = (selectedLetter && selectedLetter === mapping.correctLetterDisplay);
            if (isCorrect) correctCount++;
            
            const cardDiv = document.querySelector(`.question-card[data-qid='${q.id}']`);
            if (!cardDiv) continue;
            
            const iconSpan = cardDiv.querySelector('.status-icon');
            if (iconSpan) {
                if (!selectedLetter) {
                    iconSpan.innerHTML = "⚪ Chưa làm";
                    iconSpan.className = "status-icon status-none";
                } else if (isCorrect) {
                    iconSpan.innerHTML = "✓ Đúng";
                    iconSpan.className = "status-icon status-correct";
                } else {
                    iconSpan.innerHTML = "✗ Sai";
                    iconSpan.className = "status-icon status-wrong";
                }
            }
            
            const answerDivs = cardDiv.querySelectorAll('.answer-option');
            for (let ansDiv of answerDivs) {
                const letter = ansDiv.dataset.letter;
                const isSelected = (selectedLetter === letter);
                
                ansDiv.classList.remove('correct-highlight', 'wrong-highlight');
                
                if (isSelected) {
                    if (isCorrect) {
                        ansDiv.classList.add('correct-highlight');
                    } else {
                        ansDiv.classList.add('wrong-highlight');
                    }
                }
                
                let statusSpan = ansDiv.querySelector('.answer-status');
                if (!statusSpan) {
                    statusSpan = document.createElement('span');
                    statusSpan.className = 'answer-status';
                    ansDiv.appendChild(statusSpan);
                }
                
                if (isSelected && isCorrect) {
                    statusSpan.innerHTML = '✓';
                    statusSpan.className = 'answer-status check-mark';
                } else if (isSelected && !isCorrect) {
                    statusSpan.innerHTML = '✗';
                    statusSpan.className = 'answer-status cross-mark';
                } else {
                    statusSpan.innerHTML = '';
                }
            }
        }
        liveScoreSpan.innerText = `${correctCount} / ${currentQuestions.length}`;
    }
    
    function onAnswerClick(questionId, selectedLetter) {
        userSelections[questionId] = selectedLetter;
        
        const questionCard = document.querySelector(`.question-card[data-qid='${questionId}']`);
        if (questionCard) {
            const allOptions = questionCard.querySelectorAll('.answer-option');
            allOptions.forEach(opt => {
                const letter = opt.dataset.letter;
                if (letter === selectedLetter) {
                    opt.classList.add('selected');
                } else {
                    opt.classList.remove('selected');
                }
            });
        }
        updateAllUI();
    }
    
    // Hàm cuộn xuống câu hỏi đầu tiên
    function scrollToFirstQuestion() {
        setTimeout(() => {
            const firstQuestion = document.querySelector('.question-card');
            if (firstQuestion) {
                firstQuestion.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }, 100);
    }
    
    function renderFullQuiz() {
        if (!currentTopic) {
            scoreContainer.style.display = "none";
            questionsContainer.innerHTML = `
                <div class="welcome-message">
                    👋 Chào bạn!<br>
                    Hãy chọn một chủ đề bên trên để bắt đầu làm bài trắc nghiệm.
                </div>
            `;
            return;
        }
        
        currentQuestions = getFilteredQuestions();
        answersMapping.clear();
        for (let q of currentQuestions) {
            answersMapping.set(q.id, buildAnswerMapping(q));
        }
        userSelections = {};
        
        if (currentQuestions.length === 0) {
            scoreContainer.style.display = "block";
            questionsContainer.innerHTML = `<div class="card" style="text-align:center">⚠️ Không có câu hỏi cho chủ đề này.</div>`;
            liveScoreSpan.innerText = `0 / 0`;
            return;
        }
        
        let html = '';
        currentQuestions.forEach((q, idx) => {
            const mapping = answersMapping.get(q.id);
            if (!mapping) return;
            const { displayList } = mapping;
            let answersHtml = '';
            for (let ans of displayList) {
                answersHtml += `
                    <div class="answer-option" data-qid="${q.id}" data-letter="${ans.letter}">
                        <span class="answer-letter">${ans.letter}</span>
                        <span class="answer-text">${escapeHtml(ans.text)}</span>
                        <span class="answer-status"></span>
                    </div>
                `;
            }
            html += `
                <div class="question-card" data-qid="${q.id}">
                    <div class="question-text">
                        <span><strong>${idx+1}.</strong> ${escapeHtml(q.text)}</span>
                        <span class="status-icon status-none">⚪ Chưa làm</span>
                    </div>
                    <div class="answers">
                        ${answersHtml}
                    </div>
                </div>
            `;
        });
        
        questionsContainer.innerHTML = html;
        scoreContainer.style.display = "flex";
        
        document.querySelectorAll('.answer-option').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const qid = parseInt(el.dataset.qid);
                const letter = el.dataset.letter;
                if (!isNaN(qid) && letter) {
                    onAnswerClick(qid, letter);
                }
            });
        });
        
        updateAllUI();
        
        // Tự động cuộn xuống câu hỏi đầu tiên
        scrollToFirstQuestion();
    }
    
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function refreshQuiz() {
        renderFullQuiz();
    }
    
    function initEventListeners() {
        const topicBtns = document.querySelectorAll('.topic-btn');
        topicBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const topic = btn.dataset.topic;
                if (!topic) return;
                currentTopic = topic;
                topicBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                refreshQuiz();
            });
        });
        
        shuffleQuestionsToggle.addEventListener('change', (e) => {
            shuffleQuestions = e.target.checked;
            if (currentTopic) refreshQuiz();
        });
        
        shuffleAnswersToggle.addEventListener('change', (e) => {
            shuffleAnswers = e.target.checked;
            if (currentTopic) refreshQuiz();
        });
    }
    
    function init() {
        shuffleQuestions = shuffleQuestionsToggle.checked;
        shuffleAnswers = shuffleAnswersToggle.checked;
        initEventListeners();
        currentTopic = null;
        renderFullQuiz();
    }
    
    init();
</script>
</body>
</html>
