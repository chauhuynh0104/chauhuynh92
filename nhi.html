<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Trắc nghiệm Chăm sóc sức khoẻ tre em nâng cao - Chauhuynh0104</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #f0f4f8;
            font-family: system-ui, 'Segoe UI', 'Roboto', 'Noto Sans', sans-serif;
            padding: 16px 12px 80px;
            color: #0f172a;
        }

        .app-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            padding: 20px 18px;
            margin-bottom: 20px;
        }

        .quiz-header {
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quiz-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1e3c72, #2b4c7c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .badge {
            background: #eef2ff;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #1e3c72;
        }

        .topic-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .topic-btn {
            background: #eef2ff;
            border: none;
            padding: 10px 20px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            color: #1e293b;
            flex: 1 0 auto;
            text-align: center;
        }

        .topic-btn.active {
            background: #1e3c72;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 60px;
            margin-bottom: 20px;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: 0.3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #2d6a4f;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .question-card {
            background: white;
            border-radius: 24px;
            margin-bottom: 20px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            scroll-margin-top: 20px;
        }

        .question-text {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 16px;
            line-height: 1.4;
            background: #fefce8;
            padding: 12px;
            border-radius: 20px;
            border-left: 5px solid #eab308;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .status-icon {
            font-size: 0.85rem;
            font-weight: bold;
            background: white;
            border-radius: 40px;
            padding: 4px 12px;
            min-width: 95px;
            text-align: center;
        }

        .status-correct {
            color: #15803d;
            background: #dcfce7;
            border: 1px solid #86efac;
        }

        .status-wrong {
            color: #b91c1c;
            background: #fee2e2;
            border: 1px solid #fca5a5;
        }

        .status-none {
            color: #64748b;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: #f9f9ff;
            border-radius: 60px;
            border: 2px solid #e2edff;
            cursor: pointer;
            transition: 0.15s;
        }

        .answer-option:hover {
            background: #eef2ff;
        }

        .answer-option.correct-highlight {
            border: 3px solid #15803d;
            background: #e8f5e9;
        }

        .answer-option.wrong-highlight {
            border: 3px solid #dc2626;
            background: #fee2e2;
        }

        .answer-option.selected {
            background: #e0f2fe;
            border-color: #0284c7;
        }

        .answer-letter {
            font-weight: 800;
            background: #e2e8f0;
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 60px;
            font-size: 0.9rem;
        }

        .answer-text {
            flex: 1;
            font-size: 0.92rem;
        }

        .answer-status {
            font-size: 1.2rem;
            font-weight: bold;
            min-width: 44px;
            text-align: center;
        }

        .check-mark {
            color: #15803d;
        }

        .cross-mark {
            color: #dc2626;
        }

        .score-bar {
            background: #e6f7ed;
            padding: 14px 18px;
            border-radius: 60px;
            text-align: center;
            font-weight: bold;
            margin: 8px 0 16px;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .progress-text {
            background: #1e3c72;
            color: white;
            border-radius: 30px;
            padding: 4px 16px;
        }

        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            background: #fef9e3;
            border-radius: 28px;
            color: #b45309;
            font-weight: 500;
        }

        footer {
            text-align: center;
            margin-top: 32px;
            padding: 20px 10px;
            font-size: 0.75rem;
            color: #475569;
            border-top: 1px solid #cbd5e1;
        }
    </style>
</head>

<div class="app-container">
    <div class="card">
        <div class="quiz-header">
            <h2>📚 Trắc nghiệm Chăm sóc sức khoẻ trẻ em nâng cao</h2>
      
        </div>

        </div>

            <div class="toggle-item">

                <label class="switch">

            </div>

                <label class="switch">

                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <div id="scoreContainer" class="score-bar" style="display: none;">

    <div id="questionsContainer">

        </div>
    </div>
    
    <footer>© 2014-2026 Dr.Châu</footer>
</div>

     let currentTopic = null;
    let shuffleQuestions = true;
    let shuffleAnswers = true;
    let currentQuestions = [];
    let userSelections = {};
    let answersMapping = new Map();
    
    const questionsContainer = document.getElementById("questionsContainer");
    const scoreContainer = document.getElementById("scoreContainer");
    const shuffleQuestionsToggle = document.getElementById("shuffleQuestionsToggle");
    const shuffleAnswersToggle = document.getElementById("shuffleAnswersToggle");
    const liveScoreSpan = document.getElementById("liveScore");
    
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
    
    function getFilteredQuestions() {
        if (!currentTopic) return [];
        let filtered = QUESTION_SET.filter(q => currentTopic === "all" || q.topic === currentTopic);
        let result = [...filtered];
        if (shuffleQuestions) result = shuffleArray(result);
        return result;
    }
    
    function buildAnswerMapping(question) {
        const originalAnswers = question.answers;
        const correctIndex = question.correct.charCodeAt(0) - 65;
        const correctText = originalAnswers[correctIndex];
        
        if (!shuffleAnswers) {
            return {
                displayList: [
                    { letter: "A", text: originalAnswers[0] },
                    { letter: "B", text: originalAnswers[1] },
                    { letter: "C", text: originalAnswers[2] },
                    { letter: "D", text: originalAnswers[3] }
                ],
                correctLetterDisplay: question.correct
            };
        } else {
            let items = originalAnswers.map((text, idx) => ({ text }));
            items = shuffleArray([...items]);
            const displayList = items.map((item, newIdx) => ({ letter: String.fromCharCode(65+newIdx), text: item.text }));
            const found = displayList.find(item => item.text === correctText);
            return {
                displayList,
                correctLetterDisplay: found ? found.letter : "A"
            };
        }
    }
    
    function updateAllUI() {
        if (!currentQuestions.length) {
            liveScoreSpan.innerText = `0 / 0`;
            return;
        }
        let correctCount = 0;
        
        for (let q of currentQuestions) {
            const mapping = answersMapping.get(q.id);
            if (!mapping) continue;
            const selectedLetter = userSelections[q.id];
            const isCorrect = (selectedLetter && selectedLetter === mapping.correctLetterDisplay);
            if (isCorrect) correctCount++;
            
            const cardDiv = document.querySelector(`.question-card[data-qid='${q.id}']`);
            if (!cardDiv) continue;
            
            const iconSpan = cardDiv.querySelector('.status-icon');
            if (iconSpan) {
                if (!selectedLetter) {
                    iconSpan.innerHTML = "⚪ Chưa làm";
                    iconSpan.className = "status-icon status-none";
                } else if (isCorrect) {
                    iconSpan.innerHTML = "✓ Đúng";
                    iconSpan.className = "status-icon status-correct";
                } else {
                    iconSpan.innerHTML = "✗ Sai";
                    iconSpan.className = "status-icon status-wrong";
                }
            }
            
            const answerDivs = cardDiv.querySelectorAll('.answer-option');
            for (let ansDiv of answerDivs) {
                const letter = ansDiv.dataset.letter;
                const isSelected = (selectedLetter === letter);
                
                ansDiv.classList.remove('correct-highlight', 'wrong-highlight');
                
                if (isSelected) {
                    if (isCorrect) {
                        ansDiv.classList.add('correct-highlight');
                    } else {
                        ansDiv.classList.add('wrong-highlight');
                    }
                }
                
                let statusSpan = ansDiv.querySelector('.answer-status');
                if (!statusSpan) {
                    statusSpan = document.createElement('span');
                    statusSpan.className = 'answer-status';
                    ansDiv.appendChild(statusSpan);
                }
                
                if (isSelected && isCorrect) {
                    statusSpan.innerHTML = '✓';
                    statusSpan.className = 'answer-status check-mark';
                } else if (isSelected && !isCorrect) {
                    statusSpan.innerHTML = '✗';
                    statusSpan.className = 'answer-status cross-mark';
                } else {
                    statusSpan.innerHTML = '';
                }
            }
        }
        liveScoreSpan.innerText = `${correctCount} / ${currentQuestions.length}`;
    }
    
    function onAnswerClick(questionId, selectedLetter) {
        userSelections[questionId] = selectedLetter;
        
        const questionCard = document.querySelector(`.question-card[data-qid='${questionId}']`);
        if (questionCard) {
            const allOptions = questionCard.querySelectorAll('.answer-option');
            allOptions.forEach(opt => {
                const letter = opt.dataset.letter;
                if (letter === selectedLetter) {
                    opt.classList.add('selected');
                } else {
                    opt.classList.remove('selected');
                }
            });
        }
        updateAllUI();
    }
    
    // Hàm cuộn xuống câu hỏi đầu tiên
    function scrollToFirstQuestion() {
        setTimeout(() => {
            const firstQuestion = document.querySelector('.question-card');
            if (firstQuestion) {
                firstQuestion.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }, 100);
    }
    
    function renderFullQuiz() {
        if (!currentTopic) {
            scoreContainer.style.display = "none";
            questionsContainer.innerHTML = `
                <div class="welcome-message">
                    👋 Chào bạn!<br>
                    Hãy chọn một chủ đề bên trên để bắt đầu làm bài trắc nghiệm.
                </div>
            `;
            return;
        }
        
        currentQuestions = getFilteredQuestions();
        answersMapping.clear();
        for (let q of currentQuestions) {
            answersMapping.set(q.id, buildAnswerMapping(q));
        }
        userSelections = {};
        
        if (currentQuestions.length === 0) {
            scoreContainer.style.display = "block";
            questionsContainer.innerHTML = `<div class="card" style="text-align:center">⚠️ Không có câu hỏi cho chủ đề này.</div>`;
            liveScoreSpan.innerText = `0 / 0`;
            return;
        }
        
        let html = '';
        currentQuestions.forEach((q, idx) => {
            const mapping = answersMapping.get(q.id);
            if (!mapping) return;
            const { displayList } = mapping;
            let answersHtml = '';
            for (let ans of displayList) {
                answersHtml += `
                    <div class="answer-option" data-qid="${q.id}" data-letter="${ans.letter}">
                        <span class="answer-letter">${ans.letter}</span>
                        <span class="answer-text">${escapeHtml(ans.text)}</span>
                        <span class="answer-status"></span>
                    </div>
                `;
            }
            html += `
                <div class="question-card" data-qid="${q.id}">
                    <div class="question-text">
                        <span><strong>${idx+1}.</strong> ${escapeHtml(q.text)}</span>
                        <span class="status-icon status-none">⚪ Chưa làm</span>
                    </div>
                    <div class="answers">
                        ${answersHtml}
                    </div>
                </div>
            `;
        });
        
        questionsContainer.innerHTML = html;
        scoreContainer.style.display = "flex";
        
        document.querySelectorAll('.answer-option').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const qid = parseInt(el.dataset.qid);
                const letter = el.dataset.letter;
                if (!isNaN(qid) && letter) {
                    onAnswerClick(qid, letter);
                }
            });
        });
        
        updateAllUI();
        
        // Tự động cuộn xuống câu hỏi đầu tiên
        scrollToFirstQuestion();
    }
    
function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>"']/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}
    
    function refreshQuiz() {
        renderFullQuiz();
    }
    
    function initEventListeners() {
        const topicBtns = document.querySelectorAll('.topic-btn');
        topicBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const topic = btn.dataset.topic;
                if (!topic) return;
                currentTopic = topic;
                topicBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                refreshQuiz();
            });
        });
        
        shuffleQuestionsToggle.addEventListener('change', (e) => {
            shuffleQuestions = e.target.checked;
            if (currentTopic) refreshQuiz();
        });
        
        shuffleAnswersToggle.addEventListener('change', (e) => {
            shuffleAnswers = e.target.checked;
            if (currentTopic) refreshQuiz();
        });
    }
    
    function init() {
        shuffleQuestions = shuffleQuestionsToggle.checked;
        shuffleAnswers = shuffleAnswersToggle.checked;
        initEventListeners();
        currentTopic = null;
        renderFullQuiz();
    }
    
    init();
</script>
</body>
</html>
